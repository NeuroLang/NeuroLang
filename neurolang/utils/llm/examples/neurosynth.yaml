# Questions on the neurosynth engine with their SQUALL and Datalog
# queries: the few-shot examples of the LLM query assistant, the most
# similar to the user's question being put in the prompt. Every query is
# checked against the engine by the tests (NEUROLANG_TEST_DATA_DIR).
examples:
  - question: Which studies mention pain?
    squall: obtain every Study that mentions 'pain'.
    datalog: ans(s) :- mentions(s, 'pain')

  - question: List the terms of the vocabulary.
    squall: obtain every Term.
    datalog: ans(t) :- term(t)

  - question: Which terms are mentioned by at least one study?
    squall: obtain every Term that a Study mentions.
    datalog: ans(t) :- mentions(s, t)

  - question: Which voxels are reported by studies that mention pain?
    squall: obtain every Voxel (?i; ?j; ?k) that a Study that mentions 'pain' reports.
    datalog: ans(i, j, k) :- mentions(s, 'pain'), reports(s, i, j, k)

  - question: Which studies mention either language or speech?
    squall: obtain every Study that mentions 'language' or mentions 'speech'.
    datalog: |-
      language_or_speech(s) :- mentions(s, 'language')
      language_or_speech(s) :- mentions(s, 'speech')
      ans(s) :- language_or_speech(s)

  - question: Which studies mention both pain and emotion?
    datalog: |-
      ans(s) :- term_in_study_tfidf(s, 'pain', v), term_in_study_tfidf(s, 'emotion', w), (v > 0.03), (w > 0.03)

  - question: Which studies do not mention pain?
    datalog: ans(s) :- study(s), ~mentions(s, 'pain')

  - question: Give the TF-IDF weight of the term reward in each study where it is above 0.1.
    squall: obtain every Weighted_mention (?s; ?t; ?w) such that ?t is 'reward' and ?w is greater than 0.1.
    datalog: ans(s, w) :- weighted_mention(s, 'reward', w), (w > 0.1)

  - question: Which terms does the study 10022492 mention?
    squall: obtain every Term that 10022492 mentions.
    datalog: ans(t) :- mentions(10022492, t)

  - question: Which terms co-occur with fear in a study?
    squall: obtain every Term that a Study that mentions 'fear' mentions.
    datalog: ans(t) :- mentions(s, 'fear'), mentions(s, t)

  - question: How many studies are there?
    squall: obtain every Count of the Study.
    datalog: |-
      study_count(n) :- AGGREGATE[](study(s) @ count(s)) = n
      ans(n) :- study_count(n)

  - question: How many studies mention each term?
    squall: |-
      define as Term_study_count for every Term ;
          where every Count of the Study that mentions the Term.
      obtain every Term_study_count.
    datalog: |-
      term_study_count(t, n) :- AGGREGATE[t](mentions(s, t) @ count(s)) = n
      ans(t, n) :- term_study_count(t, n)

  - question: How many terms does each study mention?
    datalog: |-
      study_term_count(s, n) :- AGGREGATE[s](mentions(s, t) @ count(t)) = n
      ans(s, n) :- study_term_count(s, n)

  - question: What is the highest TF-IDF weight of the term attention?
    datalog: |-
      attention_max(m) :- AGGREGATE[](weighted_mention(s, 'attention', w) @ max(w)) = m
      ans(m) :- attention_max(m)

  - question: Define the studies about faces, then list the voxels they report.
    squall: |-
      define as Face_study every Study that mentions 'face'.
      obtain every Voxel (?i; ?j; ?k) that a Face_study reports.
    datalog: |-
      face_study(s) :- mentions(s, 'face')
      ans(i, j, k) :- face_study(s), reports(s, i, j, k)

  - question: What is the probability that a voxel is reported, given that the study mentions auditory?
    squall: |-
      define as Activation every Peak_reported (?i; ?j; ?k; ?s) such that ?s is a Selected_study.
      define as Term_association every Term_in_study_tfidf (?s; ?t; ?tfidf) such that ?s is a Selected_study.
      define as Activation_given_term with probability
          every Activation (?i; ?j; ?k; _)
          conditioned to every Term_association (?s; ?t; _) such that ?t is 'auditory'.
      obtain every Activation_given_term (?i; ?j; ?k; ?p).
    datalog: |-
      activation(i, j, k, s) :- peak_reported(i, j, k, s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      ans(i, j, k, p) :- PROB[activation(i, j, k, s) // term_association(s, 'auditory')] = p

  - question: What is the probability that a study mentions each term?
    squall: |-
      define as Mentioned_term every Term that a Selected_study mentions.
      define as Term_probability with inferred probability every Mentioned_term.
      obtain every Term_probability (?t; ?p).
    datalog: |-
      mentioned_term(t) :- selected_study(s), mentions(s, t)
      ans(t, p) :- PROB[mentioned_term(t)] = p

  # Euclidean distances: voxels are indices of the 1 mm MNI grid, the MNI
  # point (x, y, z) being the voxel (x + 98, y + 134, z + 72), so that a
  # distance between voxels is in mm. The left amygdala, MNI (-24, -4, -20),
  # is the voxel (74, 130, 52).
  - question: Which studies report an activation within 6 mm of the left amygdala, MNI (-24, -4, -20)?
    squall: obtain every Study that reports a Voxel (?i; ?j; ?k) such that euclidean(?i, ?j, ?k, 74, 130, 52) is lower than 6.
    datalog: ans(s) :- reports(s, i, j, k), (euclidean(i, j, k, 74, 130, 52) < 6)

  - question: Which terms are mentioned by more than 50 of the studies activating within 6 mm of the voxel (74, 130, 52), and by how many?
    squall: |-
      define as Roi_study every Study that reports a Voxel (?i; ?j; ?k) such that euclidean(?i, ?j, ?k, 74, 130, 52) is lower than 6.
      define as Roi_term_count for every Term ; where every Count of the Roi_study that mentions the Term.
      obtain every Roi_term_count (?t; ?n) such that ?n is greater than 50.
    datalog: |-
      roi_study(s) :- reports(s, i, j, k), (euclidean(i, j, k, 74, 130, 52) < 6)
      roi_term(t, s) :- roi_study(s), mentions(s, t)
      term_count(t, n) :- AGGREGATE[t](roi_term(t, s) @ count(s)) = n
      ans(t, n) :- term_count(t, n), (n > 50)

  - question: How many studies report each voxel within 5 mm of the MNI point (-24, -4, -20)?
    datalog: |-
      near_peak(i, j, k, s) :- reports(s, i, j, k), (euclidean(i, j, k, 74, 130, 52) < 5)
      voxel_count(i, j, k, n) :- AGGREGATE[i, j, k](near_peak(i, j, k, s) @ count(s)) = n
      ans(i, j, k, n) :- voxel_count(i, j, k, n)

  - question: What is the probability that a study activates within 10 mm of the left amygdala, voxel (74, 130, 52), given that it mentions fear?
    datalog: |-
      roi_study(s) :- reports(s, i, j, k), (euclidean(i, j, k, 74, 130, 52) < 10)
      active_roi(s) :- roi_study(s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      ans(p) :- PROB[active_roi(s) // term_association(s, 'fear')] = p

  # Bayes factors (reverse inference): BF = P(T | R) / P(T | not R)
  # = (P(R, T) / P(R)) / ((P(T) - P(R, T)) / (1 - P(R))), the probabilities
  # being over the uniform choice of a study, selected_study; a BF above
  # sqrt(10), about 3.16, is substantial evidence.
  - question: Decode the left amygdala with Bayes factors, which terms are associated with activations within 10 mm of the MNI point (-24, -4, -20), with a Bayes factor above 3.16?
    squall: |-
      define as Roi_study (?r; ?s) where Peak_reported (?i, ?j, ?k, ?s) and euclidean(?i, ?j, ?k, 74, 130, 52) is lower than 10 and ?r is 'left amygdala'.
      define as Active_region every Roi_study (?r; ?s) such that ?s is a Selected_study.
      define as Region_probability with inferred probability every Active_region (?r; _).
      define as Mentioned_term every Term that a Selected_study mentions.
      define as Term_probability with inferred probability every Mentioned_term.
      define as Cooccurrence (?r; ?t) where Roi_study (?r, ?s) and ?s is a Selected_study and ?s mentions ?t.
      define as Joint_probability with inferred probability every Cooccurrence (?r; ?t).
      define as Bayes_factor (?r; ?t; ?bf)
          where Joint_probability (?r, ?t, ?p_rt)
          and Region_probability (?r, ?p_r)
          and Term_probability (?t, ?p_t)
          and ?bf is (?p_rt / ?p_r) / ((?p_t - ?p_rt) / (1.0 - ?p_r)).
      obtain every Bayes_factor (?r; ?t; ?bf) such that ?bf is greater than 3.16.
    datalog: |-
      roi_study(s) :- reports(s, i, j, k), (euclidean(i, j, k, 74, 130, 52) < 10)
      active_roi(s) :- selected_study(s), roi_study(s)
      mentioned_term(t) :- selected_study(s), mentions(s, t)
      cooccurrence(t, s) :- selected_study(s), roi_study(s), mentions(s, t)
      roi_probability(p_r) :- PROB[active_roi(s)] = p_r
      term_probability(t, p_t) :- PROB[mentioned_term(t)] = p_t
      joint_probability(t, p_rt) :- PROB[cooccurrence(t, s)] = p_rt
      bayes_factor(t, bf) :- joint_probability(t, p_rt), roi_probability(p_r), term_probability(t, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
      ans(t, bf) :- bayes_factor(t, bf), (bf > 3.16)

  - question: What is the Bayes factor of the term fear for activations within 10 mm of the voxel (74, 130, 52)?
    squall: |-
      define as Roi_study (?r; ?s) where Peak_reported (?i, ?j, ?k, ?s) and euclidean(?i, ?j, ?k, 74, 130, 52) is lower than 10 and ?r is 'roi'.
      define as Active_region every Roi_study (?r; ?s) such that ?s is a Selected_study.
      define as Region_probability with inferred probability every Active_region (?r; _).
      define as Mentioned_term every Term that a Selected_study mentions.
      define as Term_probability with inferred probability every Mentioned_term.
      define as Cooccurrence (?r; ?t) where Roi_study (?r, ?s) and ?s is a Selected_study and ?s mentions ?t.
      define as Joint_probability with inferred probability every Cooccurrence (?r; ?t).
      define as Bayes_factor (?r; ?t; ?bf)
          where Joint_probability (?r, ?t, ?p_rt)
          and Region_probability (?r, ?p_r)
          and Term_probability (?t, ?p_t)
          and ?bf is (?p_rt / ?p_r) / ((?p_t - ?p_rt) / (1.0 - ?p_r)).
      obtain every Bayes_factor (?r; ?t; ?bf) such that ?t is 'fear'.
    datalog: |-
      roi_study(s) :- reports(s, i, j, k), (euclidean(i, j, k, 74, 130, 52) < 10)
      active_roi(s) :- selected_study(s), roi_study(s)
      mentioned_term(t) :- selected_study(s), mentions(s, t)
      cooccurrence(t, s) :- selected_study(s), roi_study(s), mentions(s, t)
      roi_probability(p_r) :- PROB[active_roi(s)] = p_r
      term_probability(t, p_t) :- PROB[mentioned_term(t)] = p_t
      joint_probability(t, p_rt) :- PROB[cooccurrence(t, s)] = p_rt
      bayes_factor(t, bf) :- joint_probability(t, p_rt), roi_probability(p_r), term_probability(t, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
      ans(bf) :- bayes_factor('fear', bf)
