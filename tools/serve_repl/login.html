<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroLang REPL: log in</title>
<meta name="theme-color" content="#0b1220">
<script>
  // The theme of the REPL before the first paint: the saved choice, or the system's.
  (() => {
    let choice = "system";
    try { choice = localStorage.getItem("neurolang-repl-theme") || choice; } catch {}
    const light = choice === "light" || (choice === "system" && matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.dataset.theme = light ? "light" : "dark";
  })();
</script>
<style>
  /* The login page of neurolang-repl-serve --users: one file, as the page it
     comes before, with its colours (doc/_static/repl/index.html). */
  :root {
    color-scheme: dark;
    --ground: #0b1220; --panel: #0f1a2e; --raised: #15223b; --sunken: #0a1322;
    --border: #22324f; --border-strong: #34476b; --hover: #1a2944;
    --text: #e8eef9; --muted: #a9b8d0; --faint: #7d8daa;
    --accent: #5aa3f6; --accent-hover: #7db7f8; --on-accent: #06121f; --accent-soft: #15315a;
    --bad: #ff8f87; --bad-soft: #3a1418; --ok: #4ccf8a;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .4);
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --radius: 8px; --radius-lg: 14px;
  }
  :root[data-theme=light] {
    color-scheme: light;
    --ground: #f3f6fb; --panel: #ffffff; --raised: #ffffff; --sunken: #f6f8fc;
    --border: #d9e1ee; --border-strong: #b9c6db; --hover: #edf2f9;
    --text: #0f1b33; --muted: #4a5874; --faint: #66748f;
    --accent: #1a63c2; --accent-hover: #15529f; --on-accent: #ffffff; --accent-soft: #e6effb;
    --bad: #b42318; --bad-soft: #fdecea; --ok: #1d7a4b;
    --shadow: 0 1px 2px rgb(15 27 51 / .08), 0 12px 32px rgb(15 27 51 / .12);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: 1.5rem 1rem; background: var(--ground); color: var(--text);
    font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 24rem; }
  .brand { display: grid; justify-items: center; gap: .6rem; margin-bottom: 1.5rem; text-align: center; }
  .brand img { width: 4.25rem; height: auto; }
  .logo-light, :root[data-theme=light] .logo-dark { display: none; }
  :root[data-theme=light] .logo-light { display: block; }
  h1 { margin: 0; font-size: 1.45rem; line-height: 1.2; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .brand p { margin: 0; color: var(--muted); font-size: .95rem; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 1.5rem;
  }
  form { display: grid; gap: 1rem; }
  label { display: grid; gap: .35rem; font-size: .9rem; font-weight: 600; }
  label .hint { font-weight: 400; color: var(--muted); }
  input, textarea {
    width: 100%; min-height: 2.75rem; padding: .6rem .75rem; font: inherit; font-weight: 400;
    color: var(--text); background: var(--sunken); border: 1px solid var(--border-strong);
    border-radius: var(--radius); transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 6rem; resize: vertical; }
  input:hover, textarea:hover { border-color: var(--faint); }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input:focus-visible, textarea:focus-visible { border-color: var(--accent); outline-offset: 0; }
  .secret { position: relative; }
  .secret input { padding-right: 3.1rem; }
  .secret button {
    position: absolute; top: 50%; right: .3rem; transform: translateY(-50%);
    display: grid; place-items: center; width: 2.25rem; height: 2.25rem; padding: 0;
    color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer;
  }
  .secret button:hover { color: var(--text); background: var(--hover); }
  .secret svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .secret .eye-off { display: none; }
  .secret [aria-pressed=true] .eye { display: none; }
  .secret [aria-pressed=true] .eye-off { display: block; }
  .button {
    display: inline-flex; align-items: center; justify-content: center; gap: .6rem; width: 100%;
    min-height: 2.75rem; padding: .6rem 1rem; font: inherit; font-weight: 600; text-decoration: none;
    color: var(--text); background: var(--raised); border: 1px solid var(--border-strong);
    border-radius: var(--radius); cursor: pointer; transition: background .15s, border-color .15s;
  }
  .button:hover { background: var(--hover); border-color: var(--faint); }
  .button.primary { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .button:disabled { opacity: .6; cursor: progress; }
  #message {
    margin: 0 0 1rem; padding: .6rem .75rem; font-size: .9rem; color: var(--bad);
    background: var(--bad-soft); border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
  }
  #message:empty { display: none; }
  .or {
    display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: var(--faint);
    font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
  }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .methods { display: grid; gap: .75rem; }
  .methods p { margin: .5rem 0 0; font-size: .85rem; color: var(--muted); text-align: center; }
  #orcid svg { width: 1.4rem; height: 1.4rem; flex: none; }
  #request h2 { margin: 0 0 .5rem; font-size: 1.05rem; }
  #request p { margin: 0 0 1rem; }
  #request a { color: var(--accent); }
  .note { margin: 1rem 0 0; font-size: .9rem; color: var(--muted); }
  .note:empty { display: none; }
  @media (max-width: 26rem) { .card { padding: 1.15rem; } body { place-items: start center; padding-top: 2rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

    <h1>Neuro<span>Lang</span> REPL</h1>
    <p>Log in to use this server's REPL.</p>
  </header>
  <div class="card">
    <p id="message" role="alert"></p>
    <form id="login">
      <label>Name
        <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label>Password
        <span class="secret">
          <input name="password" id="password" type="password" autocomplete="current-password" required>
          <button type="button" id="reveal" aria-pressed="false" aria-controls="password" aria-label="Show the password" title="Show the password">
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </span>
      </label>
      <button class="button primary" id="login-in">Log in</button>
    </form>
    <div id="alternatives" hidden>
      <div class="or" role="separator"><span>or</span></div>
      <div class="methods">
        <div id="orcid" hidden>
          <!-- ORCID's iD icon, as orcid.org serves it (assets/vectors/orcid.logo.icon.svg) -->
          <a class="button" id="orcid-in" href="/login/orcid">
            <svg viewBox="0 0 72 72" aria-hidden="true"><path fill="#A6CE39" d="M72,36 C72,55.884375 55.884375,72 36,72 C16.115625,72 0,55.884375 0,36 C0,16.115625 16.115625,0 36,0 C55.884375,0 72,16.115625 72,36 Z"/><g transform="translate(18.868966, 12.910345)" fill="#FFF"><polygon points="5.03734929 39.1250878 0.695429861 39.1250878 0.695429861 9.14431787 5.03734929 9.14431787 5.03734929 22.6930505 5.03734929 39.1250878"/><path d="M11.409257,9.14431787 L23.1380784,9.14431787 C34.303014,9.14431787 39.2088191,17.0664074 39.2088191,24.1486995 C39.2088191,31.846843 33.1470485,39.1530811 23.1944669,39.1530811 L11.409257,39.1530811 L11.409257,9.14431787 Z M15.7511765,35.2620194 L22.6587756,35.2620194 C32.49858,35.2620194 34.7541226,27.8438084 34.7541226,24.1486995 C34.7541226,18.1301509 30.8915059,13.0353795 22.4332213,13.0353795 L15.7511765,13.0353795 L15.7511765,35.2620194 Z" id="Shape"/><path d="M5.71401206,2.90182329 C5.71401206,4.441452 4.44526937,5.72914146 2.86638958,5.72914146 C1.28750978,5.72914146 0.0187670918,4.441452 0.0187670918,2.90182329 C0.0187670918,1.33420133 1.28750978,0.0745051096 2.86638958,0.0745051096 C4.44526937,0.0745051096 5.71401206,1.36219458 5.71401206,2.90182329 Z"/></g></svg>
            Sign in with ORCID
          </a>
        </div>
        <div id="guest" hidden>
          <button type="button" class="button" id="guest-in">Continue as a guest</button>
          <p>A guest's AI assistant answers with an API key you give in the page.</p>
        </div>
      </div>
    </div>
    <div id="request" hidden>
      <h2>Ask for an account</h2>
      <p>You signed in with ORCID as <strong id="request-name"></strong> (<a id="request-id" target="_blank" rel="noopener"></a>), who has no account here yet.</p>
      <form id="ask">
        <label>A message for the admins <span class="hint">Who you are, what you would use it for.</span>
          <textarea name="message" maxlength="1000"></textarea>
        </label>
        <button class="button primary">Ask for an account</button>
      </form>
      <p class="note" id="request-note"></p>
    </div>
  </div>
</main>
<script>
// Where to go once logged in: a page of this site only (read as the browser
// reads an address, which drops tabs and line breaks).
function next() {
  const target = new URL(new URLSearchParams(location.search).get("next") || "/", location.origin);
  return target.origin === location.origin ? target.pathname + target.search + target.hash : "/";
}
// The API keys the REPL kept in this browser are those of who logged in
// before: forgotten.
try {
  for (const storage of [localStorage, sessionStorage]) {
    for (const name of Object.keys(storage)) if (name.startsWith("neurolang-repl-llm")) storage.removeItem(name);
  }
} catch {} // no storage here
const $ = (id) => document.getElementById(id);
// Back from ORCID: ?orcid= says how it went.
const back = new URLSearchParams(location.search).get("orcid");
// Guests and ORCID, if the server lets them in (not when asking for an account).
fetch("/login/options").then((response) => response.json()).then(({ guests, orcid }) => {
  $("guest").hidden = !guests || back === "request";
  $("orcid").hidden = !orcid || back === "request";
  $("orcid-in").href = `/login/orcid?next=${encodeURIComponent(next())}`;
  $("alternatives").hidden = $("guest").hidden && $("orcid").hidden;
}).catch(() => {});
// Back from ORCID: what went wrong, or an iD of no user, who may ask for an account.
const ORCID_SAYS = {
  cancelled: "You did not sign in at ORCID.",
  expired: "The sign-in with ORCID took too long, or began in another browser: sign in again.",
  failed: "ORCID did not tell who you are: sign in again.",
};
if (ORCID_SAYS[back]) $("message").textContent = ORCID_SAYS[back];
if (back === "request") {
  fetch("/login/request").then((response) => response.ok ? response.json() : Promise.reject()).then((who) => {
    $("login").hidden = true;
    $("request").hidden = false;
    $("request-name").textContent = who.name || who.orcid;
    Object.assign($("request-id"), { textContent: who.orcid, href: `https://orcid.org/${who.orcid}` });
    if (who.requested) {
      $("request-note").textContent = "Your request waits for an admin: you may send it again with another message.";
    }
  }).catch(() => { $("message").textContent = ORCID_SAYS.expired; });
}
// A button that waits for the server says so, and is back when it failed.
async function waiting(button, text, work) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = text;
  $("message").textContent = "";
  try {
    await work();
  } catch {
    $("message").textContent = "The server did not answer: try again.";
  }
  button.disabled = false;
  button.textContent = label;
}
const failure = (response) => response.json().catch(() => ({ error: response.statusText })).then((answer) => answer.error);
$("ask").addEventListener("submit", (event) => {
  event.preventDefault();
  waiting(event.submitter ?? event.target.querySelector("button"), "Sending…", async () => {
    const response = await fetch("/login/request", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: new FormData(event.target).get("message") }),
    });
    $("request-note").textContent = response.ok
      ? "Your request is sent: an admin adds you to the server, and you sign in with ORCID then."
      : await failure(response);
  });
});
$("guest-in").addEventListener("click", (event) => {
  waiting(event.currentTarget, "Starting…", async () => {
    const response = await fetch("/login/guest", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    if (response.ok) return location.assign(next());
    $("message").textContent = await failure(response);
  });
});
$("login").addEventListener("submit", (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  waiting($("login-in"), "Logging in…", async () => {
    const response = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: form.get("name"), password: form.get("password") }),
    });
    if (response.ok) return location.assign(next());
    $("message").textContent = await failure(response);
  });
});
// The password is shown on request (and a password manager still fills it).
$("reveal").addEventListener("click", (event) => {
  const shown = $("password").type === "password";
  $("password").type = shown ? "text" : "password";
  const label = shown ? "Hide the password" : "Show the password";
  Object.assign(event.currentTarget, { title: label });
  event.currentTarget.setAttribute("aria-label", label);
  event.currentTarget.setAttribute("aria-pressed", String(shown));
});
</script>
