name: Tests

on:
  push:
    branches: [master]
  # Every pull request, whatever its base: a pull request stacked on the
  # branch of another one is checked too.
  pull_request:

# A push to a pull request cancels its runs still going; each run of master
# is a group of its own, never cancelled nor kept waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# A pull request runs the tests of the packages it changes, on every Python
# version, and those of the packages depending on them, on the oldest one:
# a change to the applications does not run the tests of the engine. A push
# to master runs all of them, with the coverage.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # On a pull request, the files it changes with respect to its base, as
    # GitHub lists them: those of a pull request stacked on another one are
    # its own, not those of the pull request below it.
    - name: Find the changed packages
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          nl_expr:
            - 'packages/nl_expr/**'
          nl_core:
            - 'packages/nl_core/**'
          neurolang:
            - 'packages/neurolang/**'
          neurolang_apps:
            - 'packages/neurolang_apps/**'
            # The REPL's page and bundle are tested with the applications,
            # and so are the documentation's examples and Python page.
            - 'doc/_static/repl/**'
            - 'doc/make_repl_bundle.py'
            - 'doc/*.rst'
            - 'doc/sphinxext/**'
            - 'doc/tools/**'
          shared:
            - 'pyproject.toml'
            - 'conftest.py'
            - '.github/workflows/tests.yml'

    - name: Plan the test jobs
      id: plan
      env:
        CHANGES: ${{ steps.changes.outputs.changes }}
        EVENT: ${{ github.event_name }}
      run: python .github/plan_tests.py

  test:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: test ${{ matrix.package }} (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up uv and Python ${{ matrix.python }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python }}
        enable-cache: true

    - name: Cache downloaded atlases and datasets
      uses: actions/cache@v4
      with:
        path: |
          ~/neurolang_data
          ~/nilearn_data
        key: datasets-${{ runner.os }}-v1

    - name: Install ${{ matrix.dist }} and the packages it depends on
      run: |
        uv sync --package ${{ matrix.dist }} ${{ matrix.extras }}
        uv pip install pytest-timeout pytest-xdist pytest-cov

    # Tests run on every core of the runner (pytest-xdist); on a push to
    # master, those of the first Python version also collect their
    # package's coverage, which the coverage job combines.
    - name: Run the tests of ${{ matrix.package }}
      env:
        COVERAGE_FILE: .coverage.${{ matrix.package }}
        COVERAGE: ${{ github.event_name == 'push' && matrix.python == '3.12' && 'yes' || '' }}
      run: >-
        uv run --no-sync python -m pytest packages/${{ matrix.package }}
        -n auto --tb=short --timeout=600 -ra
        ${COVERAGE:+--cov=${{ matrix.package }}}
      timeout-minutes: 30

    - name: Run the examples of the documentation's Python page
      if: matrix.package == 'neurolang_apps'
      run: uv run --no-sync python -m pytest doc/tutorial_python.rst --doctest-glob=tutorial_python.rst -v --tb=short
      timeout-minutes: 10

    - name: Keep the coverage of ${{ matrix.package }}
      if: github.event_name == 'push' && matrix.python == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.package }}
        path: .coverage.${{ matrix.package }}
        include-hidden-files: true

  # The coverage of each package, collected by its test job, combined: no
  # process runs the tests of all the packages.
  coverage:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Get the coverage of the packages
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        merge-multiple: true

    - name: Combine the coverage and make the badge
      run: |
        uvx coverage combine .coverage.*
        uvx coverage xml
        uvx coverage report
        mkdir -p badges
        uvx --from "genbadge[coverage]" genbadge coverage -o badges/coverage.svg -i coverage.xml

    # The badge has its branch: the benchmarks' dashboard is deployed to
    # gh-pages with keep_files false.
    - name: Publish badge to the badges branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: badges
        publish_dir: ./badges
        keep_files: false

  # The one check to require: it passes when every planned test job passed.
  tests:
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check the test jobs
      run: |
        test "${{ needs.plan.result }}" = success
        test "${{ needs.test.result }}" = success -o "${{ needs.test.result }}" = skipped
