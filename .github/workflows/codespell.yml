---
name: Codespell

on:
  push:
    branches: [master]
  # Every pull request, whatever its base: a pull request stacked on the
  # branch of another one is checked too.
  pull_request:

# A push to a pull request cancels its runs still going; each run of master
# is a group of its own, never cancelled nor kept waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_list: anc, ND, intensional

