name: Layers

on:
  push:
    branches: [master]
  # Every pull request, whatever its base: a pull request stacked on the
  # branch of another one is checked too.
  pull_request:

# A push to a pull request cancels its runs still going; each run of master
# is a group of its own, never cancelled nor kept waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  import-linter:
    name: Check the imports between the layers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import-linter
        run: python -m pip install import-linter
      - name: Check the layers
        run: lint-imports --config .importlinter
        env:
          PYTHONPATH: packages/nl_expr:packages/nl_core:packages/neurolang:packages/nl_tracts:packages/neurolang_apps
