name: Deploy Documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the packages and the doc dependencies
        run: uv sync --all-packages --extra doc

      - name: Build HTML documentation
        run: uv run --no-sync make -C doc html SPHINXOPTS="--keep-going"

      # The in-browser REPL (doc/_static/repl) downloads NeuroLang's wheels and
      # the data of the neurosynth engine from beside its page. The step builds
      # the engine, which keeps in its data directory the tables the page
      # would take a minute and a half to find (neurolang_apps.utils.
      # engine_cache), so that they are in the data zip, and stops if it kept
      # none. If this step fails, the documentation is still deployed, with
      # the REPL's page telling that it could not start.
      - name: Build the in-browser REPL's bundle
        continue-on-error: true
        run: uv run --no-sync python doc/make_repl_bundle.py doc/_build/html/_static/repl

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: doc/_build/html
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.NEUROLANG_GITHUB_IO_DEPLOY_KEY }}
          external_repository: neurolang/neurolang.github.io
          publish_branch: master
          publish_dir: ./doc/_build/html
          force_orphan: true
