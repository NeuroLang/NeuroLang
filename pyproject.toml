# NeuroLang's repository is a uv workspace of four packages, each of which
# imports only those before it (see .importlinter):
#
#   packages/nl_expr         the expression engine
#   packages/nl_core         relational algebra, Datalog, probabilistic Datalog
#   packages/neurolang       the language: parsers, frontends, regions
#   packages/neurolang_apps  the command line, terminal interface, engines
#
# The root is a project, never published, that installs them for
# development: ``uv pip install -e ".[apps,dev,doc]"``, or
# ``uv sync --all-packages --all-extras --no-extra embeddings`` (torch, of
# the extra embeddings, has no wheel for every platform).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurolang-workspace"
version = "0"
description = "The packages of NeuroLang, for development"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "nl-expr",
    "nl-core",
    "neurolang",
]

[project.optional-dependencies]
apps = ["neurolang-apps"]
tui = ["neurolang-apps[tui]"]
llm = ["neurolang-apps[llm]"]
embeddings = ["neurolang-apps[embeddings]"]
ras-polars = ["nl-core[ras-polars]"]
dev = [
    "nl-core[dev]",
    "neurolang[dev]",
    "pytest>=7.0",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "import-linter",
]
doc = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design>=0.5",
    "sphinx-gallery",
    "numpydoc",
]

# The command serving the REPL in the browser on this machine, from the
# checkout: ``uv run --extra apps neurolang-repl-serve``.
[project.scripts]
neurolang-repl-serve = "serve_repl:main"

# The project's only package is that of the command, tools/serve_repl.
[tool.hatch.build.targets.wheel]
packages = ["tools/serve_repl"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nl-expr = { workspace = true }
nl-core = { workspace = true }
neurolang = { workspace = true }
neurolang-apps = { workspace = true }

[tool.pytest.ini_options]
norecursedirs = [".git", "_build", "tmp*", "scratch*", "deprecated*"]
addopts = "--doctest-glob=doc/tutorial_squall.rst"

[tool.coverage.run]
omit = [
    "*/test_*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
]

[tool.black]
"line-length" = 79

[tool.isort]
multi_line_output = 3
include_trailing_comma = false
force_grid_wrap = 0
use_parentheses = true
line_length = 79
combine_as_imports = true

[tool.pydocstyle]
# D211 conflicts with D203; D212 conflicts with D213 — suppress the unwanted variants
ignore = ["D211", "D212"]

[tool.bandit]
skips = ["B101"]
