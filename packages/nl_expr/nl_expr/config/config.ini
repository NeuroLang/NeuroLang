[DEFAULT]
debug = False
expressionTypePrinting = True
# threshold for CD_relations.py
cardinalRelationThreshold = 0.8

[RAS]
# which backend to use for RAS = pandas or polars
backend = pandas

[CHASE]
# Maximum number of chase iterations before raising an error.
# This prevents infinite loops with cyclic or very deep recursive data.
# Set to 0 to disable the limit (use with caution).
max_iterations = 10000
# Sort join predicates by size (smallest first) as a heuristic for
# join ordering. Disable when using the Polars backend, which has its
# own query optimizer that handles join reordering.
sort_join_predicates = True

[ONTOLOGIES]
structural_knowledge_namespace = 'neurolang:'


[PROBABILISTIC_SOLVER]
check_unate = True
