[DEFAULT]
debug = False
expressionTypePrinting = True
# threshold for CD_relations.py
cardinalRelationThreshold = 0.8

[RAS]
# which backend to use for RAS = pandas or polars
backend = pandas

[CHASE]
# Maximum number of chase iterations before raising an error.
# This prevents infinite loops with cyclic or very deep recursive data.
# Set to 0 to disable the limit (use with caution).
max_iterations = 10000
# Sort join predicates by size (smallest first) as a heuristic for
# join ordering. Disable when using the Polars backend, which has its
# own query optimizer that handles join reordering.
sort_join_predicates = True

[MAGIC_SETS]
# In the query's own rule, a stored relation of at most this many tuples
# binds its variables for magic sets without a constant (the terms the
# query keeps, chosen(t), in ans(t, x) :- chosen(t), p(t, x)); a larger
# one (all studies, all the voxels of a mask, the 856 tasks of the
# Cognitive Atlas) binds nothing: its magic set would restrict little, at
# the cost of a join, or make a query of every one of its values (every
# task's description embedded as a query text).
seed_rows = 100

[ONTOLOGIES]
structural_knowledge_namespace = 'neurolang:'


[PROBABILISTIC_SOLVER]
check_unate = True
# Compute the plans of sums of products of probabilities (joins summed
# by projections) as contractions of sparse tensors, rather than with
# relational algebra.
contractions = True
# Products of tensors of at most this many cells, as their result, are
# computed over dense arrays.
dense_cells = 1000000
# Lifting tests whether columns of a relation determine another: a random
# sample of this many of its rows is read first, and two with one key and
# two values disprove it, before the distinct values of the whole relation
# are counted.
function_sample_rows = 10000
