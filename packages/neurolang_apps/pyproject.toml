[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "neurolang-apps"
dynamic = ["version"]
description = "NeuroLang's applications: command line, terminal interface, query assistant and engines"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
keywords = ["neuroimaging", "meta-analysis", "datalog", "command line"]
dependencies = [
    "neurolang",
    "numpy",
    "scipy",
    "pandas>=1.5",
    "nibabel>=5.0.0",
    "nilearn>=0.10.0",
    "lark>=1.1.2",
    "matplotlib",
    "scikit-learn",
    "pyyaml>=6.0",
    # The neurostore engine reads the parquet files of its releases.
    "pyarrow",
]

[project.scripts]
neurolang-query = "neurolang_apps.utils.cli:main"
neurolang-feedback-server = "neurolang_apps.utils.llm.feedback_server:main"

[project.optional-dependencies]
tui = [
    "prompt-toolkit>=3.0.36",
    "rich>=13.0",
]
llm = [
    "httpx>=0.27",
]
embeddings = [
    "torch",
    "transformers",
    "adapters",
]
dev = [
    "pytest>=7.0",
]

[tool.uv.sources]
neurolang = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["neurolang_apps"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }
