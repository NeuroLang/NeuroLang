<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,__FAVICON__">
<style>
  /* The colours follow the theme of the page showing this one (see
     frame_hooks.js), else the system's. */
  :root {
    color-scheme: dark; --bg: #0d1117; --text: #e6edf3; --strong: #fff;
    --field: #161b22; --line: #30363d; --dim: #8b949e; --soft: #c9d1d9;
    --error: #f85149;
  }
  :root[data-theme=light] {
    color-scheme: light; --bg: #fff; --text: #1f2328; --strong: #000;
    --field: #f6f8fa; --line: #d0d7de; --dim: #59636e; --soft: #424a53;
    --error: #cf222e;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light; --bg: #fff; --text: #1f2328; --strong: #000;
      --field: #f6f8fa; --line: #d0d7de; --dim: #59636e; --soft: #424a53;
      --error: #cf222e;
    }
  }
  body {
    margin: 0; padding: 12px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  #controls {
    display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center;
    margin-bottom: 10px;
  }
  /* A control wraps within a page as narrow as a phone's. */
  #controls label { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 6px; align-items: center; }
  #threshold, #threshold-high { width: 7em; }
  #threshold-control { display: grid; gap: 4px; }
  /* The two sliders over the histogram of the values, a thumb each. */
  #threshold-range { position: relative; width: 360px; max-width: 100%; height: 62px; }
  #threshold-histogram { position: absolute; left: 0; top: 0; width: 100%; height: 44px; }
  #threshold-range input[type=range] {
    position: absolute; left: 0; bottom: 0; width: 100%; margin: 0;
    background: none; border: 0; pointer-events: none; -webkit-appearance: none; appearance: none;
  }
  #threshold-range input[type=range]::-webkit-slider-thumb { pointer-events: auto; }
  #threshold-range input[type=range]::-moz-range-thumb { pointer-events: auto; }
  #threshold-range input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--line); border-radius: 2px; }
  #threshold-range input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px;
    border-radius: 50%; background: var(--strong); border: 2px solid var(--bg); cursor: pointer;
  }
  #threshold-range input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: var(--strong); border: 2px solid var(--bg);
  }
  #opacity { width: 100px; }
  #threshold-value { color: var(--dim); min-width: 6em; }
  input, select, button {
    background: var(--field); color: var(--text); border: 1px solid var(--line);
    border-radius: 3px; font: inherit;
  }
  button { padding: 2px 10px; cursor: pointer; }
  #layer-control button { padding: 2px 6px; }
  #display {
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
    margin-bottom: 10px; color: var(--soft);
  }
  #display-options summary { color: var(--soft); cursor: pointer; margin-bottom: 6px; }
  #display label { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 6px; align-items: center; }
  #crosshair-width { width: 3.5em; }
  #crosshair-color { padding: 0; width: 2.2em; height: 1.5em; }
  #gamma { width: 90px; }
  #hot-keys { color: var(--dim); }
  #views { width: 960px; max-width: 100%; height: 340px; }
  #views.tall { height: 640px; }
  #gl { width: 100%; height: 100%; display: block; outline: none; }
  #readout { margin: 8px 0; font-variant-numeric: tabular-nums; }
  #readout b { color: var(--strong); font-weight: 600; }
  #message { color: var(--error); }
  #colorbars canvas { display: block; max-width: 100%; }
  .colorbar-name { color: var(--soft); margin-top: 4px; }
  #network { margin: 8px 0; color: var(--soft); }
  #edge-threshold { width: 7em; }
  #edge-slider { width: 180px; vertical-align: middle; }
  #edges { margin: 4px 0; padding-left: 28px; font-size: 13px; }
  #streamlines { margin: 8px 0; color: #ccc; display: flex; gap: 18px; }
  #streamlines label { display: inline-flex; gap: 6px; align-items: center; }
  #region-tip { position: fixed; pointer-events: none; z-index: 10;
    padding: 2px 6px; border-radius: 3px; font-size: 12px;
    background: rgba(0, 0, 0, 0.8); color: #fff; white-space: nowrap; }
</style>
</head>
<body>
<h1>__TITLE__</h1>
<div id="controls">
  <label id="layer-control">Overlay <select id="layer"></select>
    <button id="layer-up" type="button" title="Draw it over the next one">▲</button>
    <button id="layer-down" type="button" title="Draw it under the previous one">▼</button>
    <input id="visible" type="checkbox"> shown
  </label>
  <div id="threshold-control">
    <label>Threshold
      <input id="threshold" type="number" min="0" step="any" title="The lowest value shown">
      to <input id="threshold-high" type="number" min="0" step="any" title="The highest value shown">
      <select id="threshold-mode" title="Values, or percentiles of the nonzero values">
        <option value="value">value</option>
        <option value="percentile">percentile</option>
      </select>
      <span id="threshold-value"></span>
    </label>
    <div id="threshold-range">
      <canvas id="threshold-histogram" width="360" height="44"
        title="The nonzero values of the overlay (|v| when symmetric), the range shown in colour"></canvas>
      <input id="threshold-slider" type="range" min="0" max="1000" step="1" aria-label="Low threshold">
      <input id="threshold-high-slider" type="range" min="0" max="1000" step="1" aria-label="High threshold">
    </div>
  </div>
  <label>Colormap <select id="cmap"></select></label>
  <label title="Symmetric around 0, or from the threshold to the maximum">
    <input id="symmetric" type="checkbox"> symmetric
  </label>
  <label>Opacity
    <input id="opacity" type="range" min="0" max="1" step="0.05">
  </label>
  <button id="reset" type="button">Reset</button>
</div>
<details id="display-options" open><summary>Display</summary>
<div id="display">
  <label>View <select id="slice-type">
    <option value="axial">axial</option>
    <option value="coronal">coronal</option>
    <option value="sagittal">sagittal</option>
    <option value="multiplanar">3 slices</option>
    <option value="render">3D render</option>
  </select></label>
  <label title="The layout of the 3 slices">Layout <select id="layout">
    <option value="row">row</option>
    <option value="column">column</option>
    <option value="grid">grid</option>
    <option value="auto">auto</option>
  </select>
    <input id="render-tile" type="checkbox"> with 3D
  </label>
  <label title="What dragging with the right button does">Drag
    <select id="drag-mode">
      <option value="contrast">contrast</option>
      <option value="pan">pan / zoom</option>
      <option value="measurement">measure</option>
      <option value="angle">angle</option>
      <option value="slicer3D">3D slicer</option>
      <option value="none">none</option>
    </select>
  </label>
  <label>Crosshair
    <input id="crosshair-color" type="color">
    <input id="crosshair-width" type="number" min="0" max="10" step="1">
    <input id="crosshair-3d" type="checkbox"> in 3D
  </label>
  <label title="The gamma of the background">Gamma
    <input id="gamma" type="range" min="0.1" max="4" step="0.05">
  </label>
  <label><input id="nv-colorbar" type="checkbox"> colour bar</label>
  <label><input id="orientation-text" type="checkbox"> labels</label>
  <label><input id="orient-cube" type="checkbox"> orientation cube</label>
  <label><input id="ruler" type="checkbox"> ruler</label>
  <label title="Left on the right of the slices">
    <input id="radiological" type="checkbox"> radiological</label>
  <label title="Interpolate the voxels, rather than drawing them as blocks">
    <input id="smooth" type="checkbox"> smooth</label>
  <label title="Cut the 3D render">
    <input id="clip-plane" type="checkbox"> clip plane</label>
  <label id="atlas-colours-control" title="The regions of the result in the colours of their atlas" hidden>
    <input id="atlas-colours" type="checkbox"> atlas colours</label>
  <span id="hot-keys" title="With the views focused">keys: V view &middot; C clip plane</span>
</div>
</details>
<div id="views"><canvas id="gl" tabindex="0"></canvas></div>
<div id="region-tip" role="tooltip" hidden></div>
<div id="readout">
  <span id="space">MNI</span> <b id="mm"></b> mm &middot; voxel <b id="voxel"></b>
  &middot; value <b id="value"></b>
  <span id="region-readout" hidden>&middot; region <b id="region"></b></span>
</div>
<div id="colorbars"><canvas id="colorbar" width="480" height="44"></canvas></div>
<div id="network" style="display: none">
  <label id="edge-value-control" hidden title="The column of the result the edges are of">Edge value
    <select id="edge-value"></select></label>
  <label title="The edges of |value| at least this one are drawn">Edges from
    <input id="edge-threshold" type="number" min="0" step="any"></label>
  <input id="edge-slider" type="range" min="0" max="1000" step="1">
  <br>
  Network: <span id="network-count"></span>
  <ol id="edges"></ol>
</div>
<div id="streamlines" style="display: none">
  <label><input id="streamlines-visible" type="checkbox" checked>
    <span id="streamline-count"></span></label>
  <label>Opacity <input id="streamline-opacity" type="range" min="0"
    max="1" step="0.05" value="1"></label>
</div>
<p id="message"></p>
<script id="viewer-data" type="application/json">__DATA__</script>
<script>
__FRAME_HOOKS__
</script>
<script>
__NIIVUE__
</script>
<script>
__SCRIPT__
</script>
</body>
</html>
