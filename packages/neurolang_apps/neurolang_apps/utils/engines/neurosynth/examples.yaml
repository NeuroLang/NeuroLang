- question: Which studies mention emotion or one of its subclasses?
  datalog: |-
    cls(t) :- cogat_term(c, 'emotion'), cogat_subclass_of(x, c), cogat_term(x, t)
    cls('emotion') :- term('emotion')
    ans(s) :- cls(t), mentions(s, t)
- question: Which subcortical structures are activated by each subclass of forgetting?
  datalog: |-
    sub(t) :- cogat_term(c, 'forgetting'), cogat_subclass_of(x, c), cogat_term(x, t)
    close(q, s) :- similar_study(q, s), selected_study(s)
    active(l, s) :- tian_activated(l, s), selected_study(s)
    ans(t, l, p) :- sub(t), cogat_definition(t, q), PROB[active(l, s) // close(q, s)] = p
- question: How many subclasses does inference have in the Cognitive Atlas?
  datalog: |-
    sub(x) :- cogat_term(c, 'inference'), cogat_subclass_of(x, c)
    ans(n) :- AGGREGATE[](sub(x) @ count(x)) = n
- question: Which Schaefer parcels are activated by studies that mention medial prefrontal?
  datalog: |-
    active(l, s) :- schaefer_activated(l, s), selected_study(s)
    term_association(s, t) :- mentions(s, t), selected_study(s)
    ans(l, p) :- PROB[active(l, s) // term_association(s, 'medial prefrontal')] = p
- question: Which studies about parkinson disease do not activate the central visual network?
  datalog: |-
    vc(l) :- schaefer(l, r), startswith('17Networks LH VisCent', l)
    vc(l) :- schaefer(l, r), startswith('17Networks RH VisCent', l)
    act(s) :- vc(l), schaefer_activated(l, s)
    ans(s) :- mentions(s, 'parkinson disease'), ~act(s)
- question: Which networks are activated by studies that mention either behavioral or memory retrieval?
  datalog: |-
    active(l, s) :- schaefer_activated(l, s), selected_study(s)
    assoc(s) :- mentions(s, 'behavioral'), selected_study(s)
    assoc(s) :- mentions(s, 'memory retrieval'), selected_study(s)
    ans(l, p) :- PROB[active(l, s) // assoc(s)] = p
- question: Which terms best predict activation of the somatomotor network?
  datalog: |-
    sm(l) :- schaefer(l, r), startswith('17Networks LH SomMot', l)
    sm(l) :- schaefer(l, r), startswith('17Networks RH SomMot', l)
    active(s) :- sm(l), schaefer_activated(l, s), selected_study(s)
    mentioned_term(t) :- mentions(s, t), selected_study(s)
    cooccurrence(t) :- active(s), mentions(s, t)
    region_probability(p_r) :- PROB[active(s)] = p_r
    term_probability(t, p_t) :- PROB[mentioned_term(t)] = p_t
    joint_probability(t, p_rt) :- PROB[cooccurrence(t)] = p_rt
    bayes_factor(t, bf) :- joint_probability(t, p_rt), region_probability(p_r), term_probability(t, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
    ans(t, bf) :- bayes_factor(t, bf), (bf > 3.16)
- question: Which salience ventral attention parcels in the left hemisphere are most associated with medication?
  datalog: |-
    lab(l) :- schaefer(l, r), startswith('17Networks LH SalVentAttn', l)
    active(l, s) :- lab(l), schaefer_activated(l, s), selected_study(s)
    term_association(s, t) :- mentions(s, t), selected_study(s)
    p_cond(l, p) :- PROB[active(l, s) // term_association(s, 'medication')] = p
    p_marg(l, q) :- PROB[active(l, s)] = q
    lifts(l, lift) :- p_cond(l, p), p_marg(l, q), (lift == (p / q))
    top(m) :- AGGREGATE[](lifts(l, v) @ max(v)) = m
    ans(l, v) :- lifts(l, v), top(v)
