    ans(p) :- PROB[ta(s, 'updating') // ta(s, 'dopaminergic')] = p
- question: What is the probability that a study activates the MNI point (-24, -4, -20), given that it mentions memory?
  datalog: |-
    near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -24.0, -4.0, -20.0) <= {kernel_radius_mm})
    active(s) :- near(s), selected_study(s)
    term_association(s, t) :- mentions(s, t), selected_study(s)
    ans(p) :- PROB[active(s) // term_association(s, 'memory')] = p
