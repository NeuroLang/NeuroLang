- question: Which terms have the highest lift with left amygdala (MNI -24, -4, -20)?
  datalog: |-
    near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -24.0, -4.0, -20.0) <= {kernel_radius_mm})
    active(s) :- near(s), selected_study(s)
