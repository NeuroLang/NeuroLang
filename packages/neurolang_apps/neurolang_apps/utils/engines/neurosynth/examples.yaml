- question: Which studies mention salience and also report activation in the prefrontal cortex?
  datalog: |-
    pf(l) :- destrieux(l, r), startswith('L G front', l)
    pf(l) :- destrieux(l, r), startswith('R G front', l)
    pf(l) :- destrieux(l, r), startswith('L S front', l)
    pf(l) :- destrieux(l, r), startswith('R S front', l)
    pf(l) :- destrieux(l, r), startswith('L G and S front', l)
    pf(l) :- destrieux(l, r), startswith('R G and S front', l)
    pf(l) :- destrieux(l, r), startswith('L G and S transv front', l)
    pf(l) :- destrieux(l, r), startswith('R G and S transv front', l)
    pf(l) :- destrieux(l, r), startswith('L G orbital', l)
    pf(l) :- destrieux(l, r), startswith('R G orbital', l)
    pf(l) :- destrieux(l, r), startswith('L G rectus', l)
    pf(l) :- destrieux(l, r), startswith('R G rectus', l)
    pfs(s) :- pf(l), destrieux_activated(l, s)
    ans(s) :- mentions(s, 'salience'), pfs(s)
- question: What is the Cognitive Atlas description of arousal?
  datalog: ans(d) :- cogat_definition('arousal', d)
- question: Which terms are most associated with adaptation?
  datalog: |-
    mentioned_term(t) :- mentions(s, t), selected_study(s)
    cooccurrence(t, s) :- mentions(s, t), mentions(s, 'adaptation'), selected_study(s)
    active_roi(s) :- mentions(s, 'adaptation'), selected_study(s)
    roi_probability(p_r) :- PROB[active_roi(s)] = p_r
    term_probability(t, p_t) :- PROB[mentioned_term(t)] = p_t
    joint_probability(t, p_rt) :- PROB[cooccurrence(t, s)] = p_rt
    bayes_factor(t, bf) :- joint_probability(t, p_rt), roi_probability(p_r), term_probability(t, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
    ans(t, bf) :- bayes_factor(t, bf), (bf > 3.16)
- question: What is the hierarchy of concepts below body representation?
  datalog: |-
    below(x) :- cogat_term(c, 'body representation'), cogat_subclass_of(x, c)
    edge(a, b) :- below(x), below(y), cogat_subclass_of(x, y), cogat_term(x, a), cogat_term(y, b)
    edge(a, b) :- below(x), cogat_term(c, 'body representation'), cogat_term(c, b), cogat_term(x, a)
    ans(a, b) :- edge(a, b)
- question: Which concepts fall under search in the Cognitive Atlas?
  datalog: ans(t) :- cogat_term(c, 'search'), cogat_subclass_of(x, c), cogat_term(x, t)
- question: Which regions are activated by each subclass of rehearsal?
  datalog: |-
    sub(t) :- cogat_term(c, 'rehearsal'), cogat_subclass_of(x, c), cogat_term(x, t)
    active(l, s) :- destrieux_activated(l, s), selected_study(s)
    close(q, s) :- similar_study(q, s), selected_study(s)
    sub_def(t, d) :- sub(t), cogat_definition(t, d)
    ans(t, l, p) :- sub_def(t, d), PROB[active(l, s) // close(d, s)] = p
- question: Which subclasses of attention are mentioned together with painful in a study?
  datalog: ans(t) :- cogat_term(c, 'attention'), cogat_subclass_of(x, c), cogat_term(x, t), mentions(s, t), mentions(s, 'painful')
- question: What are the subclasses of somatosensation in the Cognitive Atlas?
