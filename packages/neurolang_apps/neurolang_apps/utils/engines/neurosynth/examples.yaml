- question: Which of lexical and speech is less associated with medial prefrontal cortex (MNI 0, 52, -6)?
  datalog: |-
    near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, 0.0, 52.0, -6.0) <= {kernel_radius_mm})
    active_roi(s) :- near(s), selected_study(s)
    lex(s) :- mentions(s, 'lexical'), selected_study(s)
    sp(s) :- mentions(s, 'speech'), selected_study(s)
    lexa(s) :- lex(s), near(s)
    spa(s) :- sp(s), near(s)
    pr(p) :- PROB[active_roi(s)] = p
    pl(p) :- PROB[lex(s)] = p
    ps(p) :- PROB[sp(s)] = p
    pla(p) :- PROB[lexa(s)] = p
    psa(p) :- PROB[spa(s)] = p
    bl(bf) :- pla(a), pr(r), pl(t), (bf == (a / r) / ((t - a) / (1.0 - r)))
    bs(bf) :- psa(a), pr(r), ps(t), (bf == (a / r) / ((t - a) / (1.0 - r)))
    b(x, bf) :- bl(bf), (x == 'lexical')
    b(x, bf) :- bs(bf), (x == 'speech')
    m(v) :- AGGREGATE[](b(x, bf) @ min(bf)) = v
    ans(x, bf) :- b(x, bf), m(bf)
