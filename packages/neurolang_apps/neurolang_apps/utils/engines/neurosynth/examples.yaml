    mixed(l) :- destrieux(l, r), startswith('R G and S', l)
    pure(l) :- gyrus(l), ~mixed(l)
    active(l, s) :- destrieux_activated(l, s), selected_study(s)
    term_association(s, t) :- mentions(s, t), selected_study(s)
    pa(l, p) :- PROB[active(l, s) // term_association(s, 'perception')] = p
