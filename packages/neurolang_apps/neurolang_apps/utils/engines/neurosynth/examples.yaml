    cand(x, y, z, s) :- peak_mni(x, y, z, s), (x < -4.0), (x > -16.0), (y > -20.0), (y < -6.0), (z > -12.0), (z < 2.0)
    ans(s) :- cand(x, y, z, s), (euclidean(x, y, z, -10.0, -13.0, -5.0) <= {kernel_radius_mm})
- question: Which studies report an activation in the head of the caudate?
  datalog: |-
    head(s) :- tian_activated('aCAU rh', s)
    head(s) :- tian_activated('aCAU lh', s)
    ans(s) :- head(s)
- question: Which studies mention both the right superior parietal lobule and the executive network?
  datalog: ans(s) :- mentions(s, 'superior parietal'), mentions(s, 'executive')
- question: Which terms are mentioned alongside the anterior cingulate gyrus, and how often?
  datalog: |-
    acc(s) :- destrieux_activated('L G and S cingul Ant', s), selected_study(s)
    acc(s) :- destrieux_activated('R G and S cingul Ant', s), selected_study(s)
    mentioned_term(t, s) :- mentions(s, t), selected_study(s)
    p_term_given_acc(t, p) :- PROB[mentioned_term(t, s) // acc(s)] = p
    ans(t, p) :- p_term_given_acc(t, p)
- question: Show studies mentioning social interactions or childhood.
  datalog: ans(s) :- mentions(s, 'social interactions') | mentions(s, 'childhood')
- question: Which studies mention words or reading?
  datalog: ans(s) :- mentions(s, 'words') | mentions(s, 'reading')
- question: Which studies activate the left angular gyrus?
  datalog: ans(s) :- destrieux_activated('L G pariet inf Angular', s)
- question: What is the probability that a study activates the left calcarine sulcus, given that it mentions visual cortex?
  datalog: |-
    active(s) :- destrieux_activated('L S calcarine', s), selected_study(s)
    ta(s) :- mentions(s, 'visual cortex'), selected_study(s)
    ans(p) :- PROB[active(s) // ta(s)] = p
- question: Which studies activate the left central sulcus but do not mention orbitofrontal cortex?
  datalog: ans(s) :- destrieux_activated('L S central', s), ~mentions(s, 'orbitofrontal cortex')
- question: Which studies mention the limbic network?
  datalog: ans(s) :- mentions(s, 'limbic')
- question: What is the probability that a study mentions movements, given that it activates the posterior cingulate cortex?
  datalog: |-
    pcc(s) :- destrieux_activated('L G cingul Post dorsal', s)
    pcc(s) :- destrieux_activated('L G cingul Post ventral', s)
    pcc(s) :- destrieux_activated('R G cingul Post dorsal', s)
    pcc(s) :- destrieux_activated('R G cingul Post ventral', s)
    active(s) :- pcc(s), selected_study(s)
    ta(s) :- mentions(s, 'movements'), selected_study(s)
    ans(p) :- PROB[ta(s) // active(s)] = p
- question: Which terms are associated with studies activating the primary visual cortex?
  datalog: |-
    v1(l) :- destrieux(l, r), startswith('L S calcarine', l)
    v1(l) :- destrieux(l, r), startswith('R S calcarine', l)
    active_roi(s) :- v1(l), destrieux_activated(l, s), selected_study(s)
    mentioned_term(t) :- mentions(s, t), selected_study(s)
    cooccurrence(t, s) :- active_roi(s), mentions(s, t)
    roi_probability(p_r) :- PROB[active_roi(s)] = p_r
    term_probability(t, p_t) :- PROB[mentioned_term(t)] = p_t
    joint_probability(t, p_rt) :- PROB[cooccurrence(t, s)] = p_rt
    bayes_factor(t, bf) :- joint_probability(t, p_rt), roi_probability(p_r), term_probability(t, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
    ans(t, bf) :- bayes_factor(t, bf), (bf > 3.16)
- question: Which studies report activity in the left inferior frontal gyrus and mention trait?
  datalog: |-
    ifg(l) :- destrieux(l, r), startswith('L G front inf', l)
    ans(s) :- ifg(l), destrieux_activated(l, s), mentions(s, 'trait')
- question: What does the idea of being aware of one's own thoughts mean?
  datalog: ans(d) :- cogat_definition('metacognition', d)
- question: Which sulci are activated by studies about listening to speech sounds?
  datalog: |-
    sulcus(l) :- destrieux(l, r), startswith('L S ', l)
    sulcus(l) :- destrieux(l, r), startswith('R S ', l)
    close(s) :- similar_study('listening to speech sounds', s), selected_study(s)
    active(l, s) :- destrieux_activated(l, s), selected_study(s), sulcus(l)
    ans(l, p) :- PROB[active(l, s) // close(s)] = p
- question: Which studies report activity in the body of the left caudate nucleus?
  datalog: ans(s) :- tian_activated('pCAU lh', s)
- question: What is the chance a study mentions the dorsal attention network, given right frontal eye field activation?
  datalog: |-
    active(s) :- schaefer_activated('17Networks RH DorsAttnB FEF 1', s), selected_study(s)
    ta(s, t) :- mentions(s, t), selected_study(s)
    ans(p) :- PROB[ta(s, 'dorsal attention') // active(s)] = p
- question: Which studies mention the executive control network and report activity in the left supramarginal gyrus?
  datalog: ans(s) :- mentions(s, 'executive control'), destrieux_activated('L G pariet inf Supramar', s)
- question: Which sulci light up in studies mentioning the default network?
  datalog: |-
    sulcus(l) :- destrieux(l, r), startswith('L S ', l)
    sulcus(l) :- destrieux(l, r), startswith('R S ', l)
    active(l, s) :- destrieux_activated(l, s), sulcus(l), selected_study(s)
    term_association(s, t) :- mentions(s, t), selected_study(s)
    ans(l, p) :- PROB[active(l, s) // term_association(s, 'default network')] = p
