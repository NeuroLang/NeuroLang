# Merged into the entry of neurosynth in ../engines.yaml (see
# doc/engine_configuration.rst).
#
# Questions on the neurosynth engine with their Datalog queries, added
# after the shared bank of coordinate_meta_analysis: answers of Sonnet
# 5.5 distilled on 800 generated questions, kept when DeepSeek agreed or
# a judge accepted them, deduplicated, and far from the questions of the
# evaluation sets (neurolang-text2query-bench, runs/nsv3e.md). Every
# query is checked against the engine by the tests
# (NEUROLANG_TEST_DATA_DIR).
assistant_examples:
- question: Which studies are about people feeling left out during a virtual ball-tossing game?
  datalog: ans(s, title) :- similar_study('people feeling left out during a virtual ball-tossing game', s), study_title(s, title)
- question: Which networks are activated by studies on choosing a small reward now versus a larger one later?
  datalog: |-
    close(q, s) :- similar_study(q, s), selected_study(s)
    active(l, s) :- schaefer_activated(l, s), selected_study(s)
    p_active_given_close(q, l, PROB) :- active(l, s) // close(q, s)
    ans(l, p) :- p_active_given_close('choosing a small reward now versus a larger one later', l, p)
- question: Which studies focus on infants hearing their mother's voice?
  datalog: ans(s) :- similar_study('infants hearing their mothers voice', s)
- question: List studies where participants hold digits in mind while ignoring distractors.
  datalog: ans(s) :- similar_study('holding digits in mind while ignoring distractors', s)
- question: Which subcortical structures are activated by studies of craving cigarettes?
  datalog: |-
    active(l, s) :- tian_activated(l, s), selected_study(s)
    term_association(s, t) :- mentions(s, t), selected_study(s)
    ans(l, p) :- PROB[active(l, s) // term_association(s, 'craving')] = p
