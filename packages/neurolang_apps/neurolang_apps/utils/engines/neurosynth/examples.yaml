    pb(p) :- PROB[tb(s)] = p
    pab(p) :- PROB[tab(s)] = p
    ans(o) :- pa(a), pb(b), pab(ab), (o == (ab * (1.0 - a - b + ab)) / ((a - ab) * (b - ab)))
