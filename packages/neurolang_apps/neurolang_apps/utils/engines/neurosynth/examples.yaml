- question: Which terms co-occur with subclasses of object recognition in a study?
  datalog: |-
    subterm(t) :- cogat_term(c, 'object recognition'), cogat_subclass_of(x, c), cogat_term(x, t)
    ta(s, t) :- mentions(s, t), selected_study(s)
    sub_study(s) :- mentions(s, u), subterm(u), selected_study(s)
    ans(t, p) :- PROB[ta(s, t) // sub_study(s)] = p
- question: Name the more specific concepts under planning.
