- question: Which subclasses of cognitive heuristic are activated in the right hippocampus?
  datalog: |-
    hip(l) :- tian(l, r), startswith('aHIP rh', l)
    hip(l) :- tian(l, r), startswith('pHIP rh', l)
    sub(t) :- cogat_term(c, 'cognitive heuristic'), cogat_subclass_of(x, c), cogat_term(x, t)
    close(t, s) :- sub(t), cogat_definition(t, d), similar_study(d, s), selected_study(s)
    active(s) :- hip(l), tian_activated(l, s), selected_study(s)
    ans(t, p) :- PROB[active(s) // close(t, s)] = p
- question: Which studies mention a kind of fixation?
