# Merged into the entry of biomedsql in ../engines.yaml (see doc/engine_configuration.rst).
# Few-shot bank for the query assistant: BiomedSQL questions with their NeuroLang queries (the SQL
# of BiomedSQL translated mechanically, tools/biomedsql_benchmark/oracle.py, one per development
# template of the benchmark), and questions on the QTL datasets as units of evidence.
assistant_examples:
- question: Is PPP2CB a druggable gene?
  datalog: |-
    ans(x_drugname, x_drugisapproved, x_newlinkedtargets_string, x_maxclinicaltrialphase) :- drug(x_uuid, x_chemblidentifier, x_blackboxwarning, x_drugname, x_drugmoleculartype, x_yearoffirstapproval, x_maxclinicaltrialphase, x_drughasbeenwithdrawn, x_drugisapproved, x_tradenames_string, x_drugsynonyms_string, x_linkeddiseasesdrug_string, x_linkeddiseasescount, x_newlinkedtargets_string, x_numberlinkedtargets, x_drugdescription, x_drugactiontype, x_drugmechanismofaction, x_tradename_count, x_synonyms_count), str_contains(x_newlinkedtargets_string, 'PPP2CB ')
- question: What is the allele frequency of the SNP rs72840770 in a Parkinson's Disease study involving a European cohort?
  datalog: |-
    ans(x_snp, x_a1, x_freq, x_a2, x_non_effect_allele_frequency) :- pd_gwas(x_uuid, 'rs72840770', x_a1, x_a2, x_freq, x_b, x_se, x_p, x_chr_37, x_bp_37, x_chr_38, x_bp_38, x_nearestgene), (x_snp == 'rs72840770'), (x_non_effect_allele_frequency == 1 - x_freq)
