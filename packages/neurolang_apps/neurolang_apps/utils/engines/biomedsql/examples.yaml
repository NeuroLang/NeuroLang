- question: Which SNP is most significantly associated with PD in the Cerebellar Hemisphere?
  datalog: |-
    rel(x_toprsid, x_disease, x_omic_tissue, x_p_smr_multi, x_p_heidi, x_a1, x_a2, x_freq, x_func_sig) :- smr(x_uuid, x_omic, 'PD', x_probeid, x_probechr, x_gene, x_probe_bp, x_topsnp, x_topsnp_chr, x_topsnp_bp, x_a1, x_a2, x_freq, x_b_gwas, x_se_gwas, x_p_gwas, x_b_eqtl, x_se_eqtl, x_p_eqtl, x_b_smr, x_se_smr, x_p_smr, x_p_smr_multi, x_p_heidi, x_nsnp_heidi, x_toprsid, x_omic_type, x_omic_tissue, x_disease_name, x_source, x_func_sig), (l_x_omic_tissue == lcase(x_omic_tissue)), (l_x_omic_tissue == 'cerebellar hemisphere'), (x_p_smr_multi < 2.95e-06), (x_p_heidi > 0.01), (x_disease == 'PD')
    best(m) :- AGGREGATE[](rel(x_toprsid, x_disease, x_omic_tissue, x_p_smr_multi, x_p_heidi, x_a1, x_a2, x_freq, x_func_sig) @ min(x_p_smr_multi)) = m
    ans(x_toprsid, x_disease, x_omic_tissue, x_p_smr_multi, x_p_heidi, x_a1, x_a2, x_freq, x_func_sig) :- rel(x_toprsid, x_disease, x_omic_tissue, x_p_smr_multi, x_p_heidi, x_a1, x_a2, x_freq, x_func_sig), best(m), (x_p_smr_multi == m)
