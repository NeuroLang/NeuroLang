- question: How consistently do the QTL datasets support LRRC37A as a mediator of progressive supranuclear palsy?
  datalog: |-
    support(g, d, PROB) :- (qtl_significant(q, g, d) & selected_qtl(q)) // (qtl_tested(q, g, d) & selected_qtl(q))
    ans(probability) :- support('LRRC37A', 'PSP', probability)
