# Merged into the entry of coordinate_meta_analysis in ../engines.yaml
# (see doc/engine_configuration.rst).
#
# How the LLM assistant (.ask, neurolang-query --ask) is to answer the
# questions on these engines: added to its system prompt.
assistant_guidance: >
  A question asking how many (combien) gets a count, not a
  probability: AGGREGATE[](mentions(s, 'pain') @ count(s)) = n over
  the stored relations, AGGREGATE[x] for each x, or over the rows of
  a PROB rule when it counts those with a given probability.  Answer
  every other question with probabilistic query answering over
  selected_study, the uniform choice of a study: give the probability
  of what the question asks, PROB[...] = p, over rules of yours
  joining selected_study(s), as active(l, s) :-
  destrieux_activated(l, s), selected_study(s), never over stored
  relations directly; and for a question about
  a term and the brain the conditional probability given the term,
  PROB[activation // term] = p, or a ratio of probabilities (lift,
  Bayes factor) when it asks for an association; a question asking
  for a list (which studies, which regions) gets the probability of
  each.  A study activates a voxel when one of its peaks is within 3
  voxels of it: activated(i, j, k, s), the same as reports(s, i, j,
  k), never peak_reported, the peaks alone; for a point given as MNI
  millimetres, peak_mni(x, y, z, s), voxel_size(r), (euclidean(x, y,
  z, x0, y0, z0) <= 3 * r), its coordinates written as they are.
  Neurosynth's maps of a term are uniformity_z (uniformity test) and
  association_z (association test), z-scores, and ale the activation
  likelihood estimate (ALE) of its studies; ma(i, j, k, s), the
  modelled activation of a study, gives the ALE of any studies,
  PROB over ma(i, j, k, s) and the rule selecting them.  For the
  classical anatomy of the cortex
  (gyri, sulci, lobes) use the Destrieux atlas, destrieux_activated;
  for the functional anatomy, the Schaefer networks of the cortex,
  schaefer_activated, and the Tian atlas of the subcortex,
  tian_activated, which also holds the subcortical structures of
  classical anatomy (hippocampus, amygdala, thalamus, nucleus
  accumbens, globus pallidus, putamen, caudate).  Find region names
  with search_values: Destrieux names start with the hemisphere (L,
  R) and use G for gyrus and S for sulcus (L G temporal middle),
  Schaefer names the network and hemisphere (17Networks LH DefaultA
  PFCm 1), with the networks abbreviated: VisCent and VisPeri (visual),
  SomMot (somatomotor), DorsAttn (dorsal attention), SalVentAttn
  (salience, ventral attention), Limbic, Cont (frontoparietal
  control), Default (default mode), TempPar (temporoparietal); match
  them with startswith('17Networks LH DorsAttn', l) on schaefer(l, r).
  Tian names abbreviate the structure and end with the hemisphere
  (lAMY rh, aHIP lh, NAc core rh): HIP hippocampus, AMY amygdala, THA
  thalamus, NAc nucleus accumbens, GP globus pallidus, PUT putamen,
  CAU caudate.
  Tian names end with the hemisphere (lAMY rh, aHIP lh).
  Co-activation is the activation of regions or points by the same
  study: for a network of pairs, co_active(l1, l2, s) :- active(l1,
  s), active(l2, s) with (l1 < l2) in the answer, conditioned on the
  term if the question names one; for the regions or points
  co-activated with a seed, PROB[active(l, s) // seed(s)] = p; for
  "more than chance", the lift of the pair, P(both) / (P(l1) P(l2)).
  A question about a topic given as a description, or about a
  Cognitive Atlas concept, uses the similarity of the study texts to
  it: similar_study(q, s), the studies closest to the text q, with
  their titles from study_title; p_a_given_similar, lift_llm and
  uniformity_llm for the brain.  A Cognitive Atlas definition reaches
  them from the queried rule itself, cogat_definition('working
  memory', d) joined with similar_study(d, s) or uniformity_llm(d, i,
  j, k, u), or with a rule of yours taking the text as its first
  argument, close(q, s) :- similar_study(q, s), selected_study(s);
  inside another rule the text is not known and the query fails.
  Rank by similarity rather than with a fixed threshold.
  Cognitive Atlas classes are named by cogat_term, their lower-case
  label (the terms of mentions), both to find a class and to answer
  with one, not by rdfs:label or skos:prefLabel; cogat_subclass_of(x,
  c) holds for the classes x below c.
  A question asking how certain or significant an answer is (a
  confidence interval, an error bar, whether one probability is
  larger than another) resamples the studies: write the measure as a
  rule of its own over PROB, measure(t, v), then rep(b, t, v) :-
  RESAMPLE[boot_studies](measure(t, v)) = b, its value on each
  replicate b, and answer with the measure and percentile(x, 2.5),
  percentile(x, 97.5) over rep(b, 'fear', x); to compare two
  measures join their replicates on the same b.  Ask it for one
  region or term at a time, never for voxels or every term: each
  replicate recomputes the measure.
