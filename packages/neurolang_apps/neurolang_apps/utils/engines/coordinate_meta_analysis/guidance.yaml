# Merged into the entry of coordinate_meta_analysis in ../engines.yaml
# (see doc/engine_configuration.rst).
#
# How the LLM assistant (.ask, neurolang-query --ask) is to answer the
# questions on these engines: added to its system prompt.
assistant_guidance: >
  A question asking how many (combien) gets a count, not a
  probability: AGGREGATE[](mentions(s, 'pain') @ count(s)) = n over
  the stored relations, AGGREGATE[x] for each x, or over the rows of
  a PROB rule when it counts those with a given probability.  A
  question asking for a list (which studies, list the parcels of a
  network, which terms a study mentions) gets the entities themselves,
  without PROB: ans(study) :- mentions(study, 'pain'), or
  ans(study) :- study(study), ~mentions(study, 'pain').  The regions not activated by the studies
  about a topic get their probability of not being activated, given
  the topic: not_active(l, s) :- destrieux(l, r), selected_study(s),
  ~destrieux_activated(l, s), then PROB[not_active(l, s) // topic(s)].
  Answer the questions asking how likely, how often, what fraction or
  probability, and those on the activations, co-activations or
  co-occurring terms of a term, a topic or a region (which regions,
  voxels or terms), with probabilistic query answering over
  selected_study, the uniform choice of a study: give the probability
  of what the question asks, PROB[...] = p, over rules of yours
  joining selected_study(s), as active(l, s) :-
  destrieux_activated(l, s), selected_study(s), never over stored
  relations directly; and for a question about
  a term or topic and the brain the conditional probability given it,
  PROB[activation // topic] = p, or a ratio of probabilities (lift,
  Bayes factor) when it asks for an association: the lift of A given B,
  how much B raises the chance of A, is P(A | B) / P(A), from PROB rules
  of yours (the rules lift and relative_risk are those of a term at
  every voxel), the probability of each region, voxel or term when
  they are listed.  A study activates a point when one of its peaks is
  within {kernel_radius_mm} mm of it: peak_mni(x, y, z, s), (euclidean(x, y,
  z, x0, y0, z0) <= {kernel_radius_mm}), with the coordinates of the question as MNI millimetres,
  written as they are, never as the voxel indices (i, j, k) of
  activated, lift or brain_mask.  For the classical anatomy of the cortex
  (gyri, sulci, lobes) use the Destrieux atlas, destrieux_activated,
  as for brain areas or regions when the question names no atlas;
  for the functional anatomy, the Schaefer networks of the cortex,
  schaefer_activated, and the Tian atlas of the subcortex,
  tian_activated, which also holds the subcortical structures of
  classical anatomy (hippocampus, amygdala, thalamus, nucleus
  accumbens, globus pallidus, putamen, caudate).  Find region names
  with search_values: Destrieux names start with the hemisphere (L,
  R), use G for gyrus and S for sulcus (L G temporal middle) and
  abbreviate: ant, post, sup, inf, med, lat, transv (transverse), collat
  (collateral), oc (occipital), temp (temporal), front, pariet, cingul,
  Ins (insula), as in R S collat transv ant;
  Schaefer names the network and hemisphere (17Networks LH DefaultA
  PFCm 1), with the networks abbreviated: VisCent and VisPeri (visual),
  SomMot (somatomotor), DorsAttn (dorsal attention), SalVentAttn
  (salience, ventral attention), Limbic, Cont (frontoparietal
  control), Default (default mode), TempPar (temporoparietal); match
  them in a rule of their own, label(l) :- schaefer(l, r),
  startswith('17Networks LH DorsAttn', l), then joined with
  schaefer_activated(l, s): startswith on schaefer_activated is slow.
  Tian names abbreviate the structure and end with the hemisphere
  (lAMY rh, aHIP lh, NAc core rh): HIP hippocampus, AMY amygdala, THA
  thalamus, NAc nucleus accumbens, GP globus pallidus, PUT putamen,
  CAU caudate; a structure is all its parts (aPUT and pPUT, aHIP and
  pHIP, lAMY and mAMY, NAc core and shell, THA DA, DP, VA and VP), in
  both hemispheres unless the question names one.
  Co-activation is the activation of regions or points by the same
  study: for a network of pairs, co_active(l1, l2, s) :- active(l1,
  s), active(l2, s) with (l1 < l2) in the answer, conditioned on the
  term if the question names one; for the regions or points
  co-activated with a seed, PROB[active(l, s) // seed(s)] = p; for
  "more than chance", the lift of the pair, P(both) / (P(l1) P(l2)).
  A question naming a cognitive process, task or concept (studies
  about working memory, regions for response inhibition, the n-back
  task) without saying mention, term or word: look it up with
  search_values over cogat_term (lower-case labels); found (the label
  itself or its singular, not a longer label), the studies are those
  closest to its definition, cogat_definition('working memory', d)
  with similar_study(d, s); not found, those closest to the question's
  own words, similar_study('emotion regulation', s).  mentions(s, t)
  is for the questions saying mention, term or word, or asking about
  the vocabulary, and for the topics that are no cognitive concept
  (anatomy, disorders, populations, stimuli).  A topic given as a
  description uses its own words with similar_study (no stored value
  holds them: do not look for them with search_values), with their
  titles from study_title; p_a_given_similar, lift_llm and
  uniformity_llm for the brain.  The text reaches similar_study from
  the queried rule itself, cogat_definition('working memory', d)
  joined with similar_study(d, s) or uniformity_llm(d, i, j, k, u), or
  with a rule of yours taking the text as its first argument, close(q,
  s) :- similar_study(q, s), selected_study(s), then p(q, l, PROB) :-
  active(l, s) // close(q, s); inside another rule the text is not
  known and the query fails.  Rank by similarity rather than with a
  fixed threshold.
  Cognitive Atlas classes are named by cogat_term, their lower-case
  label (the terms of mentions), both to find a class and to answer
  with one, not by rdfs:label or skos:prefLabel; cogat_subclass_of(x,
  c) holds for the classes x below c.
  A question asking how certain or significant an answer is (a
  confidence interval, an error bar, whether one probability is
  larger than another) resamples the studies: write the measure as a
  rule of its own over PROB, measure(t, v), then rep(b, t, v) :-
  RESAMPLE[boot_studies](measure(t, v)) = b, its value on each
  replicate b, and answer with the measure and percentile(x, 2.5),
  percentile(x, 97.5) over rep(b, 'fear', x); to compare two
  measures join their replicates on the same b.  Ask it for one
  region or term at a time, never for voxels or every term: each
  replicate recomputes the measure.
  The publications of the studies restrict them to a time or a
  journal: study_year(s, y), study_journal(s, j), with the journal
  named as the engine names it (find it with search_values), and
  study_title(s, t), study_abstract(s, a) for their texts;
  study_pmid(s, p) and study_doi(s, d) identify a paper, as PubMed
  and the DOI do (an integer, and the DOI in lower case).  Restrict
  the studies in a rule of their own, recent(s) :- study_year(s, y),
  (y >= 2010), (y <= 2015), then condition on it as on a term:
  PROB[active(l, s) // cond(s)] = p with cond(s) :- recent(s),
  mentions(s, 'pain'), selected_study(s) for the studies mentioning
  pain.
