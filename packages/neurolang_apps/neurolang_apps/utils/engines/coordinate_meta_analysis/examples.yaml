# The example queries of coordinate_meta_analysis, merged into its
# entry of ../engines.yaml (see doc/engine_configuration.rst): the
# questions in English the REPL shows first (questions), each one of the
# bank of the query assistant below, the queries it shows (examples) and
# the questions of the query assistant (assistant_examples).
questions:
  - Which studies mention pain?
  - Which gyri and sulci are activated by studies about language?
  - Which subcortical regions are activated by studies about fear?
  - What is the Bayes factor of fear for the activation of the left amygdala?
  - Which cortical regions are co-activated with the left amygdala?
  - Where in the brain is working memory, by its definition in the Cognitive Atlas?
examples:
  datalog:
    - "ans(s) :- mentions(s, 'pain')"
    - "ans(s, w) :- weighted_mention(s, 'pain', w), (w > 0.1)"
    - "ans(i, j, k, u) :- uniformity('pain', i, j, k, u)"
    - "ans(i, j, k, u) :- uniformity_llm('cortical response to noxious heat applied to the skin', i, j, k, u)"
    - "ans(t) :- cogat_term(c, 'working memory'), cogat_subclass_of(x, c), cogat_term(x, t)"
    - "ans(s) :- cogat_term(c, 'working memory'), cogat_subclass_of(x, c), cogat_term(x, t), mentions(s, t)"
  squall:
    - "obtain every Study that mentions 'pain'."
    - "obtain every Weighted_mention (?s; ?t; ?w) such that ?t is 'pain' and ?w is greater than 0.1."
    - "obtain every Voxel (?i; ?j; ?k) that a Study that mentions 'pain' reports."

# Questions on the coordinate-based meta-analysis engines (neurosynth,
# neurostore) with their Datalog queries: the few-shot examples of the
# LLM query assistant, the most similar to the user's question being put
# in the prompt. Both engines extend coordinate_meta_analysis and share
# this bank; <engine>/examples.yaml adds those of one engine. Every
# query is checked against the engines by the tests
# (NEUROLANG_TEST_DATA_DIR).
#
# As the engines' assistant_guidance asks, a list (which studies, list
# ...) is answered with the entities themselves, without probabilities,
# and a count (how many) with AGGREGATE; every other question, and the
# activations, co-activations and co-occurrences of a term or region, with
# probabilistic query answering over selected_study, the uniform choice
# of a study: a study is chosen at random and the answer is the
# probability of what the question asks, conditioned on the term or
# topic it names. A study activates a point when one
# of its peaks is within kernel_radius_mm (6 mm):
# peaks in MNI millimetres (peak_mni) for points given in MNI
# coordinates, the Destrieux atlas for the classical anatomy of the
# cortex (destrieux_activated), and the Schaefer networks of the cortex
# and the Tian atlas of the subcortex for the functional anatomy
# (schaefer_activated, tian_activated).
#
# A topic given as a description, or a cognitive process, task or
# concept, is matched to the studies by the similarity of their title
# and abstract (similar_study: the 5% closest), with whichever text
# encoder the engine uses: a concept by its Cognitive Atlas definition
# (cogat_definition, joined in the queried rule itself) when
# cogat_term has it, else by the question's words. mentions is for the
# questions about mentions, terms or words, and for the topics that are
# no cognitive concept (anatomy, disorders, populations, stimuli).
#
# A question asking how certain an answer is (a confidence interval, an
# error bar) resamples the studies: RESAMPLE[boot_studies](pred(x)) = b
# is pred(x), a rule over PROB, on each of the replicates b of
# boot_studies, and the interval is the percentiles 2.5 and 97.5 of the
# replicates; two measures are compared on the same replicate b.
assistant_examples:
  - question: Which studies mention pain?
    datalog: |-
      ans(s) :- mentions(s, 'pain')

  - question: Which terms are mentioned by the studies, and how often?
    datalog: |-
      mentioned_term(t) :- mentions(s, t), selected_study(s)
      ans(t, p) :- PROB[mentioned_term(t)] = p

  - question: Which studies mention either language or speech?
    datalog: |-
      language_or_speech(s) :- mentions(s, 'language')
      language_or_speech(s) :- mentions(s, 'speech')
      ans(s) :- language_or_speech(s)

  - question: Which studies mention both pain and emotion?
    datalog: |-
      ans(s) :- mentions(s, 'pain'), mentions(s, 'emotion')

  - question: Which studies do not mention pain?
    datalog: |-
      ans(s) :- study(s), ~mentions(s, 'pain')

  - question: Which terms co-occur with fear in a study?
    datalog: |-
      term_association(s, t) :- mentions(s, t), selected_study(s)
      ans(t, p) :- PROB[term_association(s, t) // term_association(s, 'fear')] = p

  - question: Which voxels are activated by studies that mention pain?
    datalog: |-
      activation(i, j, k, s) :- activated(i, j, k, s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      ans(i, j, k, p) :- PROB[activation(i, j, k, s) // term_association(s, 'pain')] = p

  - question: Which studies report an activation within 3 mm of the left amygdala, MNI (-24, -4, -20)?
    datalog: |-
      ans(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -24.0, -4.0, -20.0) <= 3)

  - question: What is the probability that a study activates the MNI point (-24, -4, -20), given that it mentions fear?
    datalog: |-
      near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -24.0, -4.0, -20.0) <= {kernel_radius_mm})
      active(s) :- near(s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      ans(p) :- PROB[active(s) // term_association(s, 'fear')] = p

  # A cognitive process, task or concept is looked up in the Cognitive
  # Atlas (search_values over cogat_term): the studies are those closest
  # to its definition when it is there (language), to the question's own
  # words when it is not (speech).
  - question: Which gyri and sulci are activated by studies about language?
    datalog: |-
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_active_given_close(q, l, PROB) :- active(l, s) // close(q, s)
      ans(l, p) :- cogat_definition('language', d), p_active_given_close(d, l, p)

  - question: Is the left superior temporal gyrus activated by studies on speech?
    datalog: |-
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      ans(p) :- PROB[active('L G temp sup Lateral', s) // close('speech', s)] = p

  - question: Which subcortical regions are activated by studies about fear?
    datalog: |-
      active(l, s) :- tian_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_active_given_close(q, l, PROB) :- active(l, s) // close(q, s)
      ans(l, p) :- cogat_definition('fear', d), p_active_given_close(d, l, p)

  - question: Which parcels of the functional networks are activated by studies about the default mode?
    datalog: |-
      active(l, s) :- schaefer_activated(l, s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      ans(l, p) :- PROB[active(l, s) // term_association(s, 'default mode')] = p

  - question: Which functional regions, cortical networks and subcortex, are activated by studies about reward?
    datalog: |-
      functional_region(l, s) :- schaefer_activated(l, s)
      functional_region(l, s) :- tian_activated(l, s)
      active(l, s) :- functional_region(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_active_given_close(q, l, PROB) :- active(l, s) // close(q, s)
      ans(l, p) :- cogat_definition('reward', d), p_active_given_close(d, l, p)

  # Bayes factors (reverse inference): BF = P(T | R) / P(T | not R)
  # = (P(R, T) / P(R)) / ((P(T) - P(R, T)) / (1 - P(R))), the probabilities
  # being over selected_study; a BF above sqrt(10), about 3.16, is
  # substantial evidence.
  - question: Decode the left middle temporal gyrus, which terms have a Bayes factor above 3.16 for its activation?
    datalog: |-
      active_region(l) :- destrieux_activated(l, s), selected_study(s)
      mentioned_term(t) :- mentions(s, t), selected_study(s)
      cooccurrence(l, t) :- destrieux_activated(l, s), mentions(s, t), selected_study(s)
      region_probability(l, p_r) :- PROB[active_region(l)] = p_r
      term_probability(t, p_t) :- PROB[mentioned_term(t)] = p_t
      joint_probability(l, t, p_rt) :- PROB[cooccurrence(l, t)] = p_rt
      bayes_factor(l, t, bf) :- joint_probability(l, t, p_rt), region_probability(l, p_r), term_probability(t, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
      ans(t, bf) :- bayes_factor('L G temporal middle', t, bf), (bf > 3.16)

  - question: What is the Bayes factor of fear for the activation of the left amygdala?
    datalog: |-
      amygdala(s) :- tian_activated('lAMY lh', s)
      amygdala(s) :- tian_activated('mAMY lh', s)
      active_roi(s) :- amygdala(s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      close_and_roi(q, s) :- similar_study(q, s), amygdala(s), selected_study(s)
      roi_probability(p_r) :- PROB[active_roi(s)] = p_r
      close_probability(q, PROB) :- close(q, s)
      joint_probability(q, PROB) :- close_and_roi(q, s)
      bayes_factor(q, bf) :- joint_probability(q, p_rt), roi_probability(p_r), close_probability(q, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
      ans(bf) :- cogat_definition('fear', d), bayes_factor(d, bf)

  - question: What is the Bayes factor of fear for the activation of the left amygdala, with its 95% confidence interval?
    datalog: |-
      amygdala(s) :- tian_activated('lAMY lh', s)
      amygdala(s) :- tian_activated('mAMY lh', s)
      active_roi(s) :- amygdala(s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      close_and_roi(q, s) :- similar_study(q, s), amygdala(s), selected_study(s)
      roi_probability(p_r) :- PROB[active_roi(s)] = p_r
      close_probability(q, PROB) :- close(q, s)
      joint_probability(q, PROB) :- close_and_roi(q, s)
      bayes_factor(q, bf) :- joint_probability(q, p_rt), roi_probability(p_r), close_probability(q, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
      bf_replicate(b, q, bf) :- RESAMPLE[boot_studies](bayes_factor(q, bf)) = b
      ans(bf, percentile(x, 2.5), percentile(x, 97.5)) :- cogat_definition('fear', d), bayes_factor(d, bf), bf_replicate(b, d, x)

  - question: How likely is the left superior temporal gyrus to be activated by studies on speech, and how certain is it?
    datalog: |-
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_active_given_close(q, l, PROB) :- active(l, s) // close(q, s)
      p_replicate(b, q, l, p) :- RESAMPLE[boot_studies](p_active_given_close(q, l, p)) = b
      ans(p, percentile(x, 2.5), percentile(x, 97.5)) :- p_active_given_close('speech', 'L G temp sup Lateral', p), p_replicate(b, 'speech', 'L G temp sup Lateral', x)

  - question: Is the left amygdala activated more often by studies about fear than by studies about pain? Give a 95% confidence interval of the difference.
    datalog: |-
      amygdala(s) :- tian_activated('lAMY lh', s)
      amygdala(s) :- tian_activated('mAMY lh', s)
      active_roi(s) :- amygdala(s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_roi_given_close(q, PROB) :- active_roi(s) // close(q, s)
      p_replicate(b, q, p) :- RESAMPLE[boot_studies](p_roi_given_close(q, p)) = b
      difference(b, d) :- cogat_definition('fear', fear), cogat_definition('pain', pain), p_replicate(b, fear, p_fear), p_replicate(b, pain, p_pain), (d == p_fear - p_pain)
      ans(percentile(d, 2.5), percentile(d, 50.0), percentile(d, 97.5)) :- difference(b, d)

  - question: Which terms are associated with the MNI point (40, -60, 10), with a Bayes factor above 3.16?
    datalog: |-
      near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, 40.0, -60.0, 10.0) <= {kernel_radius_mm})
      active_roi(s) :- near(s), selected_study(s)
      mentioned_term(t) :- mentions(s, t), selected_study(s)
      cooccurrence(t, s) :- near(s), mentions(s, t), selected_study(s)
      roi_probability(p_r) :- PROB[active_roi(s)] = p_r
      term_probability(t, p_t) :- PROB[mentioned_term(t)] = p_t
      joint_probability(t, p_rt) :- PROB[cooccurrence(t, s)] = p_rt
      bayes_factor(t, bf) :- joint_probability(t, p_rt), roi_probability(p_r), term_probability(t, p_t), (bf == (p_rt / p_r) / ((p_t - p_rt) / (1.0 - p_r)))
      ans(t, bf) :- bayes_factor(t, bf), (bf > 3.16)

  # Co-activation: regions or points activated by the same study. A pair
  # of regions, l1 < l2 to give each pair once, is a network (.view draws
  # it as one); a seed region or point conditions the activation of the
  # others (meta-analytic connectivity, MACM); the lift of a pair compares
  # its joint probability with that of independent activations.
  - question: Which pairs of Schaefer regions are co-activated by studies about reading?
    datalog: |-
      active(l, s) :- schaefer_activated(l, s), selected_study(s)
      co_active(l1, l2, s) :- active(l1, s), active(l2, s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_co_active_given_close(q, l1, l2, PROB) :- co_active(l1, l2, s) // close(q, s)
      ans(l1, l2, p) :- (l1 < l2), cogat_definition('reading', d), p_co_active_given_close(d, l1, l2, p)

  - question: What is the co-activation network of the subcortical regions in studies about fear?
    datalog: |-
      active(l, s) :- tian_activated(l, s), selected_study(s)
      co_active(l1, l2, s) :- active(l1, s), active(l2, s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_co_active_given_close(q, l1, l2, PROB) :- co_active(l1, l2, s) // close(q, s)
      ans(l1, l2, p) :- (l1 < l2), cogat_definition('fear', d), p_co_active_given_close(d, l1, l2, p)

  - question: Which cortical regions are co-activated with the left amygdala?
    datalog: |-
      amygdala(s) :- tian_activated('lAMY lh', s)
      amygdala(s) :- tian_activated('mAMY lh', s)
      seed(s) :- amygdala(s), selected_study(s)
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      ans(l, p) :- PROB[active(l, s) // seed(s)] = p

  - question: Which gyri and sulci are co-activated with the left superior temporal gyrus?
    datalog: |-
      seed(s) :- destrieux_activated('L G temp sup Lateral', s), selected_study(s)
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      ans(l, p) :- PROB[active(l, s) // seed(s)] = p

  - question: Which functional networks are co-activated with the MNI point (40, -60, 10)?
    datalog: |-
      near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, 40.0, -60.0, 10.0) <= {kernel_radius_mm})
      seed(s) :- near(s), selected_study(s)
      active(l, s) :- schaefer_activated(l, s), selected_study(s)
      ans(l, p) :- PROB[active(l, s) // seed(s)] = p

  - question: Which voxels are co-activated with the MNI point (-24, -4, -20)?
    datalog: |-
      near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -24.0, -4.0, -20.0) <= {kernel_radius_mm})
      seed(s) :- near(s), selected_study(s)
      activation(i, j, k, s) :- activated(i, j, k, s), selected_study(s)
      ans(i, j, k, p) :- PROB[activation(i, j, k, s) // seed(s)] = p

  - question: What is the probability that a study activating the MNI point (-24, -4, -20) also activates the MNI point (24, -4, -20)?
    datalog: |-
      near_seed(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -24.0, -4.0, -20.0) <= {kernel_radius_mm})
      near_target(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, 24.0, -4.0, -20.0) <= {kernel_radius_mm})
      seed(s) :- near_seed(s), selected_study(s)
      target(s) :- near_target(s), selected_study(s)
      ans(p) :- PROB[target(s) // seed(s)] = p

  - question: What is the co-activation network of the MNI points (-24, -4, -20), (24, -4, -20), (-42, 22, 8), (-50, -40, 10) and (40, -60, 10)?
    datalog: |-
      point(-24.0, -4.0, -20.0)
      point(24.0, -4.0, -20.0)
      point(-42.0, 22.0, 8.0)
      point(-50.0, -40.0, 10.0)
      point(40.0, -60.0, 10.0)
      near(x, y, z, s) :- point(x, y, z), peak_mni(px, py, pz, s), (euclidean(px, py, pz, x, y, z) <= {kernel_radius_mm})
      active(x, y, z, s) :- near(x, y, z, s), selected_study(s)
      co_active(x1, y1, z1, x2, y2, z2, s) :- active(x1, y1, z1, s), active(x2, y2, z2, s)
      ans(x1, y1, z1, x2, y2, z2, p) :- PROB[co_active(x1, y1, z1, x2, y2, z2, s)] = p

  - question: Which pairs of subcortical regions are co-activated more than chance?
    datalog: |-
      active(l, s) :- tian_activated(l, s), selected_study(s)
      co_active(l1, l2, s) :- active(l1, s), active(l2, s)
      region_probability(l, p) :- PROB[active(l, s)] = p
      pair_probability(l1, l2, p) :- PROB[co_active(l1, l2, s)] = p
      ans(l1, l2, lift) :- pair_probability(l1, l2, p12), region_probability(l1, p1), region_probability(l2, p2), (l1 < l2), (lift == p12 / (p1 * p2))

  - question: Are the left and right amygdala co-activated more than chance?
    datalog: |-
      amygdala_left(s) :- tian_activated('lAMY lh', s)
      amygdala_left(s) :- tian_activated('mAMY lh', s)
      amygdala_right(s) :- tian_activated('lAMY rh', s)
      amygdala_right(s) :- tian_activated('mAMY rh', s)
      left(s) :- amygdala_left(s), selected_study(s)
      right(s) :- amygdala_right(s), selected_study(s)
      both(s) :- amygdala_left(s), amygdala_right(s), selected_study(s)
      p_left(p) :- PROB[left(s)] = p
      p_right(p) :- PROB[right(s)] = p
      p_both(p) :- PROB[both(s)] = p
      ans(lift) :- p_both(p12), p_left(p1), p_right(p2), (lift == p12 / (p1 * p2))

  - question: How likely are the studies of the n-back task to activate the left dorsal attention network?
    datalog: |-
      dorsal_label(l) :- schaefer(l, r), startswith('17Networks LH DorsAttn', l)
      dorsal(s) :- dorsal_label(l), schaefer_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_dorsal_given_close(q, PROB) :- dorsal(s) // close(q, s)
      ans(p) :- cogat_definition('n-back task', d), p_dorsal_given_close(d, p)

  - question: Which studies are about the visual word form area? Give their titles.
    datalog: |-
      ans(s, title) :- similar_study('visual word form area', s), study_title(s, title)

  - question: Which studies are about the Cognitive Atlas concept response inhibition, with their titles?
    datalog: |-
      ans(s, title) :- cogat_definition('response inhibition', d), similar_study(d, s), study_title(s, title)

  - question: Which voxels do the studies about holding information in mind over a delay activate?
    datalog: |-
      ans(i, j, k, p) :- p_a_given_similar('holding information in mind over a delay', i, j, k, p)

  - question: Where in the brain is working memory, by its definition in the Cognitive Atlas?
    datalog: |-
      ans(i, j, k, u) :- cogat_definition('working memory', d), uniformity_llm(d, i, j, k, u)

  - question: How likely is a study about fear, by its Cognitive Atlas definition, to report an amygdala activation?
    datalog: |-
      amygdala_label(l) :- tian(l, r), startswith('lAMY', l)
      amygdala_label(l) :- tian(l, r), startswith('mAMY', l)
      amygdala(s) :- amygdala_label(l), tian_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_amygdala_given_close(q, PROB) :- amygdala(s) // close(q, s)
      ans(p) :- cogat_definition('fear', d), p_amygdala_given_close(d, p)

  - question: Which studies are about fear, by its Cognitive Atlas definition, without mentioning fear?
    datalog: |-
      ans(s) :- cogat_definition('fear', d), similar_study(d, s), ~mentions(s, 'fear')

  - question: How likely is a study about pain, by its Cognitive Atlas definition, to report an activation of the insula?
    datalog: |-
      insula_label(l) :- destrieux(l, r), startswith('L G Ins', l)
      insula_label(l) :- destrieux(l, r), startswith('R G Ins', l)
      insula_label(l) :- destrieux(l, r), startswith('L G insular', l)
      insula_label(l) :- destrieux(l, r), startswith('R G insular', l)
      insula_label(l) :- destrieux(l, r), startswith('L S circular insula', l)
      insula_label(l) :- destrieux(l, r), startswith('R S circular insula', l)
      insula(s) :- insula_label(l), destrieux_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_insula_given_close(q, PROB) :- insula(s) // close(q, s)
      ans(p) :- cogat_definition('pain', d), p_insula_given_close(d, p)

  - question: How likely are the studies about recalling personal memories from the past to activate the default mode network?
    datalog: |-
      default_label(l) :- schaefer(l, r), startswith('17Networks LH Default', l)
      default_label(l) :- schaefer(l, r), startswith('17Networks RH Default', l)
      default_mode(s) :- default_label(l), schaefer_activated(l, s), selected_study(s)
      close(q, s) :- similar_study(q, s), selected_study(s)
      p_default_given_close(q, PROB) :- default_mode(s) // close(q, s)
      ans(p) :- p_default_given_close('recalling personal memories from the past', p)

  - question: Which studies are about fear, by its Cognitive Atlas definition, without mentioning fear? Give their titles.
    datalog: |-
