  # Meta-analytic co-activation: the co-activation of regions by the same
  # studies (meta-analytic connectivity), PROB over selected_study; not
  # the structural connectivity (white-matter streamlines,
  # *_structural_connectivity) nor the resting-state functional
  # connectivity (*_functional_connectivity), which the questions name.
  - question: What is the meta-analytic co-activation of the left angular gyrus?
    datalog: |-
      seed(s) :- destrieux_activated('L G pariet inf Angular', s), selected_study(s)
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      ans(l, p) :- PROB[active(l, s) // seed(s)] = p

  - question: Which Schaefer parcels are co-activated by the same studies with the left posterior cingulate (precuneus) parcel?
    datalog: |-
      seed(s) :- schaefer_activated('17Networks LH DefaultA pCunPCC 1', s), selected_study(s)
      active(l, s) :- schaefer_activated(l, s), selected_study(s)
      ans(l, p) :- PROB[active(l, s) // seed(s)] = p

  # Structural connectivity and co-activation together: the structural
  # connectivity, stored streamlines, is joined, by the labels of the
  # regions, with the probabilities of activation and co-activation that
  # PROB rules give; or, as a choice of where a random streamline ends,
  # queried with them in one PROB.
  - question: How do the structural connectivity and the meta-analytic co-activation of the left angular gyrus compare, region by region?
    datalog: |-
      seed(s) :- destrieux_activated('L G pariet inf Angular', s), selected_study(s)
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      coactivation(l, p) :- PROB[active(l, s) // seed(s)] = p
      ans(l, n, p) :- destrieux_structural_connectivity('L G pariet inf Angular', l, n), coactivation(l, p)

  - question: Which cortical regions activated by studies about pain are strongly structurally connected to each other?
    datalog: |-
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      pain(l, p) :- PROB[active(l, s) // term_association(s, 'pain')] = p
      ans(l1, l2, n) :- pain(l1, p1), pain(l2, p2), (p1 > 0.4), (p2 > 0.4), destrieux_structural_connectivity(l1, l2, n), (l1 < l2), (n > 1000)

  - question: Are the Schaefer parcels co-activated by studies about reading also structurally connected?
    datalog: |-
      active(l, s) :- schaefer_activated(l, s), selected_study(s)
      co_active(l1, l2, s) :- active(l1, s), active(l2, s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      co_activation(l1, l2, p) :- (l1 < l2), PROB[co_active(l1, l2, s) // term_association(s, 'reading')] = p
      ans(l1, l2, p, n) :- co_activation(l1, l2, p), schaefer_structural_connectivity(l1, l2, n)

  - question: Which regions structurally connected to the left angular gyrus are activated by studies about memory?
    datalog: |-
      connected(l, n) :- destrieux_structural_connectivity('L G pariet inf Angular', l, n), (n > 1000)
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      memory(l, p) :- PROB[active(l, s) // term_association(s, 'memory')] = p
      ans(l, n, p) :- connected(l, n), memory(l, p)

  - question: What is the probability that a white-matter streamline drawn at random from the left angular gyrus ends in a region activated by a study about memory?
    datalog: |-
      strength(sum(n)) :- destrieux_structural_connectivity('L G pariet inf Angular', l, n)
      ends_in(l) ^ (n / t) :- destrieux_structural_connectivity('L G pariet inf Angular', l, n), strength(t)
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      reached(s) :- ends_in(l), active(l, s)
      ans(p) :- PROB[reached(s) // term_association(s, 'memory')] = p

  # The structural connectivity gradients against the activations of a
  # term: where, along an anatomical axis of the cortex, a function lies.
  - question: Where along the second structural connectivity gradient, from sensorimotor to occipital cortex, are the regions activated by studies about pain?
    datalog: |-
      active(l, s) :- destrieux_activated(l, s), selected_study(s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      pain(l, p) :- PROB[active(l, s) // term_association(s, 'pain')] = p
      ans(l, v, p) :- pain(l, p), (p > 0.3), destrieux_structural_gradient(l, 2, v)

  # The three connectivities together: the structural (white-matter
  # streamlines), the resting-state functional (correlation at rest) and
  # the meta-analytic co-activation, joined by the labels of the regions.
  - question: How do the structural and the resting-state functional connectivity of the left posterior cingulate (precuneus) compare, parcel by parcel?
    datalog: |-
      ans(l, n, r) :- schaefer_structural_connectivity('17Networks LH DefaultA pCunPCC 1', l, n), schaefer_functional_connectivity('17Networks LH DefaultA pCunPCC 1', l, r)

  - question: Which pairs of parcels are strongly functionally connected at rest (correlation above 0.4) without a strong direct structural connection (fewer than 10 streamlines)?
    datalog: |-
      wired(l1, l2) :- schaefer_structural_connectivity(l1, l2, n), (n >= 10)
      ans(l1, l2, r) :- schaefer_functional_connectivity(l1, l2, r), (r > 0.4), (l1 < l2), ~wired(l1, l2)

  - question: How do the first gradients of the structural and of the resting-state functional connectivity compare, parcel by parcel?
    datalog: |-
      ans(l, s, f) :- schaefer_structural_gradient(l, 1, s), schaefer_functional_gradient(l, 1, f)

  - question: Are the Schaefer parcels co-activated by studies about reading also functionally connected at rest?
    datalog: |-
      active(l, s) :- schaefer_activated(l, s), selected_study(s)
      co_active(l1, l2, s) :- active(l1, s), active(l2, s)
      term_association(s, t) :- mentions(s, t), selected_study(s)
      co_activation(l1, l2, p) :- (l1 < l2), PROB[co_active(l1, l2, s) // term_association(s, 'reading')] = p
      ans(l1, l2, p, r) :- co_activation(l1, l2, p), (p > 0.3), schaefer_functional_connectivity(l1, l2, r)
