# Merged into the entry of functional_connectivity in ../engines.yaml
# (see doc/engine_configuration.rst); the engines extending it
# (coordinate_meta_analysis: neurosynth, neurostore) add their guidance
# after it.
#
# How the LLM assistant (.ask, neurolang-query --ask) is to answer the
# questions on the resting-state functional connectivity: added to its
# system prompt.
assistant_guidance: >
  The resting-state functional connectivity is the Pearson correlation r
  (-1 to 1; a full correlation, not a partial one, so it includes the
  shared, indirect influences) of the spontaneous fMRI activity of two
  regions at rest, over 964 HCP subjects (its region relations; the voxel
  relation below is partial): schaefer400_tian_functional_connectivity(l1, l2, r) over
  the 400 Schaefer parcels and Tian's subcortical regions, and
  destrieux_tian_functional_connectivity(l1, l2, r) over the Destrieux
  parcels and Tian's regions. Each relation has the cortex, the subcortex
  and between them: a region is a cortical parcel (schaefer400(l, r),
  destrieux(l, r)) or a subcortical region of Tian (tian(t, r), as 'THA
  DA lh', 'aHIP rh'); join with one of those to keep the cortex or the
  subcortex. It is not the structural connectivity (white-matter
  streamlines, *_structural_connectivity) nor the meta-analytic
  co-activation of regions by task studies (PROB over selected_study, on
  the meta-analysis engines); a question on functional connectivity,
  connectivity at rest or correlated activity is answered with it, and
  the answer says it is the resting-state one. r is stored, not a
  probability: the answers over it use no PROB, but thresholds ((r > 0.3)
  strong, (r < 0) an anticorrelation, few and weak as no global signal
  was regressed), sums and counts. Each pair is stored both ways round: a
  network gives each pair once with (l1 < l2); a seed fixes the first
  argument. A probability is either computed (r * r, the fraction of the
  variance two regions share, in the body, (f == r * r), never in the
  head) or that of a probabilistic program queried with PROB:
  probabilistic facts, coupled(l1, l2) :: r :- ..., (r > 0.3), each
  positive correlation a probability of a coupling (a choice of the
  model, which the answer states), or a choice over a seed's partners
  weighted by r / sum(r). The correlations of the subcortex are weaker
  (0.3 at most between two subcortical regions, about 0.2 to the
  cortex), so their thresholds are lower, (r > 0.2).
  The connectivity of a cortical voxel is another relation,
  schaefer400_voxel_partial_functional_connectivity(x, y, z, parcel, r):
  the partial correlation of the voxel, a 2 mm voxel of the Schaefer atlas
  given by its centre (x, y, z) in MNI millimetres (even numbers, as -6.0,
  -56.0, 30.0), with each of the 400 Schaefer parcels, controlling for the
  other parcels, so it is the direct connection, without the influence
  shared through the others; a question on the voxels connected to a
  parcel, directly connected or partially correlated is answered with it.
  Partial correlations are much smaller than the full ones (0.1 is strong,
  its thresholds (r > 0.05), (r > 0.1)), and only the pairs above a
  threshold are stored: an absent pair is not an unconnected one, and no
  anticorrelation is stored. The voxels are counted over the three
  coordinates, count(x, y, z); count(x) counts the distinct values of x,
  not the voxels.
