engines:
  # The files <engine>/*.yaml next to this one are merged into the entry
  # of their engine: its example queries (examples.yaml) and the
  # guidance of the query assistant (guidance.yaml).
  #
  # Abstract engines only hold configuration shared by other engines;
  # concrete engines pull it in with ``extends`` (a name or a list of
  # names).  Mappings are merged key by key, ``datalog_init`` rules and
  # the ``builtins`` / ``downloads`` / ``ontologies`` /
  # ``assistant_examples`` / ``hidden_predicates`` / ``python_init`` lists
  # are concatenated, parent first, and any other value is overridden by
  # the extending engine.  Set a mapping entry to ``null`` to drop it.  A
  # base reached twice is merged once.

  # The atlases of the MNI152 brain: the classical (gyral and sulcal)
  # anatomy of the cortex, Destrieux, and the functional anatomy, Schaefer
  # (cortical networks) and Tian (subcortex), each a relation (label,
  # region) of the engines that extend this one; their label images,
  # resampled to the template of an engine that has one (nearest
  # neighbour), are the grids of the engine (``grids``), so that a voxel
  # (i, j, k) of an atlas is that of ``voxel``; each is recorded, by name, in
  # its ``atlases`` (neurolang.atlases.Atlas), as .load_atlas records one.
  mni_atlases:
    abstract: true
    description: >
      The Destrieux, Schaefer and Tian atlases of the MNI152 brain, as
      relations of a label and its region.
    # ``points``: the centres of the voxels of each region, in millimetres,
    # a stored relation that EUCLIDEAN(...) <= r joins with a tree.
    atlases:
      schaefer:
        predicate_name: schaefer
        n_rois: 100
        resolution_mm: 2
        yeo_networks: 17
        points: {predicate_name: schaefer_points}
      destrieux:
        predicate_name: destrieux
        points: {predicate_name: destrieux_points}
      tian:
        predicate_name: tian
        scale: 2
        points: {predicate_name: tian_points}
    acknowledgements:
      - >-
        MNI152 template and brain mask, ICBM 2009a nonlinear symmetric
        (nilearn's): Fonov V, Evans AC, Botteron K, Almli CR, McKinstry RC,
        Collins DL. Unbiased average age-appropriate atlases for pediatric
        studies. NeuroImage 54:313-327 (2011).
        doi:10.1016/j.neuroimage.2010.07.033
      - >-
        Schaefer 2018 parcellation, 100 parcels, 17 networks (nilearn's):
        Schaefer A, Kong R, Gordon EM, Laumann TO, Zuo XN, Holmes AJ,
        Eickhoff SB, Yeo BTT. Local-global parcellation of the human
        cerebral cortex from intrinsic functional connectivity MRI.
        Cerebral Cortex 28:3095-3114 (2018). doi:10.1093/cercor/bhx179
      - >-
        Destrieux 2009 atlas (nilearn's): Destrieux C, Fischl B, Dale A,
        Halgren E. Automatic parcellation of human cortical gyri and sulci
        using standard anatomical nomenclature. NeuroImage 53:1-15 (2010).
        doi:10.1016/j.neuroimage.2010.06.010
      - >-
        Tian 2020 subcortical atlas (Melbourne Subcortex Atlas): Tian Y,
        Margulies DS, Breakspear M, Zalesky A. Topographic organization of
        the human subcortex unveiled with functional connectivity
        gradients. Nature Neuroscience 23:1421-1432 (2020).
        doi:10.1038/s41593-020-00711-6
    datalog_init: |
      schaefer_voxels(i, j, k, l) :- schaefer(l, r), contains(r, (i, j, k)).
      schaefer_label(l) :- schaefer(l, r)
      labels(l, i, j, k) :- schaefer_voxels(i, j, k, l)
    hidden_predicates: [schaefer_voxels]
    # The full names of the regions of the atlases, and the abbreviations
    # of their labels: files of this package, made by
    # tools/make_atlas_names.py of its sources (Destrieux et al. 2010,
    # Table 1; Tian's nomenclature, Table 2; the glossary of the CBIG
    # repository for Schaefer's).
    relations:
      destrieux_name:
        file: mni_atlases/destrieux_names.tsv
      tian_name:
        file: mni_atlases/tian_names.tsv
      schaefer_name:
        file: mni_atlases/schaefer_names.tsv
      atlas_abbreviation:
        file: mni_atlases/abbreviations.tsv
    builtins: [lcase, str_contains]
    sorts:
      mni:
        columns: [x, y, z]
        type: float
        space: mm
        description: "a point in MNI space, in millimetres, in 3D"
      atlas_voxel:
        columns: [i, j, k]
        type: int
        space: voxel
        grid: schaefer
        description: "a voxel of the Schaefer atlas grid, the template's, in 3D"
      label:
        columns: [label]
        type: str
        atlas: schaefer
        description: "a Schaefer 2018 parcel label"
      destrieux_label:
        columns: [label]
        type: str
        atlas: destrieux
        description: "a region of the Destrieux 2009 cortical atlas"
      tian_label:
        columns: [label]
        type: str
        atlas: tian
        description: "a region of the Tian 2020 subcortical atlas"
      region:
        columns: [region]
        type: ExplicitVBR
        description: "a brain region"
      region_name:
        columns: [name]
        type: str
        description: >-
          the full anatomical name of a region, with its hemisphere, as
          'Superior frontal gyrus (F1), left', 'Ventroanterior thalamus,
          right' or 'Default A network, dorsal prefrontal cortex 1, left'
      atlas_name:
        columns: [atlas]
        type: str
        description: "an atlas: 'schaefer', 'destrieux' or 'tian'"
      abbreviation:
        columns: [abbreviation]
        type: str
        description: >-
          an abbreviation of the labels of an atlas, as 'PFCd' (Schaefer),
          'front' (Destrieux) or 'THA' (Tian)
      meaning:
        columns: [meaning]
        type: str
        description: "what an abbreviation stands for"
    predicates:
      schaefer:
        description: "Schaefer 2018 parcel label and its region"
        arguments:
          - label
          - region
      schaefer_label:
        description: "Every Schaefer 2018 parcel label"
        arguments:
          - label
      destrieux:
        description: >-
          Destrieux 2009 cortical atlas (gyri and sulci): region name and
          region; names start with the hemisphere, L or R
        arguments:
          - destrieux_label
          - region
      tian:
        description: >-
          Tian 2020 subcortical atlas, scale 2 (32 regions): region name and
          region; names end with the hemisphere, lh or rh
        arguments:
          - tian_label
          - region
      schaefer_voxels:
        description: >-
          Voxels (i, j, k) of the Schaefer atlas grid in each parcel
        arguments:
          - atlas_voxel
          - label
      labels:
        description: >-
          Schaefer parcel labelling each voxel (i, j, k) of the atlas grid,
          that of voxel and reports
        arguments:
          - label
          - atlas_voxel
      schaefer_points:
        description: >-
          The centre of each voxel of the Schaefer atlas, in MNI
          millimetres, and its parcel; EUCLIDEAN(x, y, z, x2, y2, z2) <= r
          with the points of another stored relation finds those near
          them
        arguments:
          - mni
          - label
      destrieux_points:
        description: >-
          The centre of each voxel of the Destrieux atlas, in MNI
          millimetres, and its region (see schaefer_points)
        arguments:
          - mni
          - destrieux_label
      tian_points:
        description: >-
          The centre of each voxel of the Tian atlas, in MNI millimetres,
          and its region (see schaefer_points)
        arguments:
          - mni
          - tian_label
      destrieux_name:
        description: >-
          The full anatomical name of each Destrieux region (Destrieux et
          al. 2010, Table 1), with its hemisphere: 'L G front sup' is
          'Superior frontal gyrus (F1), left'. Join it with a result of
          Destrieux labels to show their names
        arguments:
          - destrieux_label
          - region_name
      schaefer_name:
        description: >-
          The full name of each parcel of the Schaefer atlas of 100
          parcels, 17 networks (schaefer): its network, its component and
          its number, with its hemisphere: '17Networks LH DefaultA pCunPCC
          1' is 'Default A network, precuneus posterior cingulate cortex 1,
          left' (the glossary of the atlas's authors)
        arguments:
          - label
          - region_name
      atlas_abbreviation:
        description: >-
          The abbreviations of the labels of the atlases and what each
          stands for: atlas_abbreviation('schaefer', 'PFCd', 'dorsal
          prefrontal cortex'), ('destrieux', 'G', 'gyrus'), ('tian', 'THA',
          'thalamus'); a label is its abbreviations separated by spaces, so
          str_contains(label, abbreviation) finds the labels with one
        arguments:
          - atlas_name
          - abbreviation
          - meaning
      tian_name:
        description: >-
          The full anatomical name of each region of Tian's subcortex atlas,
          scale 2 (Tian et al. 2020, the atlas's nomenclature), with its
          hemisphere: 'THA VA lh' is 'Ventroanterior thalamus, left',
          'NAc shell rh' 'Nucleus accumbens, shell, right'. Join it with a
          result of Tian labels to show their names
        arguments:
          - tian_label
          - region_name

  # The connectivity of the brain from the Human Connectome Project, in
  # two small engines the meta-analysis engines (coordinate_meta_analysis:
  # neurosynth, neurostore) extend: the structural connectivity
  # (tractography) and the resting-state functional connectivity, each over
  # the cortex and the subcortex of two atlases, Schaefer 400 + Tian and
  # Destrieux + Tian; one relation of every pair of regions each. Made by
  # tools/hcp_connectivity, published in the dataset
  # https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity (its
  # README: how they were made, how to acknowledge them) at a tag; the
  # examples and guidance for the query assistant are in
  # structural_connectivity/ and functional_connectivity/.
  # What the two engines share: the Schaefer atlas of 400 parcels and the
  # sorts of the regions of their relations.
  connectivity_atlases:
    abstract: true
    extends: mni_atlases
    description: >
      The atlases of the connectivity engines: those of the MNI brain and
      Schaefer's atlas of 400 parcels, 17 networks (schaefer400).
    # The finer Schaefer parcellation of the connectivity: the same
    # nilearn fetcher (``kind``), its own key, grid and predicate.
    atlases:
      schaefer400:
        kind: schaefer
        predicate_name: schaefer400
        n_rois: 400
        resolution_mm: 2
        yeo_networks: 17
    # The full names of the 400 parcels (tools/make_atlas_names.py).
    relations:
      schaefer400_name:
        file: connectivity_atlases/schaefer400_names.tsv
    sorts:
      schaefer400_label:
        columns: [label]
        type: str
        atlas: schaefer400
        description: "a Schaefer 2018 parcel label, of the 400-parcel atlas"
      schaefer400_tian_label:
        columns: [label]
        type: str
        atlas: [schaefer400, tian]
        description: >-
          a region of the connectivity over Schaefer 400 and Tian: a
          parcel of the 400-parcel Schaefer atlas (schaefer400, as
          '17Networks LH DefaultA PFCd 1') or a subcortical region of
          Tian's atlas (tian, as 'THA DA lh')
      destrieux_tian_label:
        columns: [label]
        type: str
        atlas: [destrieux, tian]
        description: >-
          a region of the connectivity over Destrieux and Tian: a
          Destrieux parcel (destrieux, as 'L G and S frontomargin') or a
          subcortical region of Tian's atlas (tian, as 'THA DA lh')
    predicates:
      schaefer400:
        description: >-
          Schaefer 2018 parcel label and its region, of the atlas of 400
          parcels, 17 networks (the labels of the connectivity, as
          '17Networks LH DefaultA PFCd 1'); schaefer is the atlas of 100
        arguments:
          - schaefer400_label
          - region
      schaefer400_name:
        description: >-
          The full name of each parcel of the Schaefer atlas of 400
          parcels, 17 networks (schaefer400): '17Networks LH DefaultA PFCd
          1' is 'Default A network, dorsal prefrontal cortex 1, left'
        arguments:
          - schaefer400_label
          - region_name

  structural_connectivity:
    extends: connectivity_atlases
    description: >
      Structural connectivity from diffusion MRI tractography: the mean
      number of streamlines joining two regions over 100 subjects of the
      Human Connectome Project, each tracked on its own (MRtrix3, 5
      million streamlines), between the regions of the cortex and the
      subcortex of two atlases: the 400 Schaefer parcels and Tian's 32
      subcortical regions (schaefer400_tian_structural_connectivity), and
      the 148 Destrieux parcels and Tian's regions
      (destrieux_tian_structural_connectivity), with the atlases of the
      MNI brain. No cerebellum. Structural, not functional.
    requires_mni_mask: true
    use_base_symbols: true
    builtins: [exp, log, startswith, t_pvalue, fdr_threshold]
    relations:
      schaefer400_tian_structural_connectivity:
        file: https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity/-/raw/v2.4/tsv/schaefer400_17_tian_structural_connectivity.tsv.gz
        md5: 126953160cfafcc3cb5a43b04cd72a70
      destrieux_tian_structural_connectivity:
        file: https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity/-/raw/v2.4/tsv/destrieux_tian_structural_connectivity.tsv.gz
        md5: 125084faf1b5bc76b37d76058a6ce40c
    acknowledgements:
      - >-
        Structural connectivity (schaefer400_tian_structural_connectivity,
        destrieux_tian_structural_connectivity): the mean over 100 HCP
        Young Adult subjects of the number of streamlines joining two
        regions of the Schaefer 400 and Tian S2 atlases, and of the
        Destrieux parcels and Tian's, computed by NeuroLang
        (tools/hcp_connectivity/tractography.py; the dataset:
        https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity) as
        follows. For each subject, from the HCP's minimally preprocessed
        diffusion MRI in its T1w space: response functions (dwi2response
        dhollander) and multi-shell multi-tissue constrained spherical
        deconvolution (dwi2fod msmt_csd); the five-tissue-type image of
        its FreeSurfer segmentation (5ttgen freesurfer); 5 million
        streamlines of anatomically constrained probabilistic tractography
        (tckgen iFOD2, ACT, backtracking, cropped at the grey/white matter
        interface, dynamic seeding); SIFT2 weights (tcksift2); Schaefer's
        and Tian's atlases brought from MNI space to the subject through
        the HCP's warp (nearest neighbour), and Destrieux's parcels of the
        subject's own FreeSurfer segmentation (aparc.a2009s); the
        streamlines whose two ends lie within 2 mm of two regions counted
        (tck2connectome -symmetric -zero_diagonal
        -assignment_radial_search 2). The counts are then averaged over
        the subjects. With MRtrix3: Tournier J-D, Smith R, Raffelt D, et al. MRtrix3: a fast,
        flexible and open software framework for medical image processing
        and visualisation. NeuroImage 202:116137 (2019).
        doi:10.1016/j.neuroimage.2019.116137; anatomically constrained:
        Smith RE, Tournier J-D, Calamante F, Connelly A. NeuroImage
        62:1924-1938 (2012). doi:10.1016/j.neuroimage.2012.06.005; SIFT2:
        Smith RE, Tournier J-D, Calamante F, Connelly A. NeuroImage
        119:338-351 (2015). doi:10.1016/j.neuroimage.2015.06.092. The
        atlases: Schaefer A, Kong R, Gordon EM, et al. Cerebral Cortex
        28:3095-3114 (2018). doi:10.1093/cercor/bhx179; Destrieux C,
        Fischl B, Dale A, Halgren E. NeuroImage 53:1-15 (2010).
        doi:10.1016/j.neuroimage.2010.06.010; Tian Y, Margulies DS,
        Breakspear M, Zalesky A. Nature Neuroscience 23:1421-1432 (2020).
        doi:10.1038/s41593-020-00711-6. The Human Connectome Project: Van
        Essen DC, Smith SM, Barch DM, Behrens TEJ, Yacoub E, Ugurbil K.
        NeuroImage 80:62-79 (2013). doi:10.1016/j.neuroimage.2013.05.041.
        Data were
        provided [in part] by the Human Connectome Project, WU-Minn
        Consortium (Principal Investigators: David Van Essen and Kamil
        Ugurbil; 1U54MH091657) funded by the 16 NIH Institutes and Centers
        that support the NIH Blueprint for Neuroscience Research; and by
        the McDonnell Center for Systems Neuroscience at Washington
        University.
    sorts:
      streamline_count:
        columns: [streamline_count]
        type: float
        description: >-
          the mean number of streamlines of tractography joining two
          regions over 100 HCP subjects (of 5 million streamlines each), a
          count, not SIFT2 weights
    predicates:
      schaefer400_tian_structural_connectivity:
        description: >-
          Structural connectivity between two regions of the Schaefer 400
          parcels (17 networks) and Tian's 32 subcortical regions
          (thalamus, caudate, putamen, pallidum, nucleus accumbens,
          hippocampus, amygdala): the mean number of streamlines joining
          them over 100 HCP subjects' own diffusion MRI tractography
          (MRtrix3, 5 million streamlines each, anatomically constrained;
          .credits), every pair of distinct regions both ways round, the
          pairs no streamline joins left out. A region is a parcel
          (schaefer400(l, r)) or a Tian region (tian(t, r)), so the
          relation holds the cortex, the subcortex and between them.
          FreeSurfer, which constrains where streamlines end, labels part
          of the left pallidum as white matter in some subjects: fewer end
          in the left anterior pallidum than in the right. Structural
          (white-matter fibres), not functional
        arguments:
          - schaefer400_tian_label
          - schaefer400_tian_label
          - streamline_count
      destrieux_tian_structural_connectivity:
        description: >-
          Structural connectivity between two regions of the 148 Destrieux
          parcels (each subject's own FreeSurfer segmentation) and Tian's
          32 subcortical regions: the mean number of streamlines joining
          them over the same 100 HCP subjects' tractography as
          schaefer400_tian_structural_connectivity (.credits), every pair
          of distinct regions both ways round, the pairs no streamline
          joins left out. A region is a Destrieux parcel (destrieux(l, r))
          or a Tian region (tian(t, r)). Structural (white-matter fibres),
          not functional
        arguments:
          - destrieux_tian_label
          - destrieux_tian_label
          - streamline_count

  functional_connectivity:
    extends: connectivity_atlases
    description: >
      Resting-state functional connectivity from fMRI: the correlation of
      the spontaneous activity of two regions at rest over 964 subjects of
      the Human Connectome Project, between the regions of the cortex and
      the subcortex of two atlases: the 400 Schaefer parcels and Tian's 32
      subcortical regions (schaefer400_tian_functional_connectivity), and
      the 148 Destrieux parcels and Tian's regions
      (destrieux_tian_functional_connectivity), with the atlases of the
      MNI brain. Functional, not structural.
    requires_mni_mask: true
    use_base_symbols: true
    builtins: [exp, log, startswith, t_pvalue, fdr_threshold]
    relations:
      schaefer400_tian_functional_connectivity:
        file: https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity/-/raw/v2.4/tsv/schaefer400_17_tian_functional_connectivity.tsv.gz
        md5: e5032f1964a1a2dae4e4365a9c2c3f45
      destrieux_tian_functional_connectivity:
        file: https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity/-/raw/v2.4/tsv/destrieux_tian_functional_connectivity.tsv.gz
        md5: 8bb4dfa8856f0639422e72840e30ff3c
    acknowledgements:
      - >-
        Resting-state functional connectivity
        (schaefer400_tian_functional_connectivity,
        destrieux_tian_functional_connectivity): the HCP Young Adult
        resting-state fMRI of 964 subjects, computed by NeuroLang
        (tools/hcp_connectivity/functional.py; the dataset:
        https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity) as
        follows. For each subject, each of its four runs of rest
        (rfMRI_REST1/2, LR and RL; ICA-FIX cleaned, MSMAll aligned, 91,282
        grayordinates, no global signal regression): the time series
        averaged within each region (the cortical parcels of the atlas,
        Tian's subcortical regions); the Pearson correlation of each pair
        of regions (a full correlation, not a partial one); its Fisher z,
        averaged over the four runs. The z are then averaged over the
        subjects and turned back into a correlation (tanh).
        Smith SM et al. Resting-state fMRI in the Human Connectome Project.
        NeuroImage 80:144-168 (2013). doi:10.1016/j.neuroimage.2013.05.039.
        Glasser MF et al. The minimal preprocessing pipelines for the Human
        Connectome Project. NeuroImage 80:105-124 (2013).
        doi:10.1016/j.neuroimage.2013.04.127. Salimi-Khorshidi G et al.
        Automatic denoising of functional MRI data: combining independent
        component analysis and hierarchical fusion of classifiers.
        NeuroImage 90:449-468 (2014). doi:10.1016/j.neuroimage.2013.11.046.
        Robinson EC et al. Multimodal surface matching with higher-order
        smoothness constraints. NeuroImage 167:453-465 (2018).
        doi:10.1016/j.neuroimage.2017.10.037. Data were provided [in part]
        by the Human Connectome Project, WU-Minn
        Consortium (Principal Investigators: David Van Essen and Kamil
        Ugurbil; 1U54MH091657) funded by the 16 NIH Institutes and Centers
        that support the NIH Blueprint for Neuroscience Research; and by
        the McDonnell Center for Systems Neuroscience at Washington
        University.
    sorts:
      correlation:
        columns: [r]
        type: float
        description: >-
          a Pearson correlation of resting-state fMRI time series, -1 to 1
    predicates:
      schaefer400_tian_functional_connectivity:
        description: >-
          Resting-state functional connectivity between two regions of the
          Schaefer 400 parcels (17 networks) and Tian's 32 subcortical
          regions: the Pearson correlation r (-1 to 1; a full correlation,
          not a partial one) of their spontaneous fMRI activity at rest,
          over 964 HCP subjects (the tanh of the mean of their Fisher z;
          .credits), every pair of distinct regions both
          ways round. A region is a parcel (schaefer400(l, r)) or a Tian
          region (tian(t, r)), so the relation holds the cortex, the
          subcortex and between them. Functional, not structural (no
          white-matter fibres) nor the co-activation of task studies;
          negative r is an anticorrelation (few and weak: no global signal
          regression)
        arguments:
          - schaefer400_tian_label
          - schaefer400_tian_label
          - correlation
      destrieux_tian_functional_connectivity:
        description: >-
          Resting-state functional connectivity between two regions of the
          148 Destrieux parcels and Tian's 32 subcortical regions: the
          Pearson correlation r (-1 to 1; a full correlation, not a partial
          one) of their spontaneous fMRI activity at rest, over 964 HCP
          subjects (.credits), every pair of distinct
          regions both ways round. A region is a Destrieux parcel
          (destrieux(l, r)) or a Tian region (tian(t, r)). Functional, not
          structural nor the co-activation of task studies
        arguments:
          - destrieux_tian_label
          - destrieux_tian_label
          - correlation

  coordinate_meta_analysis:
    abstract: true
    extends: [structural_connectivity, functional_connectivity]
    description: >
      Shared setup of the coordinate-based meta-analysis engines
      (neurosynth, neurostore): reported activation peaks, TF-IDF term
      frequencies, and a probabilistic choice over studies.  Voxels
      (i, j, k) index the 1 mm MNI152 grid (at the default resolution):
      the MNI point (x, y, z) in mm is the voxel (x + 98, y + 134,
      z + 72), and distances between voxels are in voxels.  A study
      activates the voxels within {kernel_radius_mm} mm of its peaks.
    requires_mni_mask: true
    use_base_symbols: true
    builtins: [exp, log, startswith, lcase, t_pvalue, fdr_threshold]
    python_init_options:
      # Peaks whose coordinate space is neither MNI nor Talairach
      # (Neurosynth's UNKNOWN: 53,878 peaks of 1,832 studies; NeuroStore's
      # other or missing spaces): ``mni`` takes them as MNI, as Neurosynth
      # and NiMARE do; ``tal`` converts them as Talairach; ``drop`` leaves
      # them out. An engine extending this one can set its own value.
      unknown_space: mni
    # The radius of the sphere a peak activates, in millimetres, at every
    # resolution: that of ``activated`` (``{kernel_radius_voxels}``, in
    # voxels of the grid), of the activations of the atlases and of the
    # texts saying ``{kernel_radius_mm}``.  6 mm is the radius of
    # Neurosynth's activation maps (doc/tutorial_neurosynth_tests.rst).
    kernel_radius_mm: 6
    # Each atlas of mni_atlases, with ``activated``, also registers which
    # studies activate its regions: ``{atlas}_activated(label, study)`` when
    # a peak of the study (``peak_mni``, in millimetres) is within
    # ``radius_mm``, by default ``kernel_radius_mm``, of a voxel of the
    # region.  ``covered`` registers how much the studies cover its regions,
    # probabilistic facts ``{atlas}_covered(label, study)``: the mean over
    # the voxels of the region of the study's activation, the max over its
    # peaks of a Gaussian kernel of ``fwhm_mm`` (10) truncated at 3 sigma;
    # those below ``threshold`` (0.001) are left out.
    atlases:
      schaefer:
        activated: {predicate_name: schaefer_activated}
        covered: {predicate_name: schaefer_covered}
      # The 400 parcels of the connectivity engines this one extends
      # (connectivity_atlases): the Schaefer atlas of the questions.
      schaefer400:
        activated: {predicate_name: schaefer400_activated}
        covered: {predicate_name: schaefer400_covered}
      destrieux:
        activated: {predicate_name: destrieux_activated}
        covered: {predicate_name: destrieux_covered}
      tian:
        activated: {predicate_name: tian_activated}
        covered: {predicate_name: tian_covered}
    datalog_init: |
      study_with_peaks(s) :- peak_reported(i, j, k, s).
      mentions(s, t) :- term_in_study_tfidf(s, t, v), (v > 0.03)
      reports(s, i, j, k) :- peak_reported(i, j, k, s)
      weighted_mention(s, t, w) :- term_in_study_tfidf(s, t, w)
      term_in_study(s, t) :- term_in_study_tfidf(s, t, w) & (w > 0.001)
      activated(i, j, k, s) :- brain_mask(i, j, k) & peak_reported(i1, j1, k1, s) & (EUCLIDEAN(i, j, k, i1, j1, k1) <= {kernel_radius_voxels})
      p_a(i, j, k, PROB) :- activated(i, j, k, s) & selected_study(s)
      p_term(t, PROB) :- term_in_study(s, t) & selected_study(s)
      p_a_given_t(t, i, j, k, PROB) :- (activated(i, j, k, s) & selected_study(s)) // (term_in_study(s, t) & selected_study(s))
      p_any_voxel_given_t(t, PROB) :- (activated(i, j, k, s) & selected_voxel(i, j, k) & selected_study(s)) // (term_in_study(s, t) & selected_study(s))
      lift(t, i, j, k, l) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & (l == pat / pa)
      relative_risk(t, i, j, k, r) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & p_term(t, pt) & (r == pat * (1 - pt) / (pa - pat * pt))
      uniformity(t, i, j, k, u) :- p_a_given_t(t, i, j, k, pat) & p_any_voxel_given_t(t, pbar) & (u == pat / pbar)
      ratios(t, i, j, k, lift, relative_risk, uniformity) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & p_term(t, pt) & p_any_voxel_given_t(t, pbar) & (lift == pat / pa) & (relative_risk == pat * (1 - pt) / (pa - pat * pt)) & (uniformity == pat / pbar)
      study_similarity(q, s, v) :- study(s) & (v == query_similarity(q, s)) & (v > 0)
      similar_study(q, s) :- study(s) & (v == query_similarity(q, s)) & (c == query_similarity_cutoff(q)) & (v >= c)
      p_similar(q, PROB) :- similar_study(q, s) & selected_study(s)
      p_a_given_similar(q, i, j, k, PROB) :- (activated(i, j, k, s) & selected_study(s)) // (similar_study(q, s) & selected_study(s))
      p_any_voxel_given_similar(q, PROB) :- (activated(i, j, k, s) & selected_voxel(i, j, k) & selected_study(s)) // (similar_study(q, s) & selected_study(s))
      lift_llm(q, i, j, k, l) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & (l == pat / pa)
      relative_risk_llm(q, i, j, k, r) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & p_similar(q, pt) & (r == pat * (1 - pt) / (pa - pat * pt))
      uniformity_llm(q, i, j, k, u) :- p_a_given_similar(q, i, j, k, pat) & p_any_voxel_given_similar(q, pbar) & (u == pat / pbar)
      ratios_llm(q, i, j, k, lift, relative_risk, uniformity) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & p_similar(q, pt) & p_any_voxel_given_similar(q, pbar) & (lift == pat / pa) & (relative_risk == pat * (1 - pt) / (pa - pat * pt)) & (uniformity == pat / pbar)
      cogat_subclass_of(x, y) :- rdfs:subClassOf(x, y), startswith('http', y)
      cogat_subclass_of(x, z) :- cogat_subclass_of(x, y), rdfs:subClassOf(y, z), startswith('http', z)
      cogat_term(x, t) :- rdfs:label(x, l), (t == lcase(l))
      cogat_definition(t, d) :- cogat_term(x, t), skos:definition(x, d)
      cogat_measures(x, c) :- rdfs:subClassOf(x, r), owl:onProperty(r, <http://www.cognitiveatlas.org/ontology/cogat.owl#measures>), owl:someValuesFrom(r, c)
    # Replicates of selected_study, resampling the studies, for confidence
    # intervals on the probabilities and the measures derived from them.
    # Each replicate recomputes a measure: 500 keep the interval of a Bayes
    # factor within the 30 s the query assistant gives a query.
    resamplings:
      boot_studies:
        choice: selected_study
        n: 500
        scheme: bayesian
        seed: 0
    # The query decoding an image (.image loads a NIfTI image as one), from
    # the probability that each of its voxels is active,
    # {image}_probability(i, j, k, p), its rules named after the image: 1 for those of a mask, 1 - the local
    # false discovery rate of a z-score (.image --zscore).  Each voxel is a
    # probabilistic fact, active with its probability, and a voxel of the
    # brain is chosen at random (selected_voxel), independently of the
    # study: image_hit(s), that the study s activates the chosen voxel and
    # that it is active.  The lift of a
    # term is the probability of it for the studies of the term over the
    # same for all the studies (doc/tutorial_decoding.rst); the query keeps
    # the concepts of the Cognitive Atlas with 30 studies or more, the lift
    # of fewer being noisy.
    # The voxels the decoding chooses one of, the {voxel} of the query: of
    # the brain (selected_voxel), or of its cortex only (.image --cortex,
    # the page's Only the cortex), the Harvard–Oxford cortical atlas's.
    image_decoding_voxels:
      brain: selected_voxel(i, j, k)
      cortex: selected_voxel(i, j, k), cortical_mask(i, j, k)
    image_decoding_query: |-
      % Each voxel of the image is active with its
      % probability, independently: a probabilistic fact.
      {image}_active(i, j, k) :: p :- {image}_probability(i, j, k, p)
      % A study s hits the image when a voxel chosen at
      % random in the brain (selected_voxel), or in its
      % cortex (cortical_mask), is active and s activates
      % it (a peak within the kernel of the voxel).
      {image}_hit(s) :- {voxel}, {image}_active(i, j, k), activated(i, j, k, s)
      % For each term t, the probability that a study of t,
      % chosen at random, hits the image.
      p_{image}_given_term(t, PROB) :- ({image}_hit(s) & selected_study(s)) // (term_in_study(s, t) & selected_study(s))
      % The probability that any study, chosen at random,
      % hits the image.
      p_{image}(PROB) :- {image}_hit(s) & selected_study(s)
      % The number of studies of each term: the lift of a
      % term of few studies is noisy.
      term_studies(t, count(s)) :- term_in_study(s, t)
      % The lift of each concept of the Cognitive Atlas of
      % 30 studies or more: how many times more often its
      % studies hit the image than the average study does.
      % The larger, the more the concept decodes the image.
      ans(term, lift, studies) :- p_{image}_given_term(term, a), p_{image}(b), term_studies(term, studies), (studies >= 30), cogat_term(concept, term), (lift == a / b)
    # The Cognitive Atlas ontology, for open-world queries over concepts,
    # tasks and contrasts: see doc/tutorial_cognitive_atlas.rst.  Its
    # triples are facts (``rdfs:label(iri, 'Working memory')``) and its
    # subclass axioms rewrite the queries.
    acknowledgements:
      - >-
        Cognitive Atlas (its ontology, cogat.v2.owl, and its tasks):
        Poldrack RA, Kittur A, Kalar D, Miller E, Seppa C, Gil Y, Parker
        DS, Sabb FW, Bilder RM. The Cognitive Atlas: toward a knowledge
        foundation for cognitive neuroscience. Frontiers in
        Neuroinformatics 5:17 (2011). doi:10.3389/fninf.2011.00017
      - >-
        SPECTER2 (allenai/specter2_base and its adapters), the embeddings
        of the studies' titles and abstracts: Singh A, D'Arcy M, Cohan A,
        Downey D, Feldman S. SciRepEval: A Multi-Format Benchmark for
        Scientific Document Representations. EMNLP 2023
    ontologies:
      - url: https://raw.githubusercontent.com/CognitiveAtlas/cogat-ontology/master/ontology/cogat.v2.owl
        individuals: true
        names: prefixed
        # The file declares no prefix for its own namespace: its classes and
        # properties are cogat:CAO_00587, cogat:measures.
        prefixes:
          cogat: http://www.cognitiveatlas.org/ontology/cogat.owl#
    text_embeddings:
      study_abstracts:
        ids_from: study
        # The titles and abstracts of the engine (study_abstract).
        source:
          predicate: study_abstract
          title_predicate: study_title
        model: allenai/specter2_base
        document_adapter: allenai/specter2
        query_adapter: allenai/specter2_adhoc_query
        function: query_similarity
        # query_similarity_cutoff(q) is inf, and similar_study empty, for a
        # text whose 20 closest studies have a mean similarity below the
        # gate: see "Choosing the similarity threshold" in
        # doc/tutorial_text_embeddings.rst.
        similarity_gate: 0.75
        description: >-
          query_similarity(query, study) returns the cosine similarity
          between a free-text query and the study's title and abstract,
          embedded with SPECTER2.
    #probabilistic_choice:
      # selected_study:
      #  source: study
      #  description: "Uniform probabilistic choice over studies"
    # Symbols withheld from the SQUALL completion: their argument order
    # breaks sentences (``a Study peak_reported …`` binds the study to a
    # voxel index).  They stay usable when typed; ``reports`` and
    # ``labels`` are the forms that read as SQUALL verbs.
    hidden_predicates: [peak_reported, schaefer_voxels]
    # The relations the probabilistic solver reads as sparse matrices when
    # it computes sums of products as contractions: ``activated`` as a
    # voxel x study matrix, the activations of the atlases as region x
    # study ones.  Built once with the engine (0.2-0.7 GiB, 8-30 s) and
    # shared by the REPL's sessions.
    sparse_views:
      activated: [voxel, study]
      schaefer_activated: [label, study]
      schaefer400_activated: [schaefer400_label, study]
      destrieux_activated: [destrieux_label, study]
      tian_activated: [tian_label, study]
    # Views also kept by their columns (the studies): a product with a few
    # studies (those of a term) reads their voxels alone, not the whole
    # view (2 895 studies of neurostore: 53 M of its 1 billion entries).
    sparse_view_indexes: [activated]
    # The sorts of the entities the predicates relate, declared once: the
    # columns an entity spans and their type.  A sort of N > 1 columns
    # reads ``in ND`` in SQUALL (``every Voxel in 3D``).
    #
    # ``space`` tells what the columns of a sort of points are, for
    # ``.save out.nii.gz`` in the REPL, which writes a result on a grid:
    # ``space: voxel`` marks the indices (i, j, k) of the grid the sort
    # names with ``grid`` (an atlas of the engine, by its key under
    # ``atlases``), by default that of the engine's template (the MNI
    # mask), written as they are; ``space: mm`` coordinates (x, y, z) in
    # millimetres, converted to the nearest voxel of the template with
    # the inverse of its affine.  A result's columns take the sort of the
    # argument of the predicate their variable comes from in the query,
    # else of the sort they are named as.  ``atlas_voxel`` (mni_atlases)
    # indexes the grid of the Schaefer atlas, resampled to the template's.
    # A sort named ``streamline`` holds streamline ids, which ``.view``
    # draws with an engine giving their points (``streamline_points``).
    sorts:
      study:
        columns: [study_id]
        type: int
        description: "a study of the Neurosynth database"
      term:
        columns: [term]
        type: str
        description: "a term of the TF-IDF vocabulary"
      tfidf:
        columns: [tfidf]
        type: float
        description: "a TF-IDF weight"
      replicate:
        columns: [b]
        type: int
        description: "a replicate of a resampling of the studies"
      weight:
        columns: [w]
        type: float
        description: "the weight of a study in a replicate"
      voxel:
        columns: [i, j, k]
        type: int
        space: voxel
        description: "a voxel of the MNI template grid, in 3D"
      query:
        columns: [query]
        type: str
        description: "a free-text query"
      text:
        columns: [text]
        type: str
        description: "the title or abstract of a study"
      similarity:
        columns: [similarity]
        type: float
        description: "a cosine similarity between text embeddings"
      lift:
        columns: [lift]
        type: float
        description: "a lift P(A_v | T) / P(A_v), 1 under independence"
      relative_risk:
        columns: [relative_risk]
        type: float
        description: "a relative risk P(A_v | T) / P(A_v | not T), 1 under independence"
      uniformity:
        columns: [uniformity]
        type: float
        description: "a uniformity ratio P(A_v | T) / P(A_V | T), 1 under uniformity"
      cogat_term:
        columns: [term]
        type: str
        description: "a Cognitive Atlas label, in lower case"
      cogat_class:
        columns: [iri]
        type: str
        description: "a class of the Cognitive Atlas ontology, by its IRI"
      task:
        columns: [task_id]
        type: str
        description: "a task of the Cognitive Atlas"
      task_name:
        columns: [name]
        type: str
        description: "the name of a task of the Cognitive Atlas"
      task_description:
        columns: [description]
        type: str
        description: "the description of a task of the Cognitive Atlas"
      year:
        columns: [year]
        type: int
        description: "a year of publication"
      journal:
        columns: [journal]
        type: str
        description: "the name of a journal"
      pmid:
        columns: [pmid]
        type: int
        description: "a PubMed id"
      doi:
        columns: [doi]
        type: str
        description: "a DOI, in lower case, without https://doi.org/"
    # Each predicate declares its arguments, in column order: the entities
    # it relates, each a sort over the columns it spans, named alone or as
    # ``{sort: …, columns: […]}`` to rename the sort's columns.  A voxel
    # (i, j, k) is one argument, so ``reports`` relates a study and a
    # voxel.  The
    # probability column of a probabilistic symbol (``probability: true``)
    # is not an argument.  ``columns`` and ``arity`` (the number of
    # columns) are derived from the arguments.
    predicates:
      peak_reported:
        description: "Reported activation peaks in voxel coordinates"
        arguments:
          - voxel
          - study
      study_title:
        description: "Title of a study"
        arguments: [study, text]
      study_abstract:
        description: "Abstract of a study"
        arguments: [study, text]
      study_year:
        description: "The year a study was published"
        arguments: [study, year]
      study_journal:
        description: >-
          The journal a study was published in, named as the engine's
          metadata names it: find it with search_values
        arguments: [study, journal]
      study_pmid:
        description: >-
          The PubMed id of a study, the same in every engine (a Neurosynth
          study's id is its PubMed id): it matches the studies of two
          engines
        arguments: [study, pmid]
      study_doi:
        description: >-
          The DOI of a study, as its database gives it: match the studies
          of two engines on study_pmid
        arguments: [study, doi]
      study:
        description: "All study identifiers"
        arguments:
          - study
      term_in_study_tfidf:
        description: "Term frequency–inverse document frequency values"
        arguments:
          - study
          - term
          - tfidf
      selected_study:
        description: "Uniform probabilistic choice over studies"
        probability: true
        arguments:
          - study
      boot_studies:
        description: >
          Bayesian-bootstrap replicates b of the studies, for
          confidence intervals: RESAMPLE[boot_studies](pred(x)) = b is
          pred(x), any rule over PROB of selected_study, on replicate b
        arguments: [replicate, study, weight]
      voxel:
        description: "Every voxel index (i, j, k) of the MNI template grid"
        arguments:
          - voxel
      brain_mask:
        description: >-
          The voxels (i, j, k) of the MNI template grid inside the MNI152
          brain mask: the whole brain, subcortical structures and cerebellum
          included
        arguments:
          - voxel
      cortical_mask:
        description: >-
          The voxels (i, j, k) of the MNI template grid in the cortex
          (Harvard–Oxford cortical atlas, maximum probability, 25%
          threshold)
        arguments:
          - voxel
      cognitive_task:
        description: >-
          The tasks of the Cognitive Atlas (cognitiveatlas.org), with their
          names and descriptions
        arguments:
          - task
          - task_name
          - task_description
      term:
        description: "Every term of the TF-IDF vocabulary"
        arguments:
          - term
      study_with_peaks:
        description: "Studies reporting at least one activation peak"
        arguments:
          - study
      mentions:
        description: "Studies mentioning a term (TF-IDF above 0.03)"
        arguments:
          - study
          - term
      reports:
        description: "Studies reporting an activation peak at a voxel"
        arguments:
          - study
          - voxel
      weighted_mention:
        description: >-
          Every TF-IDF weight of a term in a study, as term_in_study_tfidf;
          reads in SQUALL as
          every Weighted_mention (?s; ?t; ?w) such that ?w is greater than 0.1
        arguments:
          - study
          - term
          - tfidf
      term_in_study:
        description: "Studies with a term, its TF-IDF being above 0.001"
        arguments:
          - study
          - term
      activated:
        description: >-
          Studies activating a voxel of the brain mask: one of their peaks is
          within {kernel_radius_mm} mm of it
        arguments:
          - voxel
          - study
      lift:
        description: >-
          Lift P(A_v | T) / P(A_v) of the activation of a voxel by the studies
          of a term: 1 under independence (association test)
        arguments:
          - term
          - voxel
          - lift
      relative_risk:
        description: >-
          Relative risk P(A_v | T) / P(A_v | not T) of the activation of a
          voxel by the studies of a term: 1 under independence
        arguments:
          - term
          - voxel
          - relative_risk
      uniformity:
        description: >-
          Uniformity ratio P(A_v | T) / P(A_V | T): the proportion of the
          studies of a term activating a voxel, over its average across the
          brain; 1 under uniformity (uniformity test)
        arguments:
          - term
          - voxel
          - uniformity
      ratios:
        description: "The lift, relative risk and uniformity ratio of a term at a voxel"
        arguments:
          - term
          - voxel
          - lift
          - relative_risk
          - uniformity
      selected_voxel:
        description: "Uniform probabilistic choice over the voxels of the brain mask"
        probability: true
        arguments:
          - voxel
      study_similarity:
        description: >-
          Cosine similarity of the title and abstract of a study to a
          free-text query (the studies with a text), embedded with SPECTER2;
          the first query embeds the abstracts, which takes a while and
          needs ``pip install "neurolang[embeddings]"``
        arguments:
          - query
          - study
          - similarity
      similar_study:
        description: >-
          The 5% of the studies closest to a free-text query by
          study_similarity; none for a text whose 20 closest studies have
          a mean similarity below 0.75
        arguments:
          - query
          - study
      lift_llm:
        description: "lift of a free-text query: the studies of similar_study are the studies of the term"
        arguments:
          - query
          - voxel
          - lift
      relative_risk_llm:
        description: "relative_risk of a free-text query (see lift_llm)"
        arguments:
          - query
          - voxel
          - relative_risk
      uniformity_llm:
        description: >-
          uniformity of a free-text query: the uniformity ratio of the 5% of
          the studies closest to the text (similar_study), as for the studies
          of a term
        arguments:
          - query
          - voxel
          - uniformity
      ratios_llm:
        description: "The lift, relative risk and uniformity ratio of a free-text query"
        arguments:
          - query
          - voxel
          - lift
          - relative_risk
          - uniformity
      cogat_subclass_of:
        description: >-
          Cognitive Atlas classes below others, at any depth (concepts,
          tasks, contrasts), by IRI
        arguments:
          - cogat_class
          - cogat_class
      cogat_term:
        description: >-
          Label of a Cognitive Atlas class in lower case, as the terms of
          mentions and term_in_study_tfidf
        arguments:
          - cogat_class
          - cogat_term
      cogat_definition:
        description: >-
          Definition of a Cognitive Atlas concept, by its lower-case label: a
          free-text query for similar_study, uniformity_llm and the other
          free-text predicates
        arguments:
          - cogat_term
          - query
      cogat_measures:
        description: >-
          Cognitive Atlas contrasts (and tasks) measuring a concept, by IRI
        arguments:
          - cogat_class
          - cogat_class
      schaefer_activated:
        description: >-
          Studies activating a Schaefer parcel (cortical networks): one of
          their peaks is within {kernel_radius_mm} mm of a voxel of the parcel
        arguments:
          - label
          - study
      schaefer400_activated:
        description: >-
          Studies activating a parcel of the Schaefer atlas of 400 parcels,
          17 networks (schaefer400): one of their peaks is within
          {kernel_radius_mm} mm of a voxel of the parcel
        arguments:
          - schaefer400_label
          - study
      destrieux_activated:
        description: >-
          Studies activating a Destrieux region: one of their peaks is within
          {kernel_radius_mm} mm of a voxel of the region
        arguments:
          - destrieux_label
          - study
      tian_activated:
        description: >-
          Studies activating a Tian subcortical region: one of their peaks is
          within {kernel_radius_mm} mm of a voxel of the region
        arguments:
          - tian_label
          - study
      schaefer_covered:
        description: >-
          How much a study covers a Schaefer parcel, as a probability: the
          mean over the parcel's voxels of the study's activation, a
          Gaussian kernel of 10 mm FWHM around its nearest peak
        probability: true
        arguments:
          - label
          - study
      schaefer400_covered:
        description: >-
          How much a study covers a parcel of the Schaefer atlas of 400
          parcels, as a probability (see schaefer_covered)
        probability: true
        arguments:
          - schaefer400_label
          - study
      destrieux_covered:
        description: >-
          How much a study covers a Destrieux region, as a probability (see
          schaefer_covered)
        probability: true
        arguments:
          - destrieux_label
          - study
      tian_covered:
        description: >-
          How much a study covers a Tian subcortical region, as a probability
          (see schaefer_covered)
        probability: true
        arguments:
          - tian_label
          - study
      peak_mni:
        description: >-
          Reported activation peaks in MNI coordinates, in millimetres
        arguments:
          - mni
          - study

  neurosynth:
    extends: coordinate_meta_analysis
    # The name of the engine on the REPL page, which offers the engines
    # with one (doc/make_repl_bundle.py reads it here, not inherited).
    label: "Neurosynth"
    description: >
      Neurosynth database — forward and reverse inference over
      reported activation peaks, TF-IDF term frequencies, and a
      probabilistic choice over studies.
    python_init: "neurolang_apps.utils.engines.neurosynth.init"
    acknowledgements:
      - >-
        Neurosynth: Yarkoni T, Poldrack RA, Nichols TE, Van Essen DC,
        Wager TD. Large-scale automated synthesis of human functional
        neuroimaging data. Nature Methods 8:665-670 (2011).
        doi:10.1038/nmeth.1635
      - >-
        The titles and abstracts of the studies: PubMed, courtesy of the
        U.S. National Library of Medicine (https://pubmed.ncbi.nlm.nih.gov)

  neurostore:
    extends: coordinate_meta_analysis
    label: "NeuroStore"
    description: >
      NeuroStore database (the one NiMARE fetches with
      ``fetch_neurostore``, behind Neurosynth Compose) — the predicates of
      neurosynth, with TF-IDF term frequencies computed from the study
      abstracts, plus the abstracts, titles and LLM-extracted cognitive
      concepts and domains of the studies.
    python_init: "neurolang_apps.utils.engines.neurostore.init"
    python_init_options:
      # How long a build uses the kept listing of NeuroStore's releases
      # before asking the network again (NEUROLANG_NEUROSTORE_UPDATE=1
      # lists them at once).
      release_listing_ttl_hours: 24
    acknowledgements:
      - >-
        NeuroStore (https://neurostore.org), the database of Neurosynth
        Compose: its studies, peaks, titles, abstracts and LLM-extracted
        concepts and domains, its release read as NiMARE's
        nimare-studyset-parquet
    # Twice as many studies as neurosynth: 200 replicates keep a query
    # within the time and memory the query assistant gives it.
    resamplings:
      boot_studies: {n: 200}
    # The 95th percentile of the null of doc/similarity_calibration.rst
    # over NeuroStore's studies (0.75 lets 9% of it through).
    text_embeddings:
      study_abstracts: {similarity_gate: 0.76}
    sorts:
      study:
        type: str
        description: "a study of the NeuroStore database"
      concept:
        columns: [concept]
        type: str
        description: "a cognitive concept extracted from the tasks of a study"
      domain:
        columns: [domain]
        type: str
        description: "a cognitive domain extracted from the tasks of a study"
    predicates:
      study_concept:
        description: "Cognitive concepts extracted from the tasks of a study"
        arguments: [study, concept]
      study_domain:
        description: "Cognitive domains extracted from the tasks of a study"
        arguments: [study, domain]
      term_in_study_tfidf:
        description: >-
          TF-IDF of the terms of the abstracts, computed from them
          (NeuroStore ships no term table)

  destrieux:
    description: >
      Destrieux 2009 cortical atlas — region definitions for the
      Destrieux cortical parcellation, each mapped to a volumetric
      brain region (ExplicitVBR).
    requires_mni_mask: true
    acknowledgements:
      - >-
        MNI152 template and brain mask, ICBM 2009a nonlinear symmetric
        (nilearn's): Fonov V, Evans AC, Botteron K, Almli CR, McKinstry RC,
        Collins DL. Unbiased average age-appropriate atlases for pediatric
        studies. NeuroImage 54:313-327 (2011).
        doi:10.1016/j.neuroimage.2010.07.033
      - >-
        Destrieux 2009 atlas (nilearn's): Destrieux C, Fischl B, Dale A,
        Halgren E. Automatic parcellation of human cortical gyri and sulci
        using standard anatomical nomenclature. NeuroImage 53:1-15 (2010).
        doi:10.1016/j.neuroimage.2010.06.010
    use_base_symbols: true
    builtins: [exp, log, startswith]
    atlases:
      destrieux:
        predicate_name: destrieux
        description: "Cortical region name and ExplicitVBR geometry"
    datalog_init: |
      left_region(N, R) :- destrieux(N, R), startswith('L ', N)
      right_region(N, R) :- destrieux(N, R), startswith('R ', N)
    # The full anatomical names of its regions (see mni_atlases).
    relations:
      destrieux_name:
        file: mni_atlases/destrieux_names.tsv
    sorts:
      label:
        columns: [name]
        type: str
        atlas: destrieux
        description: "a Destrieux region name"
      region_name:
        columns: [name]
        type: str
        description: >-
          the full anatomical name of a region, with its hemisphere, as
          'Superior frontal gyrus (F1), left'
      region:
        columns: [region]
        type: ExplicitVBR
        description: "a brain region"
    predicates:
      destrieux:
        description: "Cortical region name and ExplicitVBR geometry"
        arguments:
          - label
          - region
      left_region:
        description: "Left-hemisphere Destrieux regions"
        arguments:
          - label
          - region
      right_region:
        description: "Right-hemisphere Destrieux regions"
        arguments:
          - label
          - region
      destrieux_name:
        description: >-
          The full anatomical name of each Destrieux region (Destrieux et
          al. 2010, Table 1), with its hemisphere: 'L G front sup' is
          'Superior frontal gyrus (F1), left'
        arguments:
          - label
          - region_name

  tracts:
    extends: mni_atlases
    description: >
      Tractography (neurolang_apps.utils.engines.tracts):
      the commands .load_tractogram and .index_tracts of a program build
      the relations of a tractogram, in MNI152, indexed by the atlases of
      the engine (.index_tracts(t, "destrieux"), "tian" or "schaefer") or
      by one the program loads (.load_atlas), and the vocabulary of
      tractography, rules over them, says where streamlines go:
      traverses(x, term, h), endpoint_in(x, e, term, h), anterior_of(x,
      term, h)... A label of an atlas of the engine, label("destrieux", l,
      name, h), is the name of its relation, destrieux(name, region). A
      result of streamline ids x is drawn by .view.
      The white-matter bundles, tract_querier's queries translated to the
      vocabulary and each described, are defined by importing a module of
      the engine: .import('bundles/freesurfer_queries.dl')
      defines uf(x, h) (the uncinate fasciculus), af, cst, ilf, ioff, cb,
      slf_i, cc, cc_1 ... cc_7 and more; freesurfer_queries_bsf2016.dl and
      freesurfer_queries_bsf2016_toad.dl revise them (uf, af, ilf, dlf,
      emc, cortico_spinal...); mori_queries.dl gives those of the JHU
      atlas (unc, ifo, cg, corpus_callosum...). The modules share names:
      import one.
    solver_mixins:
      - "neurolang_apps.utils.engines.tracts.frontend:TractsCommandsMixin"
    # the vocabulary (vocabulary.dl of the package), the functions
    # of the ids x and the hooks of .view, over what the commands load;
    # .index_tracts finds the atlases of the engine, loaded after it
    python_init: "neurolang_apps.utils.engines.tracts.frontend"
    acknowledgements:
      - >-
        The bundles (bundles/*.dl), tract_querier's queries: Wassermann D,
        Makris N, Rathi Y, Shenton M, Kikinis R, Kubicki M, Westin CF. The
        white matter query language: a novel approach for describing human
        white matter anatomy. Brain Structure and Function 221:4705-4721
        (2016). doi:10.1007/s00429-015-1179-4
      - >-
        The HCP842 atlas, when a program fetches it (CC BY 4.0): Yeh FC et
        al. Population-averaged atlas of the macroscale human structural
        connectome and its network topology. NeuroImage 178:57-68 (2018).
        doi:10.1016/j.neuroimage.2018.05.027; as curated for DIPY's
        RecoBundles (doi:10.6084/m9.figshare.7375883): Garyfallidis E et
        al. Recognition of white matter bundles using local and global
        streamline-based registration and clustering. NeuroImage
        170:283-295 (2018). doi:10.1016/j.neuroimage.2017.07.015
      - >-
        The HCP1065 atlas, when a program fetches it (CC BY-SA 4.0): Yeh
        FC. Population-based tract-to-region connectome of the human brain
        and its hierarchical topology. Nature Communications 13:4933
        (2022). doi:10.1038/s41467-022-32595-4. Data were provided [in
        part] by the Human Connectome Project, WU-Minn Consortium
        (Principal Investigators: David Van Essen and Kamil Ugurbil;
        1U54MH091657) funded by the 16 NIH Institutes and Centers that
        support the NIH Blueprint for Neuroscience Research; and by the
        McDonnell Center for Systems Neuroscience at Washington
        University.
    # The sorts of the arguments of the vocabulary and of the bundles, as
    # their %% documentation gives them (uncinate(x: streamline, h:
    # hemisphere)); the query assistant is told their descriptions.
    # ``streamline`` is the sort .view draws as streamlines.
    sorts:
      streamline:
        columns: [x]
        type: int
        description: >-
          a streamline, by its integer id; streamline(x, t, s) gives the
          tractogram t it is of and its position s in the file
      end:
        columns: [e]
        type: int
        description: >-
          an end of a streamline, 0 or 1: it only tells the two ends apart
          (the same end), the order of the points being arbitrary
      term:
        columns: [term]
        type: str
        description: >-
          a term of the term mapping of the atlas indexed, a string such as
          "temporal", "insula" or "amygdala": label_term(a, l, term) lists
          them, from the mappings of the engine (its mappings/*.tsv)
          (freesurfer_aseg_aparc for a FreeSurfer atlas)
      hemisphere:
        columns: [h]
        type: str
        description: >-
          a hemisphere: "left", "right" or "none" (a structure of no side,
          such as the brain stem); opposite_hemisphere(h, o) gives the other
      axis:
        columns: [axis]
        type: int
        description: >-
          an axis of RAS+ millimetres: 0 x (left to right), 1 y (posterior to
          anterior), 2 z (inferior to superior)
      atlas:
        columns: [a]
        type: str
        description: "an atlas indexed with .index_tracts, by its name"
      label_id:
        columns: [l]
        type: int
        description: "the id of a label of an atlas indexed"
      coordinate:
        columns: [v]
        type: float
        description: "a coordinate in millimetres, RAS+, on an axis"
    # The relations .load_tractogram and .index_tracts store (vocabulary.dl):
    # their streamline x is of the sort streamline, so that .view draws a
    # result of their streamlines as streamlines, even beside the regions
    # they join, ans(s, l1, l2).
    predicates:
      streamline:
        description: >-
          Each streamline x, the tractogram t it is of and its position s in
          the file
        arguments:
          - streamline
          - {sort: tractogram, columns: [t], type: str}
          - {sort: position, columns: [s], type: int}
      streamline_label:
        description: >-
          The labels l of atlas a that streamline x goes through
        arguments: [atlas, streamline, label_id]
      endpoint_label:
        description: "The label l of atlas a of the end e of streamline x"
        arguments: [atlas, streamline, end, label_id]
      streamline_extent:
        description: >-
          The bounds lo and hi of the points of streamline x on an axis, in
          millimetres
        arguments:
          - streamline
          - axis
          - {sort: coordinate, columns: [lo]}
          - {sort: coordinate, columns: [hi]}
      endpoint_coord:
        description: >-
          The coordinate v, on an axis, of the end e of streamline x
        arguments: [streamline, end, axis, coordinate]
      endpoint_point:
        description: >-
          The point (px, py, pz), in MNI millimetres, of the end e of
          streamline x; EUCLIDEAN(px, py, pz, x, y, z) <= r with the points
          of another stored relation (schaefer_points) finds the ends near
          them
        arguments:
          - streamline
          - end
          - {sort: mni, columns: [px, py, pz]}
      streamline_length:
        description: "The length mm of streamline x, in millimetres"
        arguments:
          - streamline
          - {sort: length, columns: [mm], type: float}

  # The engines of a meta-analysis with tractography: the vocabulary of
  # tracts over the parcels whose studies a meta-analysis engine has
  # (schaefer_activated...), and the questions on both.
  meta_analysis_tracts:
    abstract: true
    extends: [coordinate_meta_analysis, tracts]

  # The whole-brain tractogram of the IIT Human Brain Atlas v3, indexed by
  # its wmparc, and tract_querier's bundles, at the prompt (see
  # neurosynth_iit).
  iit_tractogram:
    abstract: true
    extends: tracts
    acknowledgements:
      - >-
        IIT Human Brain Atlas v3 (Illinois Institute of Technology; Qi X,
        Arfanakis K et al.): its whole-brain tractogram (IIT3mean.tck) and
        its Desikan-Killiany wmparc, under the IIT Human Brain Template
        License (non-commercial educational and research use, with
        attribution; https://www.nitrc.org/projects/iit/); FreeSurfer's
        colour LUT
    # The IIT Human Brain Atlas v3 (Qi, Arfanakis et al., IIT Human Brain
    # Template License: non-commercial research, attribution): its
    # whole-brain tractogram and its Desikan-Killiany wmparc, from the OSF
    # project of tract_querier's test files (https://osf.io/ugyqa/), and
    # FreeSurfer's colour LUT, at a commit.
    downloads:
      - url: https://osf.io/download/6af216907216d01bbe53b9f5/
        name: IIT3mean.tck
        md5: 6e9703e4e331cfb26f3eb2e29526e225
        dest: tracts/iit
      - url: https://osf.io/download/rk7a5/
        name: IIT3mean_desikan_2009.nii.gz
        md5: 767813ba451d5209cdc9454617a636b7
        dest: tracts/fs
      - url: https://raw.githubusercontent.com/freesurfer/freesurfer/18761d34d14d62216ec1ca3b0056fb9b04ea2f59/distribution/FreeSurferColorLUT.txt
        md5: ce7f38b53a507ac1990e0795353417d7
        dest: tracts/fs
    # The tractogram of the bundle of the REPL: the file path is replaced in
    # the bundle's data directory by subsample of its streamlines drawn at
    # random (seed), each thinned to every step-th point
    # (doc/make_repl_bundle.py)
    tractogram: {path: tracts/iit/IIT3mean.tck, subsample: 15000, step: 3, seed: 0}
    datalog_init: |
      .load_tractogram("iit", "tracts/iit/IIT3mean.tck", space="MNI152")
      .load_atlas("fs", "tracts/fs/IIT3mean_desikan_2009.nii.gz", "tracts/fs/FreeSurferColorLUT.txt", kind="freesurfer", space="MNI152")
      .index_tracts("iit", "fs")
      .import("bundles/freesurfer_queries.dl")

  neurosynth_tracts:
    extends: [neurosynth, meta_analysis_tracts]
    description: >
      Neurosynth with tractography: the studies, terms, peaks and Cognitive
      Atlas of neurosynth, the studies that activate each parcel of its
      atlases (schaefer_activated(label, study)...), and the commands and
      vocabulary of tractography of tracts (extra tracts of
      neurolang-apps), whose streamlines end near the points of a parcel
      (endpoint_point, schaefer_points). similar_study, the studies about
      a text, needs the extra embeddings (SPECTER2). The uncinate
      fasciculus and the concepts of the studies that activate its parcels
      are examples/uncinate_cogat.dl of the engine tracts.

  neurosynth_iit:
    extends: [neurosynth_tracts, iit_tractogram]
    label: "Neurosynth + tracts"
    description: >
      Neurosynth with a whole-brain tractogram and tract_querier's bundles:
      neurosynth_tracts after the commands that load the whole-brain
      tractogram of the IIT Human Brain Atlas v3 (IIT3mean.tck, 38,000
      streamlines, RAS+ mm, 88 MB, downloaded into the data directory's
      tracts/iit), load the atlas's Desikan-Killiany wmparc (downloaded, with
      FreeSurfer's colour LUT, into tracts/fs; its labels are the codes of
      FreeSurfer's, so the term mapping freesurfer_aseg_aparc applies; the
      tractogram and the atlas are of the same atlas, so in the same space),
      index the tractogram by it and import the bundles of tract_querier's
      freesurfer_queries.qry, so that ans(x) :- uf(x, "left") and .view work
      at the prompt. The files are read relative to the data directory,
      from which datalog_init runs. The entry tractogram tells the bundle of
      the REPL in the browser how to subsample the file it ships in its
      place, so that this program is the same there.

  neurostore_tracts:
    extends: [neurostore, meta_analysis_tracts]
    description: >
      NeuroStore with tractography: neurostore (its studies, terms, peaks,
      abstracts, concepts and domains) and the commands and vocabulary of
      tractography of tracts, as neurosynth_tracts is for neurosynth.

  neurostore_iit:
    extends: [neurostore_tracts, iit_tractogram]
    label: "NeuroStore + tracts"
    description: >
      NeuroStore with a whole-brain tractogram and tract_querier's bundles:
      neurostore_tracts after the commands of neurosynth_iit, which load the
      whole-brain tractogram and the Desikan-Killiany wmparc of the IIT
      Human Brain Atlas v3 (downloaded into the data directory's tracts),
      index the one by the other and import the bundles of
      freesurfer_queries.qry, so that ans(x) :- uf(x, "left") and .view
      work at the prompt.

  disconnectome7t_tractogram:
    abstract: true
    extends: tracts
    acknowledgements:
      - >-
        Disconnectome7T (Thiebaut de Schotten M, Foulon C, Nachev P. Brain
        disconnections link structural connectivity with function and
        behaviour. Nature Communications 11:5094 (2020).
        doi:10.1038/s41467-020-18920-9; https://osf.io/5zqwg/): the
        tractography of the 7 T diffusion MRI of the Human Connectome
        Project; data provided by the Human Connectome Project, WU-Minn
        Consortium (Principal Investigators: David Van Essen and Kamil
        Ugurbil; 1U54MH091657) funded by the 16 NIH Institutes and Centers
        that support the NIH Blueprint for Neuroscience Research, and by the
        McDonnell Center for Systems Neuroscience at Washington University;
        FreeSurfer's colour LUT; the bundles of tract_querier (Wassermann D,
        Makris N, Rathi Y, Shenton M, Kikinis R, Kubicki M, Westin CF. The
        white matter query language: a novel approach for describing human
        white matter anatomy. Brain Structure and Function 221:4705-4721
        (2016). doi:10.1007/s00429-015-1179-4)
    # 300,000 streamlines of 20 HCP subjects of Disconnectome7T, all
    # within the MNI152 brain, and their group FreeSurfer segmentation,
    # both in the HCP's MNI152 space (tools/hcp_connectivity, dense.py and
    # space.py), in the dataset
    # https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity at a tag.
    downloads:
      - url: https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity/-/raw/v2.1/tractography/disconnectome7t.tck
        name: disconnectome7t.tck
        md5: 340d63f180395d40ca7f39ee80eae7b5
        dest: tracts/disconnectome7t
      - url: https://gitlab.inria.fr/dwasserm/neurolang-hcp-connectivity/-/raw/v2.1/tractography/disconnectome7t_wmparc.nii.gz
        name: disconnectome7t_wmparc.nii.gz
        md5: 0e3774fcd9cee7f4934f9733f9944ede
        dest: tracts/disconnectome7t
      - url: https://raw.githubusercontent.com/freesurfer/freesurfer/18761d34d14d62216ec1ca3b0056fb9b04ea2f59/distribution/FreeSurferColorLUT.txt
        md5: ce7f38b53a507ac1990e0795353417d7
        dest: tracts/fs
    # The bundle of the REPL ships a subsample (the points are already
    # compressed: every point kept)
    tractogram: {path: tracts/disconnectome7t/disconnectome7t.tck, subsample: 15000, step: 1, seed: 0}
    datalog_init: |
      .load_tractogram("d7t", "tracts/disconnectome7t/disconnectome7t.tck", space="MNI152")
      .load_atlas("fs", "tracts/disconnectome7t/disconnectome7t_wmparc.nii.gz", "tracts/fs/FreeSurferColorLUT.txt", kind="freesurfer", space="MNI152")
      .index_tracts("d7t", "fs")
      .import("bundles/freesurfer_queries.dl")

  neurosynth_disconnectome7t:
    extends: [neurosynth_tracts, disconnectome7t_tractogram]
    label: "Neurosynth + 7 T tracts"
    description: >
      Neurosynth with a dense whole-brain tractogram and tract_querier's
      bundles: neurosynth_tracts after the commands that load a dense
      tractogram of the Human Connectome Project's 7 T diffusion MRI
      (Disconnectome7T: 300,000 streamlines of at least 30 mm of 20
      subjects, all within the brain, 44 MB, downloaded into the data
      directory's tracts/disconnectome7t), load the FreeSurfer segmentation of those
      subjects (the label most of them give each voxel; FreeSurfer's codes,
      so the term mapping freesurfer_aseg_aparc applies), both in the
      HCP's MNI152 space, the space of the atlases, index the one by the
      other and import the bundles of tract_querier's
      freesurfer_queries.qry, so that ans(x) :- uf(x, "left") and .view
      work at the prompt. Denser than neurosynth_iit (38,000 streamlines of
      one template), and of real subjects: the bundles have more
      streamlines, and some IIT does not find (af, slf_i, ec) are found.

  neurostore_disconnectome7t:
    extends: [neurostore_tracts, disconnectome7t_tractogram]
    label: "NeuroStore + 7 T tracts"
    description: >
      NeuroStore with a dense whole-brain tractogram and tract_querier's
      bundles: neurostore_tracts after the commands of
      neurosynth_disconnectome7t (Disconnectome7T, 300,000 streamlines of
      20 HCP subjects at 7 T, and their FreeSurfer segmentation, in the
      HCP's MNI152 space), so that ans(x) :- uf(x, "left") and .view work
      at the prompt.

  biomedsql:
    description: >
      The tables of BiomedSQL (NIH-CARD), a text-to-SQL benchmark of the
      genetics of neurodegenerative diseases and of drugs, with all their
      columns: GWAS of Parkinson's disease (pd_gwas) and Alzheimer's disease
      (ad_gwas), Mendelian-randomisation (SMR) tests of genes as mediators
      of six diseases across 28 QTL datasets (smr), drug annotations (drug)
      and drug targets and indications (drug_indication). The QTL datasets
      are also equally likely units of evidence: selected_qtl(q) is a
      uniform choice of one, and qtl_tested / qtl_significant say which
      tested a gene for a disease and which found it significant.
    python_init: "neurolang_apps.utils.engines.biomedsql.init"
    python_init_options:
      # The weight, against one dataset, of the two imaginary units of
      # evidence of selected_unit: one always significant, one never. Fitted
      # by log-loss on the leave-one-dataset-out predictions of 222 genes
      # (tools/biomedsql_benchmark/replication/fit_prior.py).
      prior_significant: 0.01
      prior_none: 0.5
    builtins: [lcase, str_contains]
    # The probability that a QTL dataset found a gene significant for a
    # disease, given that it tested it: the share of the datasets that
    # tested it that found it significant.
    datalog_init: |
      support(g, d, PROB) :- (qtl_significant(q, g, d) & selected_qtl(q)) // (qtl_tested(q, g, d) & selected_qtl(q))
      support_prior(g, d, PROB) :- (unit_significant(u, g, d) & selected_unit(u)) // (unit_tested(u, g, d) & selected_unit(u))
    acknowledgements:
      - >-
        BiomedSQL (https://huggingface.co/datasets/NIH-CARD/BiomedSQL,
        licence openrail++), NIH Center for Alzheimer's and Related
        Dementias.
    sorts:
      gene:
        columns: [gene]
        type: str
        description: "a gene symbol, e.g. 'GPNMB'"
      disease:
        columns: [disease]
        type: str
        description: "a disease code: AD, PD, ALS, FTD, LBD or PSP"
      qtl_dataset:
        columns: [qtl_dataset]
        type: str
        description: "a QTL dataset, e.g. 'brain_mMeta' or 'Whole_Blood'"
    predicates:
      pd_gwas:
        description: >-
          GWAS summary statistics for Parkinson's disease (Nalls et al. 2019, without 23andMe), one row per variant: rsID, effect and other allele, effect-allele frequency, effect size b (beta) and its standard error, p-value, position on GRCh37 and GRCh38, and the nearest gene
        columns: [UUID, SNP, A1, A2, freq, b, se, p, chr_37, bp_37, chr_38, bp_38, nearestGene]
      ad_gwas:
        description: >-
          GWAS summary statistics for Alzheimer's disease, one row per variant, with the same columns as pd_gwas
        columns: [UUID, SNP, A1, A2, freq, b, se, p, chr_37, bp_37, chr_38, bp_38, nearestGene]
      smr:
        description: >-
          Summary-data-based Mendelian randomisation (SMR) results linking a gene probe in a QTL dataset (Omic, Omic_type, Omic_tissue, Source) to a disease (Disease: AD, PD, ALS, FTD, LBD or PSP): the top variant, GWAS, eQTL and SMR effects and p-values, the multi-SNP SMR p-value p_SMR_multi and the HEIDI heterogeneity p-value p_HEIDI, and the functional significance func_sig
        columns: [UUID, Omic, Disease, probeID, ProbeChr, Gene, Probe_bp, topSNP, topSNP_chr, topSNP_bp, A1, A2, Freq, b_GWAS, se_GWAS, p_GWAS, b_eQTL, se_eQTL, p_eQTL, b_SMR, se_SMR, p_SMR, p_SMR_multi, p_HEIDI, nsnp_HEIDI, topRSID, Omic_type, Omic_tissue, Disease_name, Source, func_sig]
      drug:
        description: >-
          Drug annotations, one row per drug: ChEMBL identifier, name, trade names and synonyms (comma-separated text), molecular type, action type, mechanism of action, year of first approval, highest clinical-trial phase, whether it is approved, withdrawn or has a black-box warning (the text 'True' or 'False'), linked diseases and linked target genes (text), and a description
        columns: [UUID, chemblIdentifier, blackBoxWarning, drugName, drugMolecularType, yearOfFirstApproval, maxClinicalTrialPhase, drugHasBeenWithdrawn, drugIsApproved, tradeNames_string, drugSynonyms_string, linkedDiseasesDrug_string, linkedDiseasesCount, newLinkedTargets_string, numberLinkedTargets, drugDescription, drugActionType, drugMechanismOfAction, tradename_count, synonyms_count]
      drug_indication:
        description: >-
          Drug targets and indications, one row per drug, target and disease: the drug's names (lists as text), type and action type, the target gene (target is an Ensembl id, approvedSymbol its gene symbol and approvedName its name), the disease it is used or tested for (MeSH and EFO ids and terms), the highest clinical-trial phase for that indication (max_phase_for_ind) and its patent number
        columns: [UUID, chemblId, drugName, tradeName, drugType, actionType, targetType, target, approvedSymbol, approvedName, yearOfFirstApproval, usan_year, patent_no, max_phase_for_ind, mesh_id, mesh_heading, efo_id, efo_term, tradeNames_list, tradename_count, syns_list, synonyms_count, ct]
      qtl_dataset:
        description: >-
          A QTL dataset of the SMR tests, its tissue, its kind and its organ
          (brain, blood, spinal cord, cerebrospinal fluid, liver, muscle or
          nerve)
        columns: [qtl_dataset, tissue, kind, organ]
      qtl_tested:
        description: "The QTL dataset tested the gene as a mediator of the disease"
        arguments: [qtl_dataset, gene, disease]
      qtl_significant:
        description: >-
          The QTL dataset found the gene significant as a mediator of the
          disease (p_smr_multi < 2.95e-6 for a probe of the gene)
        arguments: [qtl_dataset, gene, disease]
      support:
        description: >-
          The probability that a QTL dataset, drawn at random among those that
          tested the gene for the disease, found the gene significant: its
          share of significant tests (a probabilistic rule over selected_qtl)
        columns: [gene, disease, probability]
      support_prior:
        description: >-
          Like support, with a prior: two imaginary datasets, one always
          significant and one never, weigh in the choice of unit of evidence,
          so that (k + a) / (n + a + b) of k significant datasets among n:
          a gene tested in one dataset is not given probability 1
        columns: [gene, disease, probability]
      evidence_unit:
        description: "The 28 QTL datasets and the two imaginary units of the prior"
        arguments: [qtl_dataset]
      unit_tested:
        description: "The unit of evidence tested the gene for the disease (a dataset, or an imaginary unit, which tests every pair)"
        arguments: [qtl_dataset, gene, disease]
      unit_significant:
        description: "The unit of evidence found the gene significant for the disease (a dataset, or the always significant imaginary unit)"
        arguments: [qtl_dataset, gene, disease]
      selected_unit:
        description: >-
          Probabilistic choice of one unit of evidence: a dataset weighs 1,
          the imaginary units of the prior their weights
        arguments: [qtl_dataset]
      selected_qtl:
        description: >-
          Probabilistic choice of one QTL dataset, all equally likely: the
          QTL datasets as units of evidence
        arguments: [qtl_dataset]

