engines:
  # The files <engine>/*.yaml next to this one are merged into the entry
  # of their engine: its example queries (examples.yaml) and the
  # guidance of the query assistant (guidance.yaml).
  #
  # Abstract engines only hold configuration shared by other engines;
  # concrete engines pull it in with ``extends`` (a name or a list of
  # names).  Mappings are merged key by key, ``datalog_init`` rules and
  # the ``builtins`` / ``downloads`` / ``ontologies`` /
  # ``assistant_examples`` / ``hidden_predicates`` / ``python_init`` lists
  # are concatenated, parent first, and any other value is overridden by
  # the extending engine.  Set a mapping entry to ``null`` to drop it.  A
  # base reached twice is merged once.

  # The atlases of the MNI152 brain: the classical (gyral and sulcal)
  # anatomy of the cortex, Destrieux, and the functional anatomy, Schaefer
  # (cortical networks) and Tian (subcortex), each a relation (label,
  # region) of the engines that extend this one; their label images,
  # resampled to the template of an engine that has one (nearest
  # neighbour), are the grids of the engine (``grids``), so that a voxel
  # (i, j, k) of an atlas is that of ``voxel``; each is recorded, by name, in
  # its ``atlases`` (neurolang.atlases.Atlas), as .load_atlas records one.
  mni_atlases:
    abstract: true
    description: >
      The Destrieux, Schaefer and Tian atlases of the MNI152 brain, as
      relations of a label and its region.
    # ``points``: the centres of the voxels of each region, in millimetres,
    # a stored relation that EUCLIDEAN(...) <= r joins with a tree.
    atlases:
      schaefer:
        predicate_name: schaefer
        n_rois: 100
        resolution_mm: 2
        yeo_networks: 17
        points: {predicate_name: schaefer_points}
      destrieux:
        predicate_name: destrieux
        points: {predicate_name: destrieux_points}
      tian:
        predicate_name: tian
        scale: 2
        points: {predicate_name: tian_points}
    datalog_init: |
      schaefer_voxels(i, j, k, l) :- schaefer(l, r), contains(r, (i, j, k)).
      schaefer_label(l) :- schaefer(l, r)
      labels(l, i, j, k) :- schaefer_voxels(i, j, k, l)
    hidden_predicates: [schaefer_voxels]
    sorts:
      mni:
        columns: [x, y, z]
        type: float
        space: mm
        description: "a point in MNI space, in millimetres, in 3D"
      atlas_voxel:
        columns: [i, j, k]
        type: int
        space: voxel
        grid: schaefer
        description: "a voxel of the Schaefer atlas grid, the template's, in 3D"
      label:
        columns: [label]
        type: str
        atlas: schaefer
        description: "a Schaefer 2018 parcel label"
      destrieux_label:
        columns: [label]
        type: str
        atlas: destrieux
        description: "a region of the Destrieux 2009 cortical atlas"
      tian_label:
        columns: [label]
        type: str
        atlas: tian
        description: "a region of the Tian 2020 subcortical atlas"
      region:
        columns: [region]
        type: ExplicitVBR
        description: "a brain region"
    predicates:
      schaefer:
        description: "Schaefer 2018 parcel label and its region"
        arguments:
          - label
          - region
      schaefer_label:
        description: "Every Schaefer 2018 parcel label"
        arguments:
          - label
      destrieux:
        description: >-
          Destrieux 2009 cortical atlas (gyri and sulci): region name and
          region; names start with the hemisphere, L or R
        arguments:
          - destrieux_label
          - region
      tian:
        description: >-
          Tian 2020 subcortical atlas, scale 2 (32 regions): region name and
          region; names end with the hemisphere, lh or rh
        arguments:
          - tian_label
          - region
      schaefer_voxels:
        description: >-
          Voxels (i, j, k) of the Schaefer atlas grid in each parcel
        arguments:
          - atlas_voxel
          - label
      labels:
        description: >-
          Schaefer parcel labelling each voxel (i, j, k) of the atlas grid,
          that of voxel and reports
        arguments:
          - label
          - atlas_voxel
      schaefer_points:
        description: >-
          The centre of each voxel of the Schaefer atlas, in MNI
          millimetres, and its parcel; EUCLIDEAN(x, y, z, x2, y2, z2) <= r
          with the points of another stored relation finds those near
          them
        arguments:
          - mni
          - label
      destrieux_points:
        description: >-
          The centre of each voxel of the Destrieux atlas, in MNI
          millimetres, and its region (see schaefer_points)
        arguments:
          - mni
          - destrieux_label
      tian_points:
        description: >-
          The centre of each voxel of the Tian atlas, in MNI millimetres,
          and its region (see schaefer_points)
        arguments:
          - mni
          - tian_label

  coordinate_meta_analysis:
    abstract: true
    extends: mni_atlases
    description: >
      Shared setup of the coordinate-based meta-analysis engines
      (neurosynth, neurostore): reported activation peaks, TF-IDF term
      frequencies, and a probabilistic choice over studies.  Voxels
      (i, j, k) index the 1 mm MNI152 grid (at the default resolution):
      the MNI point (x, y, z) in mm is the voxel (x + 98, y + 134,
      z + 72), and distances between voxels are in voxels.  A study
      activates the voxels within {kernel_radius_mm} mm of its peaks.
    requires_mni_mask: true
    use_base_symbols: true
    builtins: [exp, log, startswith, lcase]
    python_init_options:
      # Peaks whose coordinate space is neither MNI nor Talairach
      # (Neurosynth's UNKNOWN: 53,878 peaks of 1,832 studies; NeuroStore's
      # other or missing spaces): ``mni`` takes them as MNI, as Neurosynth
      # and NiMARE do; ``tal`` converts them as Talairach; ``drop`` leaves
      # them out. An engine extending this one can set its own value.
      unknown_space: mni
    # The radius of the sphere a peak activates, in millimetres, at every
    # resolution: that of ``activated`` (``{kernel_radius_voxels}``, in
    # voxels of the grid), of the activations of the atlases and of the
    # texts saying ``{kernel_radius_mm}``.  6 mm is the radius of
    # Neurosynth's activation maps (doc/tutorial_neurosynth_tests.rst).
    kernel_radius_mm: 6
    # Each atlas of mni_atlases, with ``activated``, also registers which
    # studies activate its regions: ``{atlas}_activated(label, study)`` when
    # a peak of the study (``peak_mni``, in millimetres) is within
    # ``radius_mm``, by default ``kernel_radius_mm``, of a voxel of the
    # region.  ``covered`` registers how much the studies cover its regions,
    # probabilistic facts ``{atlas}_covered(label, study)``: the mean over
    # the voxels of the region of the study's activation, the max over its
    # peaks of a Gaussian kernel of ``fwhm_mm`` (10) truncated at 3 sigma;
    # those below ``threshold`` (0.001) are left out.
    atlases:
      schaefer:
        activated: {predicate_name: schaefer_activated}
        covered: {predicate_name: schaefer_covered}
      destrieux:
        activated: {predicate_name: destrieux_activated}
        covered: {predicate_name: destrieux_covered}
      tian:
        activated: {predicate_name: tian_activated}
        covered: {predicate_name: tian_covered}
    datalog_init: |
      study_with_peaks(s) :- peak_reported(i, j, k, s).
      mentions(s, t) :- term_in_study_tfidf(s, t, v), (v > 0.03)
      reports(s, i, j, k) :- peak_reported(i, j, k, s)
      weighted_mention(s, t, w) :- term_in_study_tfidf(s, t, w)
      term_in_study(s, t) :- term_in_study_tfidf(s, t, w) & (w > 0.001)
      activated(i, j, k, s) :- brain_mask(i, j, k) & peak_reported(i1, j1, k1, s) & (EUCLIDEAN(i, j, k, i1, j1, k1) <= {kernel_radius_voxels})
      p_a(i, j, k, PROB) :- activated(i, j, k, s) & selected_study(s)
      p_term(t, PROB) :- term_in_study(s, t) & selected_study(s)
      p_a_given_t(t, i, j, k, PROB) :- (activated(i, j, k, s) & selected_study(s)) // (term_in_study(s, t) & selected_study(s))
      p_any_voxel_given_t(t, PROB) :- (activated(i, j, k, s) & selected_voxel(i, j, k) & selected_study(s)) // (term_in_study(s, t) & selected_study(s))
      lift(t, i, j, k, l) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & (l == pat / pa)
      relative_risk(t, i, j, k, r) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & p_term(t, pt) & (r == pat * (1 - pt) / (pa - pat * pt))
      uniformity(t, i, j, k, u) :- p_a_given_t(t, i, j, k, pat) & p_any_voxel_given_t(t, pbar) & (u == pat / pbar)
      ratios(t, i, j, k, lift, relative_risk, uniformity) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & p_term(t, pt) & p_any_voxel_given_t(t, pbar) & (lift == pat / pa) & (relative_risk == pat * (1 - pt) / (pa - pat * pt)) & (uniformity == pat / pbar)
      study_similarity(q, s, v) :- study(s) & (v == query_similarity(q, s)) & (v > 0)
      cutoff_similarity(q, percentile(v, 95)) :- study_similarity(q, s, v)
      similar_study(q, s) :- study_similarity(q, s, v) & cutoff_similarity(q, c) & (v >= c)
      p_similar(q, PROB) :- similar_study(q, s) & selected_study(s)
      p_a_given_similar(q, i, j, k, PROB) :- (activated(i, j, k, s) & selected_study(s)) // (similar_study(q, s) & selected_study(s))
      p_any_voxel_given_similar(q, PROB) :- (activated(i, j, k, s) & selected_voxel(i, j, k) & selected_study(s)) // (similar_study(q, s) & selected_study(s))
      lift_llm(q, i, j, k, l) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & (l == pat / pa)
      relative_risk_llm(q, i, j, k, r) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & p_similar(q, pt) & (r == pat * (1 - pt) / (pa - pat * pt))
      uniformity_llm(q, i, j, k, u) :- p_a_given_similar(q, i, j, k, pat) & p_any_voxel_given_similar(q, pbar) & (u == pat / pbar)
      ratios_llm(q, i, j, k, lift, relative_risk, uniformity) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & p_similar(q, pt) & p_any_voxel_given_similar(q, pbar) & (lift == pat / pa) & (relative_risk == pat * (1 - pt) / (pa - pat * pt)) & (uniformity == pat / pbar)
      cogat_subclass_of(x, y) :- neurolang:subClassOf(x, y)
      cogat_subclass_of(x, z) :- cogat_subclass_of(x, y), neurolang:subClassOf(y, z)
      cogat_term(x, t) :- rdfs:label(x, l), (t == lcase(l))
      cogat_definition(t, d) :- cogat_term(x, t), skos:definition(x, d)
      cogat_measures(x, c) :- rdfs:subClassOf(x, r), owl:onProperty(r, <http://www.cognitiveatlas.org/ontology/cogat.owl#measures>), owl:someValuesFrom(r, c)
    # Replicates of selected_study, resampling the studies, for confidence
    # intervals on the probabilities and the measures derived from them.
    # Each replicate recomputes a measure: 500 keep the interval of a Bayes
    # factor within the 30 s the query assistant gives a query.
    resamplings:
      boot_studies:
        choice: selected_study
        n: 500
        scheme: bayesian
        seed: 0
    # The Cognitive Atlas ontology, for open-world queries over concepts,
    # tasks and contrasts: see doc/tutorial_cognitive_atlas.rst.  Its
    # triples are facts (``rdfs:label(iri, 'Working memory')``) and its
    # subclass axioms rewrite the queries.
    ontologies:
      - url: https://raw.githubusercontent.com/CognitiveAtlas/cogat-ontology/master/ontology/cogat.v2.owl
        individuals: true
        names: prefixed
    text_embeddings:
      study_abstracts:
        ids_from: study
        # The titles and abstracts of the engine (study_abstract).
        source:
          predicate: study_abstract
          title_predicate: study_title
        model: allenai/specter2_base
        document_adapter: allenai/specter2
        query_adapter: allenai/specter2_adhoc_query
        function: query_similarity
        description: >-
          query_similarity(query, study) returns the cosine similarity
          between a free-text query and the study's title and abstract,
          embedded with SPECTER2.
    #probabilistic_choice:
      # selected_study:
      #  source: study
      #  description: "Uniform probabilistic choice over studies"
    # Symbols withheld from the SQUALL completion: their argument order
    # breaks sentences (``a Study peak_reported …`` binds the study to a
    # voxel index).  They stay usable when typed; ``reports`` and
    # ``labels`` are the forms that read as SQUALL verbs.
    hidden_predicates: [peak_reported, schaefer_voxels]
    # The sorts of the entities the predicates relate, declared once: the
    # columns an entity spans and their type.  A sort of N > 1 columns
    # reads ``in ND`` in SQUALL (``every Voxel in 3D``).
    #
    # ``space`` tells what the columns of a sort of points are, for
    # ``.save out.nii.gz`` in the REPL, which writes a result on a grid:
    # ``space: voxel`` marks the indices (i, j, k) of the grid the sort
    # names with ``grid`` (an atlas of the engine, by its key under
    # ``atlases``), by default that of the engine's template (the MNI
    # mask), written as they are; ``space: mm`` coordinates (x, y, z) in
    # millimetres, converted to the nearest voxel of the template with
    # the inverse of its affine.  A result's columns take the sort of the
    # argument of the predicate their variable comes from in the query,
    # else of the sort they are named as.  ``atlas_voxel`` (mni_atlases)
    # indexes the grid of the Schaefer atlas, resampled to the template's.
    # A sort named ``streamline`` holds streamline ids, which ``.view``
    # draws with an engine giving their points (``streamline_points``).
    sorts:
      study:
        columns: [study_id]
        type: int
        description: "a study of the Neurosynth database"
      term:
        columns: [term]
        type: str
        description: "a term of the TF-IDF vocabulary"
      tfidf:
        columns: [tfidf]
        type: float
        description: "a TF-IDF weight"
      replicate:
        columns: [b]
        type: int
        description: "a replicate of a resampling of the studies"
      weight:
        columns: [w]
        type: float
        description: "the weight of a study in a replicate"
      voxel:
        columns: [i, j, k]
        type: int
        space: voxel
        description: "a voxel of the MNI template grid, in 3D"
      query:
        columns: [query]
        type: str
        description: "a free-text query"
      text:
        columns: [text]
        type: str
        description: "the title or abstract of a study"
      similarity:
        columns: [similarity]
        type: float
        description: "a cosine similarity between text embeddings"
      lift:
        columns: [lift]
        type: float
        description: "a lift P(A_v | T) / P(A_v), 1 under independence"
      relative_risk:
        columns: [relative_risk]
        type: float
        description: "a relative risk P(A_v | T) / P(A_v | not T), 1 under independence"
      uniformity:
        columns: [uniformity]
        type: float
        description: "a uniformity ratio P(A_v | T) / P(A_V | T), 1 under uniformity"
      cogat_term:
        columns: [term]
        type: str
        description: "a Cognitive Atlas label, in lower case"
      cogat_class:
        columns: [iri]
        type: str
        description: "a class of the Cognitive Atlas ontology, by its IRI"
      task:
        columns: [task_id]
        type: str
        description: "a task of the Cognitive Atlas"
      task_name:
        columns: [name]
        type: str
        description: "the name of a task of the Cognitive Atlas"
      task_description:
        columns: [description]
        type: str
        description: "the description of a task of the Cognitive Atlas"
      year:
        columns: [year]
        type: int
        description: "a year of publication"
      journal:
        columns: [journal]
        type: str
        description: "the name of a journal"
    # Each predicate declares its arguments, in column order: the entities
    # it relates, each a sort over the columns it spans, named alone or as
    # ``{sort: …, columns: […]}`` to rename the sort's columns.  A voxel
    # (i, j, k) is one argument, so ``reports`` relates a study and a
    # voxel.  The
    # probability column of a probabilistic symbol (``probability: true``)
    # is not an argument.  ``columns`` and ``arity`` (the number of
    # columns) are derived from the arguments.
    predicates:
      peak_reported:
        description: "Reported activation peaks in voxel coordinates"
        arguments:
          - voxel
          - study
      study_title:
        description: "Title of a study"
        arguments: [study, text]
      study_abstract:
        description: "Abstract of a study"
        arguments: [study, text]
      study_year:
        description: "The year a study was published"
        arguments: [study, year]
      study_journal:
        description: >-
          The journal a study was published in, named as the engine's
          metadata names it: find it with search_values
        arguments: [study, journal]
      study:
        description: "All study identifiers"
        arguments:
          - study
      term_in_study_tfidf:
        description: "Term frequency–inverse document frequency values"
        arguments:
          - study
          - term
          - tfidf
      selected_study:
        description: "Uniform probabilistic choice over studies"
        probability: true
        arguments:
          - study
      boot_studies:
        description: >
          Bayesian-bootstrap replicates b of the studies, for
          confidence intervals: RESAMPLE[boot_studies](pred(x)) = b is
          pred(x), any rule over PROB of selected_study, on replicate b
        arguments: [replicate, study, weight]
      voxel:
        description: "Every voxel index (i, j, k) of the MNI template grid"
        arguments:
          - voxel
      brain_mask:
        description: >-
          The voxels (i, j, k) of the MNI template grid inside the MNI152
          brain mask: the whole brain, subcortical structures and cerebellum
          included
        arguments:
          - voxel
      cortical_mask:
        description: >-
          The voxels (i, j, k) of the MNI template grid in the cortex
          (Harvard–Oxford cortical atlas, maximum probability, 25%
          threshold)
        arguments:
          - voxel
      cognitive_task:
        description: >-
          The tasks of the Cognitive Atlas (cognitiveatlas.org), with their
          names and descriptions
        arguments:
          - task
          - task_name
          - task_description
      term:
        description: "Every term of the TF-IDF vocabulary"
        arguments:
          - term
      study_with_peaks:
        description: "Studies reporting at least one activation peak"
        arguments:
          - study
      mentions:
        description: "Studies mentioning a term (TF-IDF above 0.03)"
        arguments:
          - study
          - term
      reports:
        description: "Studies reporting an activation peak at a voxel"
        arguments:
          - study
          - voxel
      weighted_mention:
        description: >-
          Every TF-IDF weight of a term in a study, as term_in_study_tfidf;
          reads in SQUALL as
          every Weighted_mention (?s; ?t; ?w) such that ?w is greater than 0.1
        arguments:
          - study
          - term
          - tfidf
      term_in_study:
        description: "Studies with a term, its TF-IDF being above 0.001"
        arguments:
          - study
          - term
      activated:
        description: >-
          Studies activating a voxel of the brain mask: one of their peaks is
          within {kernel_radius_mm} mm of it
        arguments:
          - voxel
          - study
      lift:
        description: >-
          Lift P(A_v | T) / P(A_v) of the activation of a voxel by the studies
          of a term: 1 under independence (association test)
        arguments:
          - term
          - voxel
          - lift
      relative_risk:
        description: >-
          Relative risk P(A_v | T) / P(A_v | not T) of the activation of a
          voxel by the studies of a term: 1 under independence
        arguments:
          - term
          - voxel
          - relative_risk
      uniformity:
        description: >-
          Uniformity ratio P(A_v | T) / P(A_V | T): the proportion of the
          studies of a term activating a voxel, over its average across the
          brain; 1 under uniformity (uniformity test)
        arguments:
          - term
          - voxel
          - uniformity
      ratios:
        description: "The lift, relative risk and uniformity ratio of a term at a voxel"
        arguments:
          - term
          - voxel
          - lift
          - relative_risk
          - uniformity
      selected_voxel:
        description: "Uniform probabilistic choice over the voxels of the brain mask"
        probability: true
        arguments:
          - voxel
      study_similarity:
        description: >-
          Cosine similarity of the title and abstract of a study to a
          free-text query (the studies with a text), embedded with SPECTER2;
          the first query embeds the abstracts, which takes a while and
          needs ``pip install "neurolang[embeddings]"``
        arguments:
          - query
          - study
          - similarity
      similar_study:
        description: >-
          The 5% of the studies closest to a free-text query by
          study_similarity
        arguments:
          - query
          - study
      lift_llm:
        description: "lift of a free-text query: the studies of similar_study are the studies of the term"
        arguments:
          - query
          - voxel
          - lift
      relative_risk_llm:
        description: "relative_risk of a free-text query (see lift_llm)"
        arguments:
          - query
          - voxel
          - relative_risk
      uniformity_llm:
        description: >-
          uniformity of a free-text query: the uniformity ratio of the 5% of
          the studies closest to the text (similar_study), as for the studies
          of a term
        arguments:
          - query
          - voxel
          - uniformity
      ratios_llm:
        description: "The lift, relative risk and uniformity ratio of a free-text query"
        arguments:
          - query
          - voxel
          - lift
          - relative_risk
          - uniformity
      cogat_subclass_of:
        description: >-
          Cognitive Atlas classes below others, at any depth (concepts,
          tasks, contrasts), by IRI
        arguments:
          - cogat_class
          - cogat_class
      cogat_term:
        description: >-
          Label of a Cognitive Atlas class in lower case, as the terms of
          mentions and term_in_study_tfidf
        arguments:
          - cogat_class
          - cogat_term
      cogat_definition:
        description: >-
          Definition of a Cognitive Atlas concept, by its lower-case label: a
          free-text query for similar_study, uniformity_llm and the other
          free-text predicates
        arguments:
          - cogat_term
          - query
      cogat_measures:
        description: >-
          Cognitive Atlas contrasts (and tasks) measuring a concept, by IRI
        arguments:
          - cogat_class
          - cogat_class
      schaefer_activated:
        description: >-
          Studies activating a Schaefer parcel (cortical networks): one of
          their peaks is within {kernel_radius_mm} mm of a voxel of the parcel
        arguments:
          - label
          - study
      destrieux_activated:
        description: >-
          Studies activating a Destrieux region: one of their peaks is within
          {kernel_radius_mm} mm of a voxel of the region
        arguments:
          - destrieux_label
          - study
      tian_activated:
        description: >-
          Studies activating a Tian subcortical region: one of their peaks is
          within {kernel_radius_mm} mm of a voxel of the region
        arguments:
          - tian_label
          - study
      schaefer_covered:
        description: >-
          How much a study covers a Schaefer parcel, as a probability: the
          mean over the parcel's voxels of the study's activation, a
          Gaussian kernel of 10 mm FWHM around its nearest peak
        probability: true
        arguments:
          - label
          - study
      destrieux_covered:
        description: >-
          How much a study covers a Destrieux region, as a probability (see
          schaefer_covered)
        probability: true
        arguments:
          - destrieux_label
          - study
      tian_covered:
        description: >-
          How much a study covers a Tian subcortical region, as a probability
          (see schaefer_covered)
        probability: true
        arguments:
          - tian_label
          - study
      peak_mni:
        description: >-
          Reported activation peaks in MNI coordinates, in millimetres
        arguments:
          - mni
          - study

  neurosynth:
    extends: coordinate_meta_analysis
    description: >
      Neurosynth database — forward and reverse inference over
      reported activation peaks, TF-IDF term frequencies, and a
      probabilistic choice over studies.
    python_init: "neurolang_apps.utils.engines.neurosynth.init"

  neurostore:
    extends: coordinate_meta_analysis
    description: >
      NeuroStore database (the one NiMARE fetches with
      ``fetch_neurostore``, behind Neurosynth Compose) — the predicates of
      neurosynth, with TF-IDF term frequencies computed from the study
      abstracts, plus the abstracts, titles and LLM-extracted cognitive
      concepts and domains of the studies.
    python_init: "neurolang_apps.utils.engines.neurostore.init"
    # Twice as many studies as neurosynth: 200 replicates keep a query
    # within the time and memory the query assistant gives it.
    resamplings:
      boot_studies: {n: 200}
    sorts:
      study:
        type: str
        description: "a study of the NeuroStore database"
      concept:
        columns: [concept]
        type: str
        description: "a cognitive concept extracted from the tasks of a study"
      domain:
        columns: [domain]
        type: str
        description: "a cognitive domain extracted from the tasks of a study"
    predicates:
      study_concept:
        description: "Cognitive concepts extracted from the tasks of a study"
        arguments: [study, concept]
      study_domain:
        description: "Cognitive domains extracted from the tasks of a study"
        arguments: [study, domain]
      term_in_study_tfidf:
        description: >-
          TF-IDF of the terms of the abstracts, computed from them
          (NeuroStore ships no term table)

  destrieux:
    description: >
      Destrieux 2009 cortical atlas — region definitions for the
      Destrieux cortical parcellation, each mapped to a volumetric
      brain region (ExplicitVBR).
    requires_mni_mask: true
    use_base_symbols: true
    builtins: [exp, log, startswith]
    atlases:
      destrieux:
        predicate_name: destrieux
        description: "Cortical region name and ExplicitVBR geometry"
    datalog_init: |
      left_region(N, R) :- destrieux(N, R), startswith('lh', N)
      right_region(N, R) :- destrieux(N, R), startswith('rh', N)
    sorts:
      label:
        columns: [name]
        type: str
        atlas: destrieux
        description: "a Destrieux region name"
      region:
        columns: [region]
        type: ExplicitVBR
        description: "a brain region"
    predicates:
      destrieux:
        description: "Cortical region name and ExplicitVBR geometry"
        arguments:
          - label
          - region
      left_region:
        description: "Left-hemisphere Destrieux regions"
        arguments:
          - label
          - region
      right_region:
        description: "Right-hemisphere Destrieux regions"
        arguments:
          - label
          - region

  tracts:
    extends: mni_atlases
    description: >
      Tractography (neurolang_apps.utils.engines.tracts):
      the commands .load_tractogram and .index_tracts of a program build
      the relations of a tractogram, in MNI152, indexed by the atlases of
      the engine (.index_tracts(t, "destrieux"), "tian" or "schaefer") or
      by one the program loads (.load_atlas), and the vocabulary of
      tractography, rules over them, says where streamlines go:
      traverses(x, term, h), endpoint_in(x, e, term, h), anterior_of(x,
      term, h)... A label of an atlas of the engine, label("destrieux", l,
      name, h), is the name of its relation, destrieux(name, region). A
      result of streamline ids x is drawn by .view.
      The white-matter bundles, tract_querier's queries translated to the
      vocabulary and each described, are defined by importing a module of
      the engine: .import('bundles/freesurfer_queries.dl')
      defines uf(x, h) (the uncinate fasciculus), af, cst, ilf, ioff, cb,
      slf_i, cc, cc_1 ... cc_7 and more; freesurfer_queries_bsf2016.dl and
      freesurfer_queries_bsf2016_toad.dl revise them (uf, af, ilf, dlf,
      emc, cortico_spinal...); mori_queries.dl gives those of the JHU
      atlas (unc, ifo, cg, corpus_callosum...). The modules share names:
      import one.
    solver_mixins:
      - "neurolang_apps.utils.engines.tracts.frontend:TractsCommandsMixin"
    # the vocabulary (vocabulary.dl of the package), the functions
    # of the ids x and the hooks of .view, over what the commands load;
    # .index_tracts finds the atlases of the engine, loaded after it
    python_init: "neurolang_apps.utils.engines.tracts.frontend"
    # The sorts of the arguments of the vocabulary and of the bundles, as
    # their %% documentation gives them (uncinate(x: streamline, h:
    # hemisphere)); the query assistant is told their descriptions.
    # ``streamline`` is the sort .view draws as streamlines.
    sorts:
      streamline:
        columns: [x]
        type: int
        description: >-
          a streamline, by its integer id; streamline(x, t, s) gives the
          tractogram t it is of and its position s in the file
      end:
        columns: [e]
        type: int
        description: >-
          an end of a streamline, 0 or 1: it only tells the two ends apart
          (the same end), the order of the points being arbitrary
      term:
        columns: [term]
        type: str
        description: >-
          a term of the term mapping of the atlas indexed, a string such as
          "temporal", "insula" or "amygdala": label_term(a, l, term) lists
          them, from the mappings of the engine (its mappings/*.tsv)
          (freesurfer_aseg_aparc for a FreeSurfer atlas)
      hemisphere:
        columns: [h]
        type: str
        description: >-
          a hemisphere: "left", "right" or "none" (a structure of no side,
          such as the brain stem); opposite_hemisphere(h, o) gives the other
      axis:
        columns: [axis]
        type: int
        description: >-
          an axis of RAS+ millimetres: 0 x (left to right), 1 y (posterior to
          anterior), 2 z (inferior to superior)
      atlas:
        columns: [a]
        type: str
        description: "an atlas indexed with .index_tracts, by its name"
      label_id:
        columns: [l]
        type: int
        description: "the id of a label of an atlas indexed"
      coordinate:
        columns: [v]
        type: float
        description: "a coordinate in millimetres, RAS+, on an axis"

  neurosynth_tracts:
    extends: [neurosynth, tracts]
    description: >
      Neurosynth with tractography: the studies, terms, peaks and Cognitive
      Atlas of neurosynth, the studies that activate each parcel of its
      atlases (schaefer_activated(label, study)...), and the commands and
      vocabulary of tractography of tracts (extra tracts of
      neurolang-apps), whose streamlines end near the points of a parcel
      (endpoint_point, schaefer_points). similar_study, the studies about
      a text, needs the extra embeddings (SPECTER2). The uncinate
      fasciculus and the concepts of the studies that activate its parcels
      are examples/uncinate_cogat.dl of the engine tracts.

  neurosynth_iit:
    extends: neurosynth_tracts
    description: >
      Neurosynth with a whole-brain tractogram and tract_querier's bundles:
      neurosynth_tracts after the commands that load the whole-brain
      tractogram of the IIT Human Brain Atlas v3 (IIT3mean.tck, 38,000
      streamlines, RAS+ mm, 88 MB, downloaded into the data directory's
      tracts/iit), load the atlas's Desikan-Killiany wmparc (downloaded, with
      FreeSurfer's colour LUT, into tracts/fs; its labels are the codes of
      FreeSurfer's, so the term mapping freesurfer_aseg_aparc applies; the
      tractogram and the atlas are of the same atlas, so in the same space),
      index the tractogram by it and import the bundles of tract_querier's
      freesurfer_queries.qry, so that ans(x) :- uf(x, "left") and .view work
      at the prompt. The files are read relative to the data directory,
      from which datalog_init runs. The entry tractogram tells the bundle of
      the REPL in the browser how to subsample the file it ships in its
      place, so that this program is the same there.
    # The IIT Human Brain Atlas v3 (Qi, Arfanakis et al., IIT Human Brain
    # Template License: non-commercial research, attribution): its
    # whole-brain tractogram and its Desikan-Killiany wmparc, from the OSF
    # project of tract_querier's test files (https://osf.io/ugyqa/), and
    # FreeSurfer's colour LUT, at a commit.
    downloads:
      - url: https://osf.io/download/6af216907216d01bbe53b9f5/
        name: IIT3mean.tck
        md5: 6e9703e4e331cfb26f3eb2e29526e225
        dest: tracts/iit
      - url: https://osf.io/download/rk7a5/
        name: IIT3mean_desikan_2009.nii.gz
        md5: 767813ba451d5209cdc9454617a636b7
        dest: tracts/fs
      - url: https://raw.githubusercontent.com/freesurfer/freesurfer/18761d34d14d62216ec1ca3b0056fb9b04ea2f59/distribution/FreeSurferColorLUT.txt
        md5: ce7f38b53a507ac1990e0795353417d7
        dest: tracts/fs
    # The tractogram of the bundle of the REPL: the file path is replaced in
    # the bundle's data directory by subsample of its streamlines drawn at
    # random (seed), each thinned to every step-th point
    # (doc/make_repl_bundle.py)
    tractogram: {path: tracts/iit/IIT3mean.tck, subsample: 15000, step: 3, seed: 0}
    datalog_init: |
      .load_tractogram("iit", "tracts/iit/IIT3mean.tck", space="MNI152")
      .load_atlas("fs", "tracts/fs/IIT3mean_desikan_2009.nii.gz", "tracts/fs/FreeSurferColorLUT.txt", kind="freesurfer", space="MNI152")
      .index_tracts("iit", "fs")
      .import("bundles/freesurfer_queries.dl")

