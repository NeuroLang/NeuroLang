engines:
  # Abstract engines only hold configuration shared by other engines;
  # concrete engines pull it in with ``extends`` (a name or a list of
  # names).  Mappings are merged key by key, ``datalog_init`` rules and
  # the ``builtins`` / ``downloads`` / ``ontologies`` lists are
  # concatenated, parent first, and any other value is overridden by the
  # extending engine.  Set a mapping entry to ``null`` to drop it.
  coordinate_meta_analysis:
    abstract: true
    description: >
      Shared setup of the coordinate-based meta-analysis engines
      (neurosynth, neurostore): reported activation peaks, TF-IDF term
      frequencies, and a probabilistic choice over studies.  Voxels
      (i, j, k) index the 1 mm MNI152 grid (at the default resolution):
      the MNI point (x, y, z) in mm is the voxel (x + 98, y + 134,
      z + 72), and distances between voxels are in mm.
    requires_mni_mask: true
    use_base_symbols: true
    builtins: [exp, log, startswith, lcase]
    # Each atlas with ``activated`` also registers which studies activate
    # its regions: ``{atlas}_activated(label, study)`` when a peak of the
    # study (``peak_mni``, in millimetres) is within ``radius_mm`` of a
    # voxel of the region.  Destrieux is the classical (gyral and sulcal)
    # anatomy of the cortex; Schaefer (cortical networks) and Tian
    # (subcortex) the functional anatomy.
    atlases:
      schaefer:
        predicate_name: schaefer
        n_rois: 100
        resolution_mm: 2
        yeo_networks: 17
        activated: {predicate_name: schaefer_activated, radius_mm: 3}
      destrieux:
        predicate_name: destrieux
        activated: {predicate_name: destrieux_activated, radius_mm: 3}
      tian:
        predicate_name: tian
        scale: 2
        activated: {predicate_name: tian_activated, radius_mm: 3}
    # How the LLM assistant (.ask, neurolang-query --ask) is to answer the
    # questions on these engines: added to its system prompt.
    assistant_guidance: >
      A question asking how many (combien) gets a count, not a
      probability: AGGREGATE[](mentions(s, 'pain') @ count(s)) = n over
      the stored relations, AGGREGATE[x] for each x, or over the rows of
      a PROB rule when it counts those with a given probability.  Answer
      every other question with probabilistic query answering over
      selected_study, the uniform choice of a study: give the probability
      of what the question asks, PROB[...] = p, over rules of yours
      joining selected_study(s), as active(l, s) :-
      destrieux_activated(l, s), selected_study(s), never over stored
      relations directly; and for a question about
      a term and the brain the conditional probability given the term,
      PROB[activation // term] = p, or a ratio of probabilities (lift,
      Bayes factor) when it asks for an association; a question asking
      for a list (which studies, which regions) gets the probability of
      each.  A study activates a point when one of its peaks is within
      3 mm of it: peak_mni(x, y, z, s), (euclidean(x, y, z, x0, y0, z0)
      <= 3), with the coordinates of the question as MNI millimetres,
      written as they are.  For the classical anatomy of the cortex
      (gyri, sulci, lobes) use the Destrieux atlas, destrieux_activated;
      for the functional anatomy, the Schaefer networks of the cortex,
      schaefer_activated, and the Tian atlas of the subcortex,
      tian_activated, which also holds the subcortical structures of
      classical anatomy (hippocampus, amygdala, thalamus, nucleus
      accumbens, globus pallidus, putamen, caudate).  Find region names
      with search_values: Destrieux names start with the hemisphere (L,
      R) and use G for gyrus and S for sulcus (L G temporal middle),
      Schaefer names the network and hemisphere (17Networks LH DefaultA
      PFCm 1), with the networks abbreviated: VisCent and VisPeri (visual),
      SomMot (somatomotor), DorsAttn (dorsal attention), SalVentAttn
      (salience, ventral attention), Limbic, Cont (frontoparietal
      control), Default (default mode), TempPar (temporoparietal); match
      them with startswith('17Networks LH DorsAttn', l) on schaefer(l, r).
      Tian names abbreviate the structure and end with the hemisphere
      (lAMY rh, aHIP lh, NAc core rh): HIP hippocampus, AMY amygdala, THA
      thalamus, NAc nucleus accumbens, GP globus pallidus, PUT putamen,
      CAU caudate.
      Tian names end with the hemisphere (lAMY rh, aHIP lh).
      Co-activation is the activation of regions or points by the same
      study: for a network of pairs, co_active(l1, l2, s) :- active(l1,
      s), active(l2, s) with (l1 < l2) in the answer, conditioned on the
      term if the question names one; for the regions or points
      co-activated with a seed, PROB[active(l, s) // seed(s)] = p; for
      "more than chance", the lift of the pair, P(both) / (P(l1) P(l2)).
      A question about a topic given as a description, or about a
      Cognitive Atlas concept, uses the similarity of the study texts to
      it: similar_study(q, s), the studies closest to the text q, with
      their titles from study_title; p_a_given_similar, lift_llm and
      uniformity_llm for the brain.  A Cognitive Atlas definition reaches
      them from the queried rule itself, cogat_definition('working
      memory', d) joined with similar_study(d, s) or uniformity_llm(d, i,
      j, k, u), or with a rule of yours taking the text as its first
      argument, close(q, s) :- similar_study(q, s), selected_study(s);
      inside another rule the text is not known and the query fails.
      Rank by similarity rather than with a fixed threshold.
      A question asking how certain or significant an answer is (a
      confidence interval, an error bar, whether one probability is
      larger than another) resamples the studies: write the measure as a
      rule of its own over PROB, measure(t, v), then rep(b, t, v) :-
      RESAMPLE[boot_studies](measure(t, v)) = b, its value on each
      replicate b, and answer with the measure and percentile(x, 2.5),
      percentile(x, 97.5) over rep(b, 'fear', x); to compare two
      measures join their replicates on the same b.  Ask it for one
      region or term at a time, never for voxels or every term: each
      replicate recomputes the measure.
    datalog_init: |
      study_with_peaks(s) :- peak_reported(i, j, k, s).
      schaefer_voxels(i, j, k, l) :- schaefer(l, r), contains(r, (i, j, k)).
      schaefer_label(l) :- schaefer(l, r)
      labels(l, i, j, k) :- schaefer_voxels(i, j, k, l)
      mentions(s, t) :- term_in_study_tfidf(s, t, v), (v > 0.03)
      reports(s, i, j, k) :- peak_reported(i, j, k, s)
      weighted_mention(s, t, w) :- term_in_study_tfidf(s, t, w)
      term_in_study(s, t) :- term_in_study_tfidf(s, t, w) & (w > 0.001)
      activated(i, j, k, s) :- brain_mask(i, j, k) & peak_reported(i1, j1, k1, s) & (EUCLIDEAN(i, j, k, i1, j1, k1) <= 3)
      p_a(i, j, k, PROB) :- activated(i, j, k, s) & selected_study(s)
      p_term(t, PROB) :- term_in_study(s, t) & selected_study(s)
      p_a_given_t(t, i, j, k, PROB) :- (activated(i, j, k, s) & selected_study(s)) // (term_in_study(s, t) & selected_study(s))
      p_any_voxel_given_t(t, PROB) :- (activated(i, j, k, s) & selected_voxel(i, j, k) & selected_study(s)) // (term_in_study(s, t) & selected_study(s))
      lift(t, i, j, k, l) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & (l == pat / pa)
      relative_risk(t, i, j, k, r) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & p_term(t, pt) & (r == pat * (1 - pt) / (pa - pat * pt))
      uniformity(t, i, j, k, u) :- p_a_given_t(t, i, j, k, pat) & p_any_voxel_given_t(t, pbar) & (u == pat / pbar)
      ratios(t, i, j, k, lift, relative_risk, uniformity) :- p_a_given_t(t, i, j, k, pat) & p_a(i, j, k, pa) & p_term(t, pt) & p_any_voxel_given_t(t, pbar) & (lift == pat / pa) & (relative_risk == pat * (1 - pt) / (pa - pat * pt)) & (uniformity == pat / pbar)
      study_similarity(q, s, v) :- study(s) & (v == query_similarity(q, s)) & (v > 0)
      cutoff_similarity(q, percentile(v, 95)) :- study_similarity(q, s, v)
      similar_study(q, s) :- study_similarity(q, s, v) & cutoff_similarity(q, c) & (v >= c)
      p_similar(q, PROB) :- similar_study(q, s) & selected_study(s)
      p_a_given_similar(q, i, j, k, PROB) :- (activated(i, j, k, s) & selected_study(s)) // (similar_study(q, s) & selected_study(s))
      p_any_voxel_given_similar(q, PROB) :- (activated(i, j, k, s) & selected_voxel(i, j, k) & selected_study(s)) // (similar_study(q, s) & selected_study(s))
      lift_llm(q, i, j, k, l) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & (l == pat / pa)
      relative_risk_llm(q, i, j, k, r) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & p_similar(q, pt) & (r == pat * (1 - pt) / (pa - pat * pt))
      uniformity_llm(q, i, j, k, u) :- p_a_given_similar(q, i, j, k, pat) & p_any_voxel_given_similar(q, pbar) & (u == pat / pbar)
      ratios_llm(q, i, j, k, lift, relative_risk, uniformity) :- p_a_given_similar(q, i, j, k, pat) & p_a(i, j, k, pa) & p_similar(q, pt) & p_any_voxel_given_similar(q, pbar) & (lift == pat / pa) & (relative_risk == pat * (1 - pt) / (pa - pat * pt)) & (uniformity == pat / pbar)
      cogat_subclass_of(x, y) :- neurolang:subClassOf(x, y)
      cogat_subclass_of(x, z) :- cogat_subclass_of(x, y), neurolang:subClassOf(y, z)
      cogat_term(x, t) :- rdfs:label(x, l), (t == lcase(l))
      cogat_definition(t, d) :- cogat_term(x, t), skos:definition(x, d)
      cogat_measures(x, c) :- rdfs:subClassOf(x, r), owl:onProperty(r, <http://www.cognitiveatlas.org/ontology/cogat.owl#measures>), owl:someValuesFrom(r, c)
    # Replicates of selected_study, resampling the studies, for confidence
    # intervals on the probabilities and the measures derived from them.
    resamplings:
      boot_studies:
        choice: selected_study
        n: 500
        scheme: bayesian
        seed: 0
    # The Cognitive Atlas ontology, for open-world queries over concepts,
    # tasks and contrasts: see doc/tutorial_cognitive_atlas.rst.  Its
    # triples are facts (``rdfs:label(iri, 'Working memory')``) and its
    # subclass axioms rewrite the queries.
    ontologies:
      - url: https://raw.githubusercontent.com/CognitiveAtlas/cogat-ontology/master/ontology/cogat.v2.owl
        individuals: true
        names: prefixed
    text_embeddings:
      study_abstracts:
        ids_from: study
        source: pubmed
        model: allenai/specter2_base
        document_adapter: allenai/specter2
        query_adapter: allenai/specter2_adhoc_query
        function: query_similarity
        description: >-
          query_similarity(query, study) returns the cosine similarity
          between a free-text query and the study's title and abstract
          (PubMed), embedded with SPECTER2.
    #probabilistic_choice:
      # selected_study:
      #  source: study
      #  description: "Uniform probabilistic choice over studies"
    # Symbols withheld from the SQUALL completion: their argument order
    # breaks sentences (``a Study peak_reported …`` binds the study to a
    # voxel index).  They stay usable when typed; ``reports`` and
    # ``labels`` are the forms that read as SQUALL verbs.
    hidden_predicates: [peak_reported, schaefer_voxels]
    # The sorts of the entities the predicates relate, declared once: the
    # columns an entity spans and their type.  A sort of N > 1 columns
    # reads ``in ND`` in SQUALL (``every Voxel in 3D``).
    #
    # ``space`` tells what the columns of a sort of points are, for
    # ``.save out.nii.gz`` in the REPL, which writes a result on a grid:
    # ``space: voxel`` marks the indices (i, j, k) of the grid the sort
    # names with ``grid`` (an atlas of the engine, by its key under
    # ``atlases``), by default that of the engine's template (the MNI
    # mask), written as they are; ``space: mm`` coordinates (x, y, z) in
    # millimetres, converted to the nearest voxel of the template with
    # the inverse of its affine.  A result's columns take the sort of the
    # argument of the predicate their variable comes from in the query,
    # else of the sort they are named as.  ``atlas_voxel`` indexes the
    # grid of the 2 mm Schaefer atlas, not the template's.
    sorts:
      study:
        columns: [study_id]
        type: int
        description: "a study of the Neurosynth database"
      term:
        columns: [term]
        type: str
        description: "a term of the TF-IDF vocabulary"
      tfidf:
        columns: [tfidf]
        type: float
        description: "a TF-IDF weight"
      replicate:
        columns: [b]
        type: int
        description: "a replicate of a resampling of the studies"
      weight:
        columns: [w]
        type: float
        description: "the weight of a study in a replicate"
      voxel:
        columns: [i, j, k]
        type: int
        space: voxel
        description: "a voxel of the MNI template grid, in 3D"
      mni:
        columns: [x, y, z]
        type: float
        space: mm
        description: "a point in MNI space, in millimetres, in 3D"
      atlas_voxel:
        columns: [i, j, k]
        type: int
        space: voxel
        grid: schaefer
        description: "a voxel of the 2 mm Schaefer atlas grid, in 3D"
      label:
        columns: [label]
        type: str
        atlas: schaefer
        description: "a Schaefer 2018 parcel label"
      destrieux_label:
        columns: [label]
        type: str
        atlas: destrieux
        description: "a region of the Destrieux 2009 cortical atlas"
      tian_label:
        columns: [label]
        type: str
        atlas: tian
        description: "a region of the Tian 2020 subcortical atlas"
      region:
        columns: [region]
        type: ExplicitVBR
        description: "a brain region"
      query:
        columns: [query]
        type: str
        description: "a free-text query"
      text:
        columns: [text]
        type: str
        description: "the title or abstract of a study"
      similarity:
        columns: [similarity]
        type: float
        description: "a cosine similarity between text embeddings"
      lift:
        columns: [lift]
        type: float
        description: "a lift P(A_v | T) / P(A_v), 1 under independence"
      relative_risk:
        columns: [relative_risk]
        type: float
        description: "a relative risk P(A_v | T) / P(A_v | not T), 1 under independence"
      uniformity:
        columns: [uniformity]
        type: float
        description: "a uniformity ratio P(A_v | T) / P(A_V | T), 1 under uniformity"
      cogat_term:
        columns: [term]
        type: str
        description: "a Cognitive Atlas label, in lower case"
      cogat_class:
        columns: [iri]
        type: str
        description: "a class of the Cognitive Atlas ontology, by its IRI"
      task:
        columns: [task_id]
        type: str
        description: "a task of the Cognitive Atlas"
      task_name:
        columns: [name]
        type: str
        description: "the name of a task of the Cognitive Atlas"
      task_description:
        columns: [description]
        type: str
        description: "the description of a task of the Cognitive Atlas"
    # Each predicate declares its arguments, in column order: the entities
    # it relates, each a sort over the columns it spans, named alone or as
    # ``{sort: …, columns: […]}`` to rename the sort's columns.  A voxel
    # (i, j, k) is one argument, so ``reports`` relates a study and a
    # voxel.  The
    # probability column of a probabilistic symbol (``probability: true``)
    # is not an argument.  ``columns`` and ``arity`` (the number of
    # columns) are derived from the arguments.
    predicates:
      peak_reported:
        description: "Reported activation peaks in voxel coordinates"
        arguments:
          - voxel
          - study
      study_title:
        description: "Title of a study"
        arguments: [study, text]
      study:
        description: "All study identifiers"
        arguments:
          - study
      term_in_study_tfidf:
        description: "Term frequency–inverse document frequency values"
        arguments:
          - study
          - term
          - tfidf
      selected_study:
        description: "Uniform probabilistic choice over studies"
        probability: true
        arguments:
          - study
      boot_studies:
        description: >
          500 Bayesian-bootstrap replicates b of the studies, for
          confidence intervals: RESAMPLE[boot_studies](pred(x)) = b is
          pred(x), any rule over PROB of selected_study, on replicate b
        arguments: [replicate, study, weight]
      voxel:
        description: "Every voxel index (i, j, k) of the MNI template grid"
        arguments:
          - voxel
      brain_mask:
        description: >-
          The voxels (i, j, k) of the MNI template grid inside the MNI152
          brain mask: the whole brain, subcortical structures and cerebellum
          included
        arguments:
          - voxel
      cortical_mask:
        description: >-
          The voxels (i, j, k) of the MNI template grid in the cortex
          (Harvard–Oxford cortical atlas, maximum probability, 25%
          threshold)
        arguments:
          - voxel
      cognitive_task:
        description: >-
          The tasks of the Cognitive Atlas (cognitiveatlas.org), with their
          names and descriptions
        arguments:
          - task
          - task_name
          - task_description
      term:
        description: "Every term of the TF-IDF vocabulary"
        arguments:
          - term
      study_with_peaks:
        description: "Studies reporting at least one activation peak"
        arguments:
          - study
      mentions:
        description: "Studies mentioning a term (TF-IDF above 0.03)"
        arguments:
          - study
          - term
      reports:
        description: "Studies reporting an activation peak at a voxel"
        arguments:
          - study
          - voxel
      weighted_mention:
        description: >-
          Every TF-IDF weight of a term in a study, as term_in_study_tfidf;
          reads in SQUALL as
          every Weighted_mention (?s; ?t; ?w) such that ?w is greater than 0.1
        arguments:
          - study
          - term
          - tfidf
      term_in_study:
        description: "Studies with a term, its TF-IDF being above 0.001"
        arguments:
          - study
          - term
      activated:
        description: >-
          Studies activating a voxel of the brain mask: one of their peaks is
          within 3 voxels (3 mm at the default 1 mm resolution)
        arguments:
          - voxel
          - study
      lift:
        description: >-
          Lift P(A_v | T) / P(A_v) of the activation of a voxel by the studies
          of a term: 1 under independence (association test)
        arguments:
          - term
          - voxel
          - lift
      relative_risk:
        description: >-
          Relative risk P(A_v | T) / P(A_v | not T) of the activation of a
          voxel by the studies of a term: 1 under independence
        arguments:
          - term
          - voxel
          - relative_risk
      uniformity:
        description: >-
          Uniformity ratio P(A_v | T) / P(A_V | T): the proportion of the
          studies of a term activating a voxel, over its average across the
          brain; 1 under uniformity (uniformity test)
        arguments:
          - term
          - voxel
          - uniformity
      ratios:
        description: "The lift, relative risk and uniformity ratio of a term at a voxel"
        arguments:
          - term
          - voxel
          - lift
          - relative_risk
          - uniformity
      selected_voxel:
        description: "Uniform probabilistic choice over the voxels of the brain mask"
        probability: true
        arguments:
          - voxel
      study_similarity:
        description: >-
          Cosine similarity of the title and abstract of a study to a
          free-text query (the studies with a text), embedded with SPECTER2;
          the first query embeds the abstracts, which takes a while and
          needs ``pip install "neurolang[embeddings]"``
        arguments:
          - query
          - study
          - similarity
      similar_study:
        description: >-
          The 5% of the studies closest to a free-text query by
          study_similarity
        arguments:
          - query
          - study
      lift_llm:
        description: "lift of a free-text query: the studies of similar_study are the studies of the term"
        arguments:
          - query
          - voxel
          - lift
      relative_risk_llm:
        description: "relative_risk of a free-text query (see lift_llm)"
        arguments:
          - query
          - voxel
          - relative_risk
      uniformity_llm:
        description: >-
          uniformity of a free-text query: the uniformity ratio of the 5% of
          the studies closest to the text (similar_study), as for the studies
          of a term
        arguments:
          - query
          - voxel
          - uniformity
      ratios_llm:
        description: "The lift, relative risk and uniformity ratio of a free-text query"
        arguments:
          - query
          - voxel
          - lift
          - relative_risk
          - uniformity
      cogat_subclass_of:
        description: >-
          Cognitive Atlas classes below others, at any depth (concepts,
          tasks, contrasts), by IRI
        arguments:
          - cogat_class
          - cogat_class
      cogat_term:
        description: >-
          Label of a Cognitive Atlas class in lower case, as the terms of
          mentions and term_in_study_tfidf
        arguments:
          - cogat_class
          - cogat_term
      cogat_definition:
        description: >-
          Definition of a Cognitive Atlas concept, by its lower-case label: a
          free-text query for similar_study, uniformity_llm and the other
          free-text predicates
        arguments:
          - cogat_term
          - query
      cogat_measures:
        description: >-
          Cognitive Atlas contrasts (and tasks) measuring a concept, by IRI
        arguments:
          - cogat_class
          - cogat_class
      schaefer:
        description: "Schaefer 2018 parcel label and its region"
        arguments:
          - label
          - region
      schaefer_label:
        description: "Every Schaefer 2018 parcel label"
        arguments:
          - label
      schaefer_activated:
        description: >-
          Studies activating a Schaefer parcel (cortical networks): one of
          their peaks is within 3 mm of a voxel of the parcel
        arguments:
          - label
          - study
      destrieux:
        description: >-
          Destrieux 2009 cortical atlas (gyri and sulci): region name and
          region; names start with the hemisphere, L or R
        arguments:
          - destrieux_label
          - region
      destrieux_activated:
        description: >-
          Studies activating a Destrieux region: one of their peaks is within
          3 mm of a voxel of the region
        arguments:
          - destrieux_label
          - study
      tian:
        description: >-
          Tian 2020 subcortical atlas, scale 2 (32 regions): region name and
          region; names end with the hemisphere, lh or rh
        arguments:
          - tian_label
          - region
      tian_activated:
        description: >-
          Studies activating a Tian subcortical region: one of their peaks is
          within 3 mm of a voxel of the region
        arguments:
          - tian_label
          - study
      peak_mni:
        description: >-
          Reported activation peaks in MNI coordinates, in millimetres
        arguments:
          - mni
          - study
      schaefer_voxels:
        description: >-
          Voxels (i, j, k) of the 2 mm Schaefer atlas grid in each parcel
        arguments:
          - atlas_voxel
          - label
      labels:
        description: >-
          Schaefer parcel labelling each voxel (i, j, k) of the 2 mm atlas
          grid (not the grid of voxel and reports)
        arguments:
          - label
          - atlas_voxel
    examples:
      datalog:
        - "ans(s) :- mentions(s, 'pain')"
        - "ans(s, w) :- weighted_mention(s, 'pain', w), (w > 0.1)"
        - "ans(i, j, k, u) :- uniformity('pain', i, j, k, u)"
        - "ans(i, j, k, u) :- uniformity_llm('cortical response to noxious heat applied to the skin', i, j, k, u)"
        - "ans(l) :- rdfs:label(c, 'Working memory'), cogat_subclass_of(x, c), rdfs:label(x, l)"
        - "ans(s) :- rdfs:label(c, 'Working memory'), cogat_subclass_of(x, c), cogat_term(x, t), mentions(s, t)"
      squall:
        - "obtain every Study that mentions 'pain'."
        - "obtain every Weighted_mention (?s; ?t; ?w) such that ?t is 'pain' and ?w is greater than 0.1."
        - "obtain every Voxel (?i; ?j; ?k) that a Study that mentions 'pain' reports."

  neurosynth:
    extends: coordinate_meta_analysis
    description: >
      Neurosynth database — forward and reverse inference over
      reported activation peaks, TF-IDF term frequencies, and a
      probabilistic choice over studies.
    python_init: "neurolang_apps.utils.engines.neurosynth.init"

  neurostore:
    extends: coordinate_meta_analysis
    description: >
      NeuroStore database (the one NiMARE fetches with
      ``fetch_neurostore``, behind Neurosynth Compose) — the predicates of
      neurosynth, with TF-IDF term frequencies computed from the study
      abstracts, plus the abstracts, titles and LLM-extracted cognitive
      concepts and domains of the studies.
    python_init: "neurolang_apps.utils.engines.neurostore.init"
    text_embeddings:
      study_abstracts:
        # The texts come with the release: no PubMed download.
        source:
          predicate: study_abstract
          title_predicate: study_title
        description: >-
          query_similarity(query, study) returns the cosine similarity
          between a free-text query and the study's title and abstract,
          embedded with SPECTER2.
    sorts:
      study:
        type: str
        description: "a study of the NeuroStore database"
      concept:
        columns: [concept]
        type: str
        description: "a cognitive concept extracted from the tasks of a study"
      domain:
        columns: [domain]
        type: str
        description: "a cognitive domain extracted from the tasks of a study"
    predicates:
      study_abstract:
        description: "Abstract of a study"
        arguments: [study, text]
      study_concept:
        description: "Cognitive concepts extracted from the tasks of a study"
        arguments: [study, concept]
      study_domain:
        description: "Cognitive domains extracted from the tasks of a study"
        arguments: [study, domain]
      term_in_study_tfidf:
        description: >-
          TF-IDF of the terms of the abstracts, computed from them
          (NeuroStore ships no term table)

  destrieux:
    description: >
      Destrieux 2009 cortical atlas — region definitions for the
      Destrieux cortical parcellation, each mapped to a volumetric
      brain region (ExplicitVBR).
    requires_mni_mask: true
    use_base_symbols: true
    builtins: [exp, log, startswith]
    atlases:
      destrieux:
        predicate_name: destrieux
        description: "Cortical region name and ExplicitVBR geometry"
    datalog_init: |
      left_region(N, R) :- destrieux(N, R), startswith('lh', N)
      right_region(N, R) :- destrieux(N, R), startswith('rh', N)
    sorts:
      label:
        columns: [name]
        type: str
        atlas: destrieux
        description: "a Destrieux region name"
      region:
        columns: [region]
        type: ExplicitVBR
        description: "a brain region"
    predicates:
      destrieux:
        description: "Cortical region name and ExplicitVBR geometry"
        arguments:
          - label
          - region
      left_region:
        description: "Left-hemisphere Destrieux regions"
        arguments:
          - label
          - region
      right_region:
        description: "Right-hemisphere Destrieux regions"
        arguments:
          - label
          - region

