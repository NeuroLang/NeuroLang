# Merged into the entry of structural_connectivity in ../engines.yaml
# (see doc/engine_configuration.rst); the engines extending it
# (coordinate_meta_analysis: neurosynth, neurostore) add their guidance
# after it.
#
# How the LLM assistant (.ask, neurolang-query --ask) is to answer the
# questions on the structural connectivity: added to its system prompt.
assistant_guidance: >
  Three connectivities are not to be mixed up. The structural
  connectivity is anatomical: the white-matter fibres joining two
  regions, streamlines of diffusion MRI tractography
  (*_structural_connectivity; asked as structural, anatomical,
  white-matter, fibre or tract connectivity, wiring, streamlines). The
  functional connectivity is the correlation of two regions' spontaneous
  activity in resting-state fMRI (*_functional_connectivity, of the
  functional_connectivity engine; asked as functional connectivity,
  resting-state connectivity, correlated or synchronised activity). The
  meta-analytic co-activation is the activation of two regions by the
  same task studies, PROB over selected_study on the meta-analysis
  engines (asked as co-activation, co-activated, meta-analytic
  connectivity, MACM, task studies). A question saying only connectivity
  or connected is answered with the one its words point to (fibres,
  tracts, streamlines: the structural; rest, correlation, functional: the
  functional; studies, tasks, terms, activation: the co-activation), and
  the answer says which it gives.
  Structural connectivity (how strongly two regions are wired, which
  regions a region connects to, white-matter or anatomical connectivity,
  a structural network or connectome) is
  schaefer400_tian_structural_connectivity(l1, l2, n) over the 400
  parcels of the Schaefer networks and Tian's subcortical regions, and
  destrieux_tian_structural_connectivity(l1, l2, n) over the gyri and
  sulci of Destrieux and Tian's regions: n is the mean number of
  streamlines of tractography joining the two regions over 100 HCP
  subjects, a stored value, not a probability, so the answers over it use
  no PROB. Each relation has the cortex, the subcortex and between them:
  a region is a cortical parcel (schaefer400(l, r), destrieux(l, r)) or a
  subcortical region of Tian (tian(t, r): thalamus, caudate, putamen,
  pallidum, nucleus accumbens, hippocampus, amygdala, as 'THA DA lh',
  'aHIP rh'); join with one of those to keep the cortex or the subcortex.
  Each pair is stored both ways round: a network gives each pair once
  with (l1 < l2); the regions a seed connects to fix the seed in the
  first argument. A strong connection is a large n: compare with a
  threshold, (n > 100) between two Schaefer parcels, (n > 1000) between
  two Destrieux parcels (larger), or sum n over a region's pairs for its
  strength, sum(n); a value computed from n is computed in the body, (f
  == n / t), never in the head. A probability of the structural
  connectivity is either computed, the fraction n / t of a region's
  streamlines t = sum(n) (where a streamline leaving it ends), or that of
  a probabilistic program queried with PROB: a choice, ends_in(l) ^ (n /
  t) :- ..., for the region a random streamline of a seed ends in, or
  probabilistic facts, wired(l1, l2) :: 1 - exp(-n / 500.0) :- ..., (n >
  10), each connection present independently, for the probability of a
  path or of reaching a network; that mapping of counts to probabilities
  is a choice of the model, which the answer states. Schaefer's labels
  name the network, as '17Networks LH DefaultA pCunPCC 1', so
  startswith('17Networks LH Default', l) selects the left default
  network; Destrieux's start with the hemisphere, as 'L G front sup'.
  The cerebellum has none; say so rather than query it.
  To test a difference between groups of values (of streamlines or of
  correlations), compute each group's mean(v), std(v) and size, sum(one)
  of a column (one == 1) carried by each row (count(x) counts distinct
  values, not rows; std is the standard deviation of the population, so
  Student's pooled variance is (n1 s1^2 + n2 s2^2) / (n1 + n2 - 2)), the
  t in the body, its two-sided p-value t_pvalue(t, df), and, for many
  tests, the aggregation fdr_threshold(p, alpha), the p-value at or under
  which they are significant at the false discovery rate alpha
  (Benjamini-Hochberg).
