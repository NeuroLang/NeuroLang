# The example queries of structural_connectivity, merged into its entry of
# ../engines.yaml (see doc/engine_configuration.rst): the questions the
# REPL shows first (questions), the queries it shows (examples) and the
# few-shot examples of the query assistant (assistant_examples), which
# the engines extending it (neurosynth, neurostore) inherit before their
# own. Every query is checked against the engine by the tests
# (NEUROLANG_TEST_DATA_DIR).
questions:
  - Which regions is the left superior frontal gyrus structurally connected to?
  - What is the structural network of the left default mode network?
  - Which cortical parcels is the thalamus structurally connected to, and by how many streamlines?
  - What is the probability that a white-matter streamline leaving the left angular gyrus ends in each region?
examples:
  datalog:
    - "ans(l, n) :- destrieux_tian_structural_connectivity('L G front sup', l, n)"
    - "ans(l1, l2, n) :- schaefer400_tian_structural_connectivity(l1, l2, n), (l1 < l2), (n > 1000)"
    - "ans(l, sum(n)) :- schaefer400_tian_structural_connectivity(l, l2, n)"

# Questions on the structural connectivity: the anatomical wiring of the
# brain, white-matter streamlines of diffusion MRI tractography, never the
# resting-state functional connectivity (functional_connectivity) nor the
# co-activation of regions by studies (the meta-analysis engines). Two
# relations, each of every pair of regions of the cortex and the subcortex
# of an atlas: schaefer400_tian_structural_connectivity (the 400 Schaefer
# parcels, as '17Networks LH DefaultA PFCd 1', and Tian's regions, as
# 'THA DA lh') and destrieux_tian_structural_connectivity (the Destrieux
# parcels, as 'L G front sup', and Tian's). schaefer400(l, r),
# destrieux(l, r) and tian(t, r) tell a region's atlas. Its values are
# mean streamline counts, stored: they are answered without PROB, as
# counts, sums, thresholds; or turned into probabilities, either computed
# (a fraction of the streamlines) or as the probabilities of
# probabilistic facts or choices, which PROB then queries. A network
# gives each pair once (l1 < l2), as .view draws it; a seed region fixes
# the first argument.
assistant_examples:
  # Counts: the wiring itself.
  - question: Which regions is the left superior frontal gyrus structurally connected to?
    datalog: |-
      ans(region, streamlines) :- destrieux_tian_structural_connectivity('L G front sup', region, streamlines)

  - question: What is the structural connectivity of the left angular gyrus, its connections of more than 500 white-matter streamlines?
    datalog: |-
      ans(region, streamlines) :- destrieux_tian_structural_connectivity('L G pariet inf Angular', region, streamlines), (streamlines > 500)

  - question: Which pairs of gyri and sulci are structurally connected by more than 5000 white-matter streamlines?
    datalog: |-
      ans(l1, l2, streamlines) :- destrieux_tian_structural_connectivity(l1, l2, streamlines), destrieux(l1, r1), destrieux(l2, r2), (l1 < l2), (streamlines > 5000)

  - question: What is the structural network of the left default mode network?
    datalog: |-
      default_left(l) :- schaefer400(l, r), startswith('17Networks LH Default', l)
      ans(l1, l2, streamlines) :- schaefer400_tian_structural_connectivity(l1, l2, streamlines), default_left(l1), default_left(l2), (l1 < l2), (streamlines > 100)

  - question: Which Schaefer parcels have the strongest structural connectivity?
    datalog: |-
      ans(region, sum(n)) :- schaefer400_tian_structural_connectivity(region, l2, n), schaefer400(region, r)

  - question: How many regions is the left precentral gyrus structurally connected to by more than 100 streamlines?
    datalog: |-
      ans(count(l)) :- destrieux_tian_structural_connectivity('L G precentral', l, n), (n > 100)

  - question: How many white-matter streamlines structurally connect the left and the right cortex?
    datalog: |-
      between(l1, l2, n) :- destrieux_tian_structural_connectivity(l1, l2, n), startswith('L ', l1), startswith('R ', l2)
      ans(sum(n)) :- between(l1, l2, n)

  - question: Which regions are two strong structural connections away from the left superior frontal gyrus (more than 1000 streamlines each)?
    datalog: |-
      strong(l1, l2) :- destrieux_tian_structural_connectivity(l1, l2, n), (n > 1000)
      ans(region) :- strong('L G front sup', m), strong(m, region), (region != 'L G front sup')

  # The subcortex: Tian's regions are in the same relations.
  - question: Which cortical parcels is the thalamus structurally connected to, and by how many streamlines?
    datalog: |-
      thalamus(t) :- tian(t, r), startswith('THA', t)
      ans(region, sum(n)) :- schaefer400_tian_structural_connectivity(t, region, n), thalamus(t), schaefer400(region, r)

  - question: What is the structural network among the subcortical regions, its pairs of more than 100 streamlines?
    datalog: |-
      ans(t1, t2, streamlines) :- schaefer400_tian_structural_connectivity(t1, t2, streamlines), tian(t1, r1), tian(t2, r2), (t1 < t2), (streamlines > 100)

  - question: Which subcortical regions are the parcels of the left default mode network structurally connected to, and by how many streamlines?
    datalog: |-
      default_left(l) :- schaefer400(l, r), startswith('17Networks LH Default', l)
      ans(structure, sum(n)) :- schaefer400_tian_structural_connectivity(l, structure, n), default_left(l), tian(structure, r)

  # From counts to probabilities, computed: a fraction of the
  # streamlines, in the body (f == n / t), never in the head.
  - question: What is the probability that a white-matter streamline leaving the left angular gyrus ends in each region?
    datalog: |-
      strength(l, sum(n)) :- destrieux_tian_structural_connectivity(l, l2, n)
      ans(l2, probability) :- destrieux_tian_structural_connectivity('L G pariet inf Angular', l2, n), strength('L G pariet inf Angular', t), (probability == n / t)

  - question: What fraction of the white-matter streamlines of the left posterior cingulate (precuneus) parcel go to each other region?
    datalog: |-
      strength(l, sum(n)) :- schaefer400_tian_structural_connectivity(l, l2, n)
      ans(l2, fraction) :- schaefer400_tian_structural_connectivity('17Networks LH DefaultA pCunPCC 1', l2, n), strength('17Networks LH DefaultA pCunPCC 1', t), (fraction == n / t)

  - question: What is the probability that a white-matter streamline, drawn at random, structurally connects each pair of regions?
    datalog: |-
      total(sum(n)) :- schaefer400_tian_structural_connectivity(l1, l2, n), (l1 < l2)
      ans(l1, l2, probability) :- schaefer400_tian_structural_connectivity(l1, l2, n), (l1 < l2), total(t), (probability == n / t)

  # The structural connectivity as a probabilistic program. A choice (^):
  # a streamline drawn at random from a region ends in exactly one region,
  # with the probability of its fraction. Probabilistic facts (::): each
  # connection is there or not, independently, with a probability growing
  # with its streamlines, 1 - exp(-n / 500) (100 streamlines: 0.18, 1000:
  # 0.86; a choice of the model, to tell), the weakest (10 streamlines or
  # fewer) left out; PROB gives the probability of a path, of reaching a
  # network.
  - question: If a white-matter streamline is drawn at random from the left posterior cingulate (precuneus) parcel, what is the probability that it ends in the default mode network?
    datalog: |-
      strength(sum(n)) :- schaefer400_tian_structural_connectivity('17Networks LH DefaultA pCunPCC 1', l, n)
      ends_in(l) ^ (n / t) :- schaefer400_tian_structural_connectivity('17Networks LH DefaultA pCunPCC 1', l, n), strength(t)
      default(l) :- schaefer400(l, r), startswith('17Networks LH Default', l)
      default(l) :- schaefer400(l, r), startswith('17Networks RH Default', l)
      in_default(x) :- ends_in(l), default(l), (x == 'default')
      ans(probability) :- PROB[in_default(x)] = probability

  - question: Taking each structural connection as present with probability 1 - exp(-n / 500), what is the probability that each region is structurally connected to the left default mode network?
    datalog: |-
      wired(l1, l2) :: 1 - exp(-n / 500.0) :- schaefer400_tian_structural_connectivity(l1, l2, n), (n > 10)
      default_left(l) :- schaefer400(l, r), startswith('17Networks LH Default', l)
      to_default(x) :- wired(x, l), default_left(l)
      ans(region, probability) :- PROB[to_default(region)] = probability

  - question: Taking each structural connection as present with probability 1 - exp(-n / 2000), what is the probability that the left superior frontal gyrus reaches the left angular gyrus in at most two structural steps?
    datalog: |-
      wired(l1, l2) :: 1 - exp(-n / 2000.0) :- destrieux_tian_structural_connectivity(l1, l2, n), (n > 100)
      reach(l) :- wired('L G front sup', l)
      reach(l) :- wired('L G front sup', m), wired(m, l)
      target(l) :- reach(l), (l == 'L G pariet inf Angular')
      ans(probability) :- PROB[target(l)] = probability
