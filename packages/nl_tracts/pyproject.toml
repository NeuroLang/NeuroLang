[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nl-tracts"
dynamic = ["version"]
description = "Tractography for NeuroLang: tractograms and atlases as extensional relations"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
keywords = ["tractography", "diffusion MRI", "white matter", "datalog"]
# The core (atlas, tractogram, indexing, cache) needs numpy, scipy, nibabel,
# pandas and, for the parquet cache of pandas, pyarrow. ``neurolang`` is
# needed by nl_tracts.frontend only; see DESIGN.md.
dependencies = [
    "neurolang",
    "numpy",
    "scipy",
    "nibabel>=5.0.0",
    "pandas>=1.5",
    "pyarrow",
]

[project.scripts]
nl-tracts = "nl_tracts.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # Only the tests build atlases from nilearn objects (DESIGN.md, 4.2).
    "nilearn>=0.10.0",
]

[tool.uv.sources]
neurolang = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["nl_tracts"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }
